        <div class="form-group"><label>装机容量 (kW)</label><input class="form-input" type="number" id="nbCapacity" min="0" step="10" value="${b?val(b.capacity):''}" placeholder="选填"></div>
        <div class="form-group"><label>基准负荷 (kW) *</label><input class="form-input" type="number" id="nbBase" min="0" step="10" value="${b?val(b.baseLoad):''}" placeholder="未调节运行功率"></div>
        <div class="form-group"><label>实测标杆 (kW)</label><input class="form-input" type="number" id="nbSource" min="0" step="10" value="${b?val(b.sourcePotential):''}" placeholder="选填，无则按设备模型算"></div>
        <div class="form-group"><label>安全上限 (kW)</label><input class="form-input" type="number" id="nbSafe" min="0" step="10" value="${b?val(b.safeLimit):''}" placeholder="选填，默认基准×30%"></div>
      </div>

  submitAdd(id,btn){
    const g=k=>document.getElementById(k);
    /* 校验失败必须看得见：字段红框 + 就地红字 + 底部提示条，并聚焦到出错的框 */
    const clearErr=()=>{
      document.querySelectorAll('.field-err').forEach(e=>e.remove());
      document.querySelectorAll('.nb-invalid').forEach(e=>e.classList.remove('nb-invalid'));
    };
    const fail=(msg,fieldId)=>{
      clearErr();
      const el=fieldId?document.getElementById(fieldId):null;
      if(el){
        el.classList.add('nb-invalid');
        const tip=document.createElement('div');
        tip.className='field-err';tip.textContent=msg;
        (el.closest('.range-row')||el).parentNode.appendChild(tip);
        try{el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'});}catch(e){}
      }
      showToast(msg,'error');
      return false;
    };
    clearErr();
    const name=(g('nbName').value||'').trim();
    const base=parseFloat(g('nbBase').value);
    const incentive=g('nbIncentive').value;
    if(!name)return fail('请填写楼宇名称','nbName');
    if(!Number.isFinite(base)||base<=0)return fail('请填写有效的基准负荷（大于 0 的数值）','nbBase');
    if(incentive!=='是'&&incentive!=='否')return fail('请选择「能否响应激励政策」','nbIncentive');
    const source=parseFloat(g('nbSource').value);
    if(Number.isFinite(source)&&source>base)return fail('实测标杆不能大于基准负荷','nbSource');
    const lowRaw=(g('nbComfortLow').value||'').trim(),highRaw=(g('nbComfortHigh').value||'').trim();
    let comfort=null;
    if(lowRaw||highRaw){
      const lo=parseFloat(lowRaw),hi=parseFloat(highRaw);
      if(!Number.isFinite(lo)||!Number.isFinite(hi))return fail('舒适温度区间需同时填写下限与上限','nbComfortLow');
      if(lo>=hi)return fail(`舒适温度下限 ${lo}℃ 需小于上限 ${hi}℃`,'nbComfortLow');
      if(lo<16||hi>32)return fail('舒适温度区间需在 16~32℃ 之间','nbComfortLow');
      comfort=`${lo}-${hi}`;
    }
    const safe=parseFloat(g('nbSafe').value);
    const rec={
      id,name,district:g('nbDistrict').value,type:g('nbType').value,acType:g('nbAC').value,
      capacity:parseFloat(g('nbCapacity').value)||0,
      baseLoad:base,
      sourcePotential:Number.isFinite(source)?source:undefined,
      safeLimit:Number.isFinite(safe)?safe:undefined,
      setTemp:Number.isFinite(parseFloat(g('nbSetTemp').value))?parseFloat(g('nbSetTemp').value):null,
      incentive:incentive==='否'?'无激励':'有激励',
      comfort,
      maxTempOffset:Number.isFinite(parseFloat(g('nbMaxOff').value))?parseFloat(g('nbMaxOff').value):undefined
    };
    const isEdit=BUILDINGS.some(b=>b.id===id&&b.custom);
    const before=CityPotential.mw(SampleBaseline.LOCKED_CITY_TOTALS.neutral*SampleBaseline.overallScale());
    try{
      CustomBuildingStore.add(rec);
    }catch(e){
      return fail('保存失败：'+(e&&e.message?e.message:'未知错误'));
    }
    btn.closest('.modal-overlay').remove();
    SystemSync.refresh();
    const after=CityPotential.mw(SampleBaseline.LOCKED_CITY_TOTALS.neutral*SampleBaseline.overallScale());
    if(Number.isFinite(source)&&source>0){
      showToast(`${isEdit?'已更新':'已新增'}「${name}」，全市测算同步 ${before.toFixed(1)} → ${after.toFixed(1)} MW`,'success');
    }else{
      showToast(`${isEdit?'已更新':'已新增'}「${name}」，但缺实测标杆：已进楼宇库，补录后自动纳入测算`,'warn');
    }
  },
  openImport(){
    const sample='名称,区县,业态,空调类型,装机容量,基准负荷,实测标杆,安全上限,设定温度,能否响应激励,舒适区间,最大上调\n重庆示例大厦,渝北区,办公写字楼,冷水机组,5000,3000,880,900,26,是,24-26,2';
    const modal=document.createElement('div');

  parseImport(){
    const raw=(document.getElementById('nbBulkText')?.value||'').trim();
    if(!raw)return{rows:[],errors:['请先粘贴楼宇数据']};
    const lines=raw.split(/\r?\n/).filter(l=>l.trim());
    const errors=[],rows=[];
    lines.forEach((line,idx)=>{
      const cells=line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>c.trim().replace(/^"|"$/g,''));
      if(idx===0&&/名称|楼宇/.test(cells[0])&&!/^\d/.test(cells[0]))return; // 跳过表头
      const no=idx+1;
      if(cells.length<6){errors.push(`第 ${no} 行：列数不足（至少 6 列）`);return}
      const [name,district,type,acType,cap,base,source,safe,setT,inc,comfort,maxOff]=cells;
      if(!name||!district||!type||!acType){errors.push(`第 ${no} 行：名称/区县/业态/空调类型不能为空`);return}
      if(!BUILDING_TYPES.includes(type)){errors.push(`第 ${no} 行：业态「${type}」不在六类之内`);return}
      const baseN=parseFloat(base);
      if(!Number.isFinite(baseN)||baseN<=0){errors.push(`第 ${no} 行：基准负荷无效`);return}
      const sourceN=parseFloat(source);
      if(Number.isFinite(sourceN)&&sourceN>baseN){errors.push(`第 ${no} 行：实测标杆大于基准负荷`);return}
      const incN=/^(是|有激励|Y|y)$/.test(inc||'')?'有激励':/^(否|无激励|N|n)$/.test(inc||'')?'无激励':null;
      rows.push({name,district,type,acType,capacity:parseFloat(cap)||0,baseLoad:baseN,
        sourcePotential:Number.isFinite(sourceN)?sourceN:undefined,
        safeLimit:Number.isFinite(parseFloat(safe))?parseFloat(safe):undefined,
        setTemp:Number.isFinite(parseFloat(setT))?parseFloat(setT):null,
        incentive:incN,comfort:(comfort||'').trim()||null,
        maxTempOffset:Number.isFinite(parseFloat(maxOff))?parseFloat(maxOff):undefined});
    });
    return{rows,errors};
  },
  previewImport(){
    const {rows,errors}=this.parseImport();
    const box=document.getElementById('nbBulkPreview');
    if(!box)return;
    box.innerHTML=`
      ${errors.length?`<div class="info-box warning" style="margin-bottom:10px">⚠️ ${errors.length} 行被跳过：<br>${errors.slice(0,8).map(e=>'· '+e).join('<br>')}${errors.length>8?'<br>…':''}</div>`:''}
      ${rows.length?`<div class="info-box green">✅ 解析出 ${rows.length} 条可导入记录</div>
      <div class="data-table-wrapper" style="max-height:220px;overflow:auto"><table class="data-table">
        <thead><tr><th>名称</th><th>区县</th><th>业态</th><th>空调</th><th>基准(kW)</th><th>标杆(kW)</th><th>设定(℃)</th><th>激励</th><th>舒适区间</th></tr></thead>
        <tbody>${rows.slice(0,20).map(r=>`<tr><td style="text-align:left">${r.name}</td><td>${r.district}</td><td>${r.type}</td><td>${r.acType}</td><td class="num">${fmtInt(r.baseLoad)}</td><td class="num">${r.sourcePotential===undefined?'—':fmtInt(r.sourcePotential)}</td><td class="num">${r.setTemp??'待采集'}</td><td>${r.incentive||'<span style="color:var(--orange)">未指定</span>'}</td><td>${r.comfort||'待采集'}</td></tr>`).join('')}</tbody>

  confirmImport(btn){
    const {rows}=this.parseImport();

    valid.forEach(r=>{CustomBuildingStore.add({...r,id:id++})});
    btn.closest('.modal-overlay').remove();
    SystemSync.refresh();
    showToast(`已导入 ${valid.length} 栋楼宇${skipped?`，${skipped} 条因未指定激励政策被跳过`:''}${noBench?`；其中 ${noBench} 栋缺标杆仅进楼宇库`:''}`);
  },

  /* 与页面筛选同源，导出/重绘共用一份口径，避免导出内容与屏幕不一致 */
  filtered(){

  exportCSV(){
    const rows=this.filtered();
    if(!rows.length){showToast('当前筛选没有可导出的楼宇');return;}
    const offsetArg=this.tempMode==='building'?'按楼宇配置':this.tempOffset;
    const results=PotentialEngine.calcAll(rows,this.outdoorTemp,null,this.incentive,offsetArg);
    let csv='\ufeff楼宇ID,楼宇名称,业态,空调类型,区县,装机容量kW,基准负荷kW,实测标杆kW,安全上限kW,优先级,室外温度,设定温度,激励政策,最大上调幅度,实际上调幅度,可调潜力kW,可调比例,安全提示\n';
    results.forEach((r,i)=>{
      const b=rows[i];
      csv+=[b.id,b.name,b.type,b.acType,b.district,b.capacity,b.baseLoad,b.sourcePotential??'',b.safeLimit??'',b.priority,
        this.outdoorTemp,b.setTemp,this.incentive==='按楼宇配置'?b.incentive:this.incentive,b.maxTempOffset,Math.min(this.tempMode==='building'?b.tempOffset:this.tempOffset,b.maxTempOffset),fmt(r.potential,2),r.potentialPct+'%',r.comfortExcess>0?`超舒适区+${r.comfortExcess}℃`:(r.capped?'提示·口径不一致':'正常')].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')+'\n';
    });
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='楼宇可调潜力计算结果_'+new Date().toISOString().slice(0,10)+'.csv';a.click();

};

/* ============================================================
   模块四：楼宇协同联动策略
   调控任务 → 能力与约束 → 初次分配与协同承接 → 执行闭环
============================================================ */
const ConsistencyCheck={
  results(){
    const sample=DATA_PROFILE.validate();
    const sampleLimits=BUILDINGS.every(b=>b.sourcePotential===undefined||(b.sourcePotential>=0&&b.sourcePotential<=b.baseLoad+0.01));
    const city=CityPotential.standardCheck();
    if(!DistrictAlloc.districts.length)DistrictAlloc.compute();
    const cityTotal=CityPotential.mw(CityPotential.totals().neutral);
    const districtPotential=DistrictAlloc.districts.reduce((s,d)=>s+d.potential,0);
    const a7Potential=DistrictAlloc.DEFAULT_DISTRICTS.reduce((s,d)=>s+d.potential,0);
    const cityDispatch=CityPotential.mw(CityPotential.totals().dispatch20);
    const districtTarget=parseFloat(DistrictAlloc.params['全域削峰总目标'].value)||0;
    // 中性潜力(1282MW)是样本外推的资源量；区县理论潜力合计(1225.2MW)是附件7分配权重基准，
    // 两者本就是两个口径，此处只防基准被改动、并核对目标来源（自动同步 / 手动覆盖）。
    const potentialOk=Math.abs(districtPotential-a7Potential)<0.1;
    const targetSynced=Math.abs(cityDispatch-districtTarget)<0.11;
    const manualTarget=DistrictAlloc.autoSyncTarget===false;
    const parent=DistrictAlloc.districts.find(d=>d.name===Aggregate.selectedDistrict);
    const parentTarget=parent?.final_target||0;
    /* 未进入协同页时 synergySummary 尚未生成，用零值占位，避免整页校验崩掉 */
    const summary=Aggregate.synergySummary||{target:0,initial:0,transferred:0,final:0,gap:0,capacity:0,coverage:1};
    const synergyB=Array.isArray(Aggregate.synergyBuildings)?Aggregate.synergyBuildings:[];
    const aggregateTarget=summary.target/1000;
    const conservation=Math.abs(summary.final+summary.gap-summary.target)<0.1;
    const capacity=synergyB.reduce((s,b)=>s+(Number.isFinite(b.safety_limit)?b.safety_limit:0),0);
    const coverage=summary.coverage??(summary.target>0?Math.min(1,capacity/summary.target):1);
    /* 缺口必须能由"清单可执行能力不足"解释；能力足够却仍有缺口说明分配逻辑异常 */
    const gapExplained=summary.gap<=0.1||coverage<0.999||summary.final<=0;
    /* 能力口径同源：安全上限 = min(计划上限, 执行能力)，任务不得超出该上限 */
    const sameSource=synergyB.every(b=>Number.isFinite(b.executable)&&b.executable>0
      &&Math.abs(b.safety_limit-Math.min(b.planCapacity,b.executable))<0.01
      &&b.final_target<=b.executable+0.01&&b.potential<=b.baseLoad+0.01);
    const runs=Object.entries(Aggregate.executionResults||{});
    /* 基准样本同步：基准 ids 必须都还在台账里；自动跟随下样本应覆盖全部有效标杆楼宇 */
    const bsState=SampleBaseline.state;
    const bsIdsOk=!bsState||bsState.ids.every(id=>BUILDINGS.some(b=>b.id===id));
    const bsCountOk=!bsState||Math.abs(bsState.profile.count-BUILDINGS.filter(b=>SampleBaseline.isBaseline(b)).length)<1;
    const baseSampleN=DATA_PROFILE.standard().count;
    const notInSample=BUILDINGS.length-baseSampleN;
    const missingBench=BUILDINGS.filter(b=>!(Number.isFinite(b.sourcePotential)&&b.sourcePotential>0)).length;
    const baselineOk=bsIdsOk&&bsCountOk&&sample.pass;
    /* 只要有楼进了楼宇库却没进样本（缺标杆 或 关闭了自动跟随），就是"需关注"，不是异常 */
    const baselineStatus=!baselineOk?(SampleBaseline.auto?'fail':'warn'):(notInSample>0?'warn':'pass');
    const baselineDetail=SampleBaseline.auto
      ?`自动跟随楼宇库：基准样本 ${baseSampleN} 栋 / 当前楼宇库 ${BUILDINGS.length} 栋${notInSample?`，其中 ${notInSample} 栋未纳入样本（缺实测标杆 ${missingBench} 栋），补录标杆即自动计入`:'，新增与删除已实时重算'}`
      :(bsState?`手动基准「${SampleBaseline.label()}」${bsState.profile.count} 栋；楼宇库共 ${BUILDINGS.length} 栋，${notInSample} 栋未纳入样本，增删不会自动生效`
        :`合同锁定 ${baseSampleN} 栋：楼宇库 ${BUILDINGS.length} 栋中 ${notInSample} 栋未纳入样本，需手动设为基准`);
    /* 真实达成率检查：仿真削减必须等于分配任务（允许取整误差），不再只校验"不超过" */
    const runValid=runs.length>0&&runs.every(([id,r])=>{
      const b=synergyB.find(x=>x.id===Number(id));
      return b&&Number.isFinite(r.actualReduction)
        &&r.actualReduction>=b.final_target-1.01
        &&Math.abs(r.gap-Math.max(0,b.final_target-r.actualReduction))<1.01;
    });

  computeSynergy(){

    const totalTargetKW=this.districtTask()*1000;
    const maxRatio=P['单楼宇安全利用比例'];

      const scale=benchmark?.sourcePotential?calibratedPotential/benchmark.sourcePotential:1;
      const responseMin=b.acType.includes('多联机')&&!b.acType.includes('冷水机组')?5:15;
      const constraint=b.category==='商业综合体'?'避让餐饮、影院、儿童区和大型活动':b.category==='商超'?'避让冷链、生鲜及熟食区域':b.category==='酒店'?'避让在用客房、会议宴会和重要接待':b.category==='党政机关'?'避让机房、会议和政务窗口':b.category==='企事业单位'?'避让工艺、实验及连续保障区域':'避让敏感租户和重点区域';
      return{...b,seq:index+1,type:b.category,potential:calibratedPotential,sourcePotential:calibratedPotential,baseLoad:b.baseLoad||(benchmark?.baseLoad||calibratedPotential*5)*scale,capacity:b.capacity||(benchmark?.capacity||calibratedPotential*7)*scale,safeLimit:calibratedPotential,setTemp:b.setTemp??benchmark?.setTemp??26,incentive:b.incentive||benchmark?.incentive||'有激励',tempOffset:b.tempOffset??b.maxTempOffset??benchmark?.tempOffset??1,maxTempOffset:b.maxTempOffset??benchmark?.maxTempOffset??1,available:b.available!==false,weight,weightedPot,responseMin,constraint,eligible:b.available!==false,checkStatus:b.available===false?'当前不可用':'具备调控条件',dataSource:b.fromLedger?(b.ledgerId>61?'台账新增户·实时联动':'台账实测标杆·实时联动'):b.custom?'用户录入/Excel导入':b.benchmarkId?'实测台账对象校准':'同类样本标杆估算',calibrationName:benchmark?.name||'同类样本'};

    /* 能力口径统一：计划上限 = 稳定能力×95%（资源量口径，仅作对照）；
       实际下发给执行的安全上限 = min(计划上限, 单体执行可兑现能力)，
       后者 = 三级策略最大可提供量 × 历史响应率，与 SingleExecution 完全同源。 */
    this.synergyBuildings.forEach(b=>{
      b.planCapacity=b.potential*maxRatio;
      b.executable=SingleExecution.availableCapacity(b,outdoor,b.incentive);
      b.capacityNote=b.executable<b.planCapacity?'策略/响应率约束':'安全利用比例约束';
    });
    const totalWeighted=this.synergyBuildings.reduce((s,b)=>s+b.weightedPot,0);
    this.synergyBuildings.forEach(b=>{
      b.initial_target=totalWeighted>0?(b.weightedPot/totalWeighted)*totalTargetKW:0;
      b.safety_limit=Math.min(b.planCapacity,b.executable);
      b.initial_executable=Math.min(b.initial_target,b.safety_limit);
      b.transfer_out=Math.max(0,b.initial_target-b.initial_executable);
      b.remaining_space=Math.max(0,b.safety_limit-b.initial_executable);
      b.accepted=0;
    });
    const totalDeficit=this.synergyBuildings.reduce((s,b)=>s+b.transfer_out,0);
    const donors=this.synergyBuildings.filter(b=>b.remaining_space>0.005);
    const totalSafeSpace=donors.reduce((s,b)=>s+b.remaining_space*mutualSafety,0);
    const availableAid=Math.min(totalDeficit,totalSafeSpace);
    donors.forEach(b=>{b.accepted=totalSafeSpace>0?availableAid*(b.remaining_space*mutualSafety/totalSafeSpace):0;});
    this.synergyBuildings.forEach(b=>{
      b.final_target=b.initial_executable+b.accepted;
      b.adjustment=b.final_target-b.initial_target;
      b.final_util=b.safety_limit>0?b.final_target/b.safety_limit:0;
      b.final_compliance=b.final_util<=1.0?'合规':'超限';

      const m=StrategyLibrary.match(b,b.final_target,outdoor,b.incentive);
      b.strategyLevel=m.matchedLevel===1?'Ⅰ级':m.matchedLevel===2?'Ⅱ级':'Ⅲ级';
      b.strategyCode=m.strategyCode;
    });
    const final=this.synergyBuildings.reduce((s,b)=>s+b.final_target,0);
    /* 清单可承接能力 = 各栋安全上限合计（已取 min(计划上限, 执行能力)），
       比单纯累加执行能力更贴近分配层真正能下达的任务量。 */
    const capacity=this.synergyBuildings.reduce((s,b)=>s+b.safety_limit,0);
    const planCapacity=this.synergyBuildings.reduce((s,b)=>s+b.planCapacity,0);
    const executableTotal=this.synergyBuildings.reduce((s,b)=>s+b.executable,0);

    this.synergySummary={target:totalTargetKW,initial:this.synergyBuildings.reduce((s,b)=>s+b.initial_executable,0),

      coverage:totalTargetKW>0?Math.min(1,capacity/totalTargetKW):1,
      gap:Math.max(0,totalTargetKW-final)};

  modelPrinciple(){

    const ex=[...bs].sort((a,b)=>(b.final_target||0)-(a.final_target||0))[0];
    const exPct=ex&&tw>0?ex.weightedPot/tw*100:0;
    return `<details class="calc-logic" style="margin-top:14px">

        <div class="grp-cap">第一步 · 任务切分 <em>· 三级优先级权重决定份额</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">① 权重取用</span><span class="fexpr">w<sub>i</sub> = ω<sub>π(i)</sub>　，　ω<sub>一/二/三级</sub> = ${w1} / ${w2} / ${w3}</span></div>
          <div class="formula-row"><span class="fcase">② 初次目标</span><span class="fexpr">P<sub>i,target</sub> = P<sub>t</sub> · ( Q<sub>i</sub> · w<sub>i</sub> ) ÷ Σ<sub>j</sub>( Q<sub>j</sub> · w<sub>j</sub> )</span></div>
        </div>

        <div class="grp-cap">第二步 · 安全封顶 <em>· 每栋不超可兑现上限，超出部分转出</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">③ 安全上限</span><span class="fexpr">P<sub>cap,i</sub> = min[ μ<sub>L</sub>·Q<sub>i</sub> , E<sub>i</sub> ]　，　E<sub>i</sub> = max<sub>ℓ</sub>C<sub>i</sub>(ℓ) · r<sub>i</sub></span></div>
          <div class="formula-row"><span class="fcase">④ 初始可执行</span><span class="fexpr">P<sub>i,real</sub> = min[ P<sub>i,target</sub> , P<sub>cap,i</sub> ]　，　d<sub>i</sub> = max[ 0 , P<sub>i,target</sub> − P<sub>i,real</sub> ]</span></div>
        </div>

        <div class="grp-cap">第三步 · 楼内互济 <em>· 富余楼补缺口楼，κ 保留本地裕度</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">⑤ 可调用余量</span><span class="fexpr">S<sub>i</sub> = max[ 0 , P<sub>cap,i</sub> − P<sub>i,real</sub> ]　，　R<sub>i</sub> = κ · S<sub>i</sub></span></div>
          <div class="formula-row"><span class="fcase">⑥ 互济与分摊</span><span class="fexpr">A = min[ Σ<sub>i</sub>d<sub>i</sub> , Σ<sub>i</sub>R<sub>i</sub> ]　，　a<sub>i</sub> = A · R<sub>i</sub> ÷ Σ<sub>j</sub>R<sub>j</sub></span></div>
          <div class="formula-row"><span class="fcase">⑦ 最终任务</span><span class="fexpr">P<sub>i</sub>* = P<sub>i,real</sub> + a<sub>i</sub></span></div>
        </div>

        <div class="grp-cap">第四步 · 策略匹配 <em>· 取能满足任务的最低等级，不写死</em></div>

          <div class="formula-row"><span class="fcase">⑧ 策略等级</span><span class="fexpr">ℓ<sub>i</sub> = min{ ℓ : C<sub>i</sub>(ℓ) ≥ P<sub>i</sub>* }　，　ℓ ∈ Ⅰ / Ⅱ / Ⅲ 级　，三级仍不足取 Ⅲ 级报缺口</span></div>
          <div class="formula-row"><span class="fcase">⑨ 达标判定</span><span class="fexpr">e<sub>i</sub> = ( P<sub>i</sub>* − P<sub>i</sub><sup>仿真</sup> ) ÷ P<sub>i</sub>*　，　e<sub>i</sub> ≤ δ 判达标</span></div>
        </div>

        <div class="sym-cap">符号含义与参数依据</div>

          <thead><tr><th>符号</th><th>含义</th><th>取值 · 依据</th></tr></thead>

            <tr><td>Q<sub>i</sub></td><td>楼宇稳定可调能力</td><td>台账实测标杆优先，无标杆按设备模型推算；本区 ${n} 栋合计 ${fmt(potSum,1)} kW</td></tr>
            <tr><td>ω<sub>1</sub>/ω<sub>2</sub>/ω<sub>3</sub></td><td>三级优先级权重</td><td>一级 ${w1}（写字楼/商业综合体）、二级 ${w2}（酒店/商超）、三级 ${w3}（政务/医院）；权重越大分到任务越多</td></tr>
            <tr><td>w<sub>i</sub></td><td>楼宇实际权重</td><td>= ω<sub>π(i)</sub>，按该楼优先级取对应的一档</td></tr>
            <tr><td>P<sub>t</sub></td><td>本区任务</td><td>${fmt(s.target,0)} kW = 区县页最终任务 × 1000，随方案 A/B 切换联动</td></tr>
            <tr><td>P<sub>i,target</sub></td><td>初次目标</td><td>按 Q<sub>i</sub>·w<sub>i</sub> 的份额切分，ΣP<sub>i,target</sub> 恒等于 P<sub>t</sub></td></tr>
            <tr><td>μ<sub>L</sub></td><td>单楼宇安全利用比例</td><td>${muL}；61 户实测稳定上限 93%~97%，计划量不超稳定能力的该比例</td></tr>
            <tr><td>E<sub>i</sub></td><td>单体可兑现能力</td><td>= 三级策略最大可提供量 × 历史响应率 r<sub>i</sub>，与单体执行页同源</td></tr>
            <tr><td>P<sub>cap,i</sub></td><td>安全上限</td><td>= min(μ<sub>L</sub>·Q<sub>i</sub>, E<sub>i</sub>)；逐栋取小后合计 ${fmt(s.capacity,1)} kW（计划口径 ${fmt(s.planCapacity||0,1)}、执行口径 ${fmt(s.executableTotal||0,1)}）</td></tr>
            <tr><td>P<sub>i,real</sub></td><td>初始可执行</td><td>目标与上限取小；本区合计 ${fmt(s.initial,1)} kW</td></tr>
            <tr><td>d<sub>i</sub></td><td>待转出量</td><td>目标超上限的部分；本区合计 ${fmt(dSum,1)} kW</td></tr>
            <tr><td>S<sub>i</sub> / R<sub>i</sub></td><td>剩余空间 / 可调用余量</td><td>S<sub>i</sub> = 上限 − 已执行；R<sub>i</sub> = κ·S<sub>i</sub>，只动富余楼宇的余量</td></tr>

            <tr><td>A / a<sub>i</sub></td><td>互济总量 / 单楼承接量</td><td>缺口与可调用量取小后按 R<sub>i</sub> 比例分摊；本区实际发生 ${fmt(s.transferred,1)} kW${dSum>0.5&&s.transferred<0.5?'（各栋已顶到可兑现上限，没有剩余空间可互济）':''}</td></tr>

  validateBuilding(b){
    const types=['党政机关','企事业单位','办公写字楼','商业综合体','酒店','商超'],acs=['冷水机组','多联机','冷水机组 + 多联机'];
    if(!b.name||!b.district)return '楼宇名称和区县不能为空';
    if(!types.includes(b.category)||!acs.includes(b.acType)||!['一级','二级','三级'].includes(b.priority))return '业态、空调类型或优先级不符合模板选项';
    if(!(b.potential>0&&b.baseLoad>0&&b.capacity>0))return '稳定能力、基准负荷和额定容量必须大于0';
    if(b.potential>b.baseLoad)return '稳定可调能力不能超过基准负荷';
    if(!(b.setTemp>=20&&b.setTemp<=30&&b.maxTempOffset>0&&b.maxTempOffset<=5))return '设定温度或最大上调温度超出允许范围';

  saveBuildingForm(){

  async readXlsx(file){
    if(typeof JSZip==='undefined')throw new Error('Excel解析组件未加载');
    const zip=await JSZip.loadAsync(await file.arrayBuffer());
    const xml=async path=>{const entry=zip.file(path);if(!entry)throw new Error(`Excel缺少文件：${path}`);return new DOMParser().parseFromString(await entry.async('text'),'application/xml')};
    const workbook=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels');
    const first=workbook.getElementsByTagName('sheet')[0];if(!first)throw new Error('Excel中没有工作表');
    const rid=first.getAttribute('r:id')||first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');

    const keep=(v,txt)=>({v,note:txt});
    const map={};
    map['任务允许偏差']=keep(saved['任务允许偏差'],Math.abs(d(fDev))<0.5?'0.01~0.10 不影响承接量':'仅改达标判定口径');
    /* 安全利用比例：取 0.97（实测上限侧），若收益≈0 则说明已在拐点 */
    const canRatio=d(f097)>0.5&&saved['单楼宇安全利用比例']<0.97;
    map['单楼宇安全利用比例']=canRatio?{v:0.97,note:`多接 ${kwh(d(f097))}，上限 1.00 仅再 +${fmt(f100-f097,0)}`}:keep(saved['单楼宇安全利用比例'],(f097-base)/2<0.5?'已取实测上限侧，再调无收益':`已在拐点，降 1 个点少接 ${fmt((f097-base)/2,0)} kW`);
    map['协同承接安全系数']=keep(saved['协同承接安全系数'],Math.abs(d(fMut))<0.5?'各栋已顶到上限，无剩余可互济':`提到 1.00 可多接 ${fmt(d(fMut),0)} kW`);
    map['一级优先调节权重']=keep(saved['一级优先调节权重'],Math.abs(d(fW1))<0.5?'0.8~1.5 承接量不变':(d(fW1)>0?`1.5 时多接 ${fmt(d(fW1),0)} kW`:`1.5 时反降 ${fmt(-d(fW1),0)} kW`));
    map['二级辅助调节权重']=keep(saved['二级辅助调节权重'],Math.abs(d(fW2))<0.5?'0.4~1.0 承接量不变':(d(fW2)>0?`1.0 时多接 ${fmt(d(fW2),0)} kW`:`1.0 时少接 ${fmt(-d(fW2),0)} kW`));
    map['三级保障调节权重']=keep(saved['三级保障调节权重'],Math.abs(d(fW3))<0.5?'0.1~0.6 承接量不变':(d(fW3)>0?`0.1 时多接 ${fmt(d(fW3),0)} kW`:`0.1 时少接 ${fmt(-d(fW3),0)} kW`));
    /* 建议套用后的承接量与缺口 */
    const best=base+(canRatio?Math.max(0,d(f097)):0);
    const rate=potSum>0?base/potSum:0;
    const need=rate>0?target/rate:0;
    let note;
    if(gap>0.5){
      note=`<b>结论：</b>本区任务 ${fmt(target,0)} kW、可承接 ${fmt(base,0)} kW，缺口 ${fmt(gap,0)} kW。6 项参数中只有「单楼宇安全利用比例」还在起作用，其余 5 项调到边界承接量都不变——各栋已顶到安全上限，没有剩余空间可互济，权重只改"谁承担"不改总量。`+
        (canRatio?`按 0.97 套用只多接 ${fmt(best-base,1)} kW，缺口基本不变。`:`按当前取值已是最优，再调没有正收益。`)+
        `<div style="margin-top:6px;color:var(--text-muted)">真正的差距在清单容量：本区 ${n} 栋稳定能力合计 ${fmt(potSum,0)} kW、兑现率 ${fmt(rate*100,1)}%，要承接 ${fmt(target,0)} kW 需清单稳定能力 ≥ <b>${fmt(need,0)} kW</b>（现规模的 ${fmt(potSum>0?need/potSum:0,1)} 倍）。</div>`;
    }else{
      note=`<b>结论：</b>本区任务 ${fmt(target,0)} kW 已能被 ${fmt(base,0)} kW 承接能力覆盖，参数无需上调；若要给设备留更多温度裕度，可把「单楼宇安全利用比例」降到 0.90 观察承接量是否仍够。`;
    }
    return {map,note,gap,canApply:canRatio};
  },

t===this.synergyBuildings.length?'重新一键执行':`一键执行${this.synergyBuildings.length}栋`}</button></div></div>

      </tr></thead><tbody>
        ${this.synergyBuildings.map(b=>{const r=this.executionResults[b.id];return`<tr><td>${b.seq}</td><td style="text-align:left"><strong>${b.name}</strong></td><td>${b.acType}</td><td><span class="badge ${b.priority==='一级'?'badge-red':b.priority==='二级'?'badge-orange':'badge-green'}">${b.priority}</span></td><td>${fmt(b.potential,1)}</td><td>${fmt(b.initial_target,1)}</td><td style="color:${b.transfer_out>0?'var(--warning)':'var(--text-muted)'}">${b.transfer_out>0?fmt(b.transfer_out,1):'-'}</td><td style="color:${b.accepted>0?'var(--success)':'var(--text-muted)'}">${b.accepted>0?'+'+fmt(b.accepted,1):'-'}</td><td style="font-weight:700;color:var(--accent-cyan)">${fmt(b.final_target,1)}</td><td>${r?fmt(r.actualReduction,1):'-'}</td><td style="color:${r&&r.gap>0?'var(--warning)':'var(--text-muted)'}">${r?fmt(r.gap,1):'-'}</td><td><span class="badge ${r?(r.success?'badge-green':'badge-red'):'badge-yellow'}">${r?(r.success?'已仿真':'已阻断'):'未执行'}</span></td><td><button class="btn btn-outline btn-sm" onclick="Aggregate.openDetail(${b.id})">${r?'查看/重算':'执行仿真'}</button></td></tr>`}).join('')}

  renderCharts(){

  /* 演示档位：把全市目标调到"区县任务 ≈ 清单可执行能力×80%"。
     此时部分楼宇超限转出、部分楼宇仍有富余空间，互济承接才真正发生；
     默认 256.4 MW 目标远高于示范清单能力，楼宇一次打满，承接恒为 0。 */
  setDemoTarget(){
    const capKW=this.synergySummary?.capacity||0;
    if(!(capKW>0)){showToast('当前区县无可用楼宇');return;}
    const curTask=this.districtTask();
    const curTarget=parseFloat(DistrictAlloc.params['全域削峰总目标'].value)||0;
    if(!(curTask>0&&curTarget>0)){showToast('当前区县任务为 0，无法换算演示档位');return;}
    const demo=Math.round(curTarget*(capKW/1000*0.8/curTask)*10)/10;
    DistrictAlloc.params['全域削峰总目标'].value=demo;
    DistrictAlloc.autoSyncTarget=false;
    DistrictAlloc.compute();
    this.executionResults={};this.computeSynergy();
    this.renderTab();
    showToast(`演示档位：全市目标 ${demo} MW · ${this.selectedDistrict}任务 ${fmt(this.districtTask(),2)} MW · 清单能力 ${fmt(capKW/1000,2)} MW`);
  },
  resetTarget(){
    const t=CityPotential.totals();
    DistrictAlloc.params['全域削峰总目标'].value=parseFloat(fmt(CityPotential.mw(t.dispatch20),1));
    DistrictAlloc.autoSyncTarget=true;
    DistrictAlloc.compute();
    this.executionResults={};this.computeSynergy();
    this.renderTab();
    showToast('已恢复全市可下发量对应的削峰目标');
  },
  executeAll(){
    const outdoor=Number(Ledger.outdoorTemp)||35;
    this.executionResults={};
    this.synergyBuildings.forEach(b=>{
      const e=SingleExecution.execute(b,b.final_target,outdoor,b.incentive,60);
      this.executionResults[b.id]={actualReduction:e.actualReduction||0,gap:Math.max(0,b.final_target-(e.actualReduction||0)),achievementRate:e.achievementRate||0,strategyCode:e.strategyCode||'',success:e.success};
    });
    this.renderAllocation(document.getElementById('agTabBody'));
    const actual=Object.values(this.executionResults).reduce((s,r)=>s+r.actualReduction,0);
    const gap=Object.values(this.executionResults).reduce((s,r)=>s+r.gap,0);
    showToast(`${this.synergyBuildings.length}栋仿真完成：削减 ${fmt(actual,1)} kW，缺口 ${fmt(gap,1)} kW`);
  },
  setSynergyParam(el){
    const key=el.dataset.synergyParam, p=this.synergyParams[key];
    const raw=parseFloat(el.value), v=isFinite(raw)?raw:p.value;
    const c=Math.min(p.max??1e9,Math.max(p.min??-1e9,v));
    p.value=c; this.computeSynergy(); this.renderTab();
    showToast(Math.abs(c-v)>1e-9?`${key} 需在 ${p.min}~${p.max} 之间，已钳制为 ${c}`:`参数已更新：${key} = ${c}`);
  },
  exportAll(){
    let csv='\ufeff序号,楼宇名称,业态,优先级,空调类型,稳定可调能力kW,调节权重,初次目标kW,安全上限kW,初次可执行kW,待转出kW,承接量kW,最终任务kW,最终利用率,合规,协同时段\n';
    this.synergyBuildings.forEach(b=>{
      csv+=[b.seq,b.name,b.category,b.priority,b.acType,fmt(b.potential,1),fmt(b.weight,2),fmt(b.initial_target,1),fmt(b.safety_limit,1),fmt(b.initial_executable,1),fmt(b.transfer_out,1),fmt(b.accepted,1),fmt(b.final_target,1),fmt(b.final_util*100,1)+'%',b.final_compliance,b.period].join(',')+'\n';
    });
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download='楼宇协同联动运行策略_'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    showToast('楼宇协同联动策略已导出');
  }
};

/* ============================================================
   模块七：区县可调潜力分配
   三维加权模型：A_i = ω1·归一化潜力 + ω2·历史响应率 + ω3·区域等级系数
   目标与参数 → 基础分配 → 并列方案比选 → 最终任务
============================================================ */
const FINAL_CAP_RATIO = 0.9; // 附件7 终态封顶：最终承担 ≤ 自身上限×0.9
/* ============================================================
   图表引擎：ECharts 深色科研风统一主题
   —— 坐标轴/网格/标记点/十字准线风格在全站保持一致
============================================================ */
const CHART_THEME = {
  text: '#8899b4', muted: '#5a6d85', grid: 'rgba(42,74,127,.42)', axis: '#2a3f5f',
  blue: '#3b82f6', cyan: '#06b6d4', green: '#10b981', amber: '#f59e0b',
  red: '#ef4444', purple: '#8b5cf6', gray: '#94a3b8', grayBar: 'rgba(90,109,133,.32)'
};
const CHART_FONT = "'Microsoft YaHei','Noto Sans SC',sans-serif";
/* ============================================================
   静态代理 · 逐时可调潜力 RtPotential
   口径：台账潜力 × 技术报告表4.1 分时形态（17:00 锚点 = 1.0）
   说明：分时形态来自报告的时段均值，非逐点实测；接入 96 点数据后替换本模块数据源即可
============================================================ */
const RtPotential = {
  /* 61 栋实时可调潜力 · 单图 + 参数驱动
     参数：室外温度 / 上调幅度 / 激励模式 → 调 PotentialEngine.calc 实时解算
     分时形态：技术报告表4.1 三温度段均值（17:00 为锚点 = 1.0） */
  SHAPE24: [230,210,195,185,190,220,470,900,1198,1350,1680,1850,1720,1650,1900,2250,2560,2651,2420,1980,1500,1050,720,420],
  BASE_HOUR: 17,
  params: { outdoor:35, delta:1, mode:'config' },
  rows: [],
  fmtH(h){ return String(h).padStart(2,'0')+':00'; },
  incMode(){ return this.params.mode==='flex'?'有激励':this.params.mode==='monitor'?'无激励':'按楼宇配置'; },
  /* 按当前参数逐栋解算，展开为柔性 / 监测两条 24h 序列 */
  series(){
    const inc=this.incMode(), off=this.params.delta, T=this.params.outdoor;
    const shp=this.SHAPE24, baseH=shp[this.BASE_HOUR];
    const flex=Array(24).fill(0), mon=Array(24).fill(0);
    let af=0, am=0, cf=0, cm=0;
    this.rows.forEach(r=>{
      const b=BUILDINGS.find(x=>x.id===r.id); if(!b) return;
      const p=PotentialEngine.calc(b,T,null,inc,off).potential;
      const isFlex=b.userType==='柔性调节';
      const target=isFlex?flex:mon;
      for(let h=0;h<24;h++) target[h]+=p*shp[h]/baseH;
      if(isFlex){af+=p;cf++;} else {am+=p;cm++;}
    });
    return { flex:flex.map(v=>Math.round(v)), mon:mon.map(v=>Math.round(v)),
      total:flex.map((v,i)=>Math.round(v+mon[i])), af,am,cf,cm,inc };
  },
  onParam(){
    const num=document.getElementById('rtOutdoor'), bar=document.getElementById('rtOutdoorBar');
    let T=parseFloat(num?num.value:35); if(!Number.isFinite(T)) T=35;
    T=Math.max(28,Math.min(44,T)); this.params.outdoor=T;
    if(bar) bar.value=T; if(num && String(num.value)!==String(T)) num.value=T;
    const d=parseFloat((document.getElementById('rtDelta')||{}).value);
    this.params.delta=Number.isFinite(d)?d:1;
    this.params.mode=(document.getElementById('rtMode')||{}).value||'config';
    this.render(true);
  },
  chartOption(d){
    const line=(name,data,color)=>({name,type:'line',data,smooth:true,showSymbol:false,
      lineStyle:{color,width:2.4},itemStyle:{color},z:4,areaStyle:{color:'rgba(16,185,129,.05)'}});
    return {
      color:[CHART_THEME.cyan,CHART_THEME.amber,CHART_THEME.green],
      tooltip:ChartHub.tooltip({trigger:'axis',axisPointer:{type:'shadow'},
        formatter:ps=>{const i=ps[0].dataIndex;
          return '<b>'+String(i).padStart(2,'0')+':00</b><br>柔性调节 '+fmt(d.flex[i],0)+' kW<br>监测互动 '+fmt(d.mon[i],0)+' kW<br><b>合计 '+fmt(d.total[i],0)+' kW</b>';}}),
      legend:{show:true,top:0,right:6,textStyle:{color:CHART_THEME.text,fontSize:11},itemWidth:14,itemHeight:8,
        data:['柔性调节','监测互动','合计']},
      grid:{left:58,right:18,top:34,bottom:30},
      xAxis:Object.assign(ChartHub.axisCommon(),{type:'category',
        data:Array.from({length:24},(_,h)=>this.fmtH(h)),boundaryGap:true,
        axisLabel:{color:CHART_THEME.text,fontSize:10,interval:1}}),
      yAxis:Object.assign(ChartHub.axisCommon(),{type:'value',name:'kW',
        nameTextStyle:{color:CHART_THEME.text,fontSize:10}}),
      series:[
        {name:'柔性调节',type:'bar',stack:'g',data:d.flex,barWidth:'58%',
          itemStyle:{color:'rgba(6,182,212,.55)'},z:2},
        {name:'监测互动',type:'bar',stack:'g',data:d.mon,barWidth:'58%',
          itemStyle:{color:'rgba(245,158,11,.55)'},z:2},
        line('合计',d.total,CHART_THEME.green)
      ]
    };
  },
  render(isUpdate){
    if(typeof echarts==='undefined'||!this.rows.length) return;
    const d=this.series(), opt=this.chartOption(d);
    if(isUpdate && ChartHub.insts.chRtCurve) ChartHub.insts.chRtCurve.setOption(opt,true);
    else ChartHub.init('chRtCurve',opt);
    const hint=document.getElementById('rtNowHint');
    if(hint) hint.innerHTML='17:00锚点 · 柔性 <b style="color:var(--accent-cyan)">'+fmt(d.af/1000,1)+
      '</b> / 监测 <b style="color:var(--warning)">'+fmt(d.am/1000,1)+
      '</b> / 合计 <b style="color:var(--success)">'+fmt((d.af+d.am)/1000,1)+
      '</b> MW　·　室外 '+this.params.outdoor+'℃ · 上调 '+this.params.delta+'℃';
  }
};

const ChartHub = {
  insts: {},

    }, extra || {});

/* ============================================================
   各页面专用图表构造器
   —— 所有数值直接来自现有计算引擎，不做任何手工造数
============================================================ */
const ChartBuilders = {
  TYPE_COLORS: { '党政机关':'#3b82f6', '企事业单位':'#06b6d4', '办公写字楼':'#8b5cf6', '商业综合体':'#f59e0b', '酒店':'#10b981', '商超':'#ef4444' },
  typeColor(t){ return this.TYPE_COLORS[t] || '#94a3b8'; },

  /* ① 台账 · 气泡散点：X=基准负荷  Y=可调比例  气泡=可调潜力  颜色=业态 */
  ledgerScatter(id, rows){
    if(!rows || !rows.length) return;
    const types = [...new Set(rows.map(r => r.type))];
    const avgX = rows.reduce((s, r) => s + r.baseLoad, 0) / rows.length;
    const avgY = rows.reduce((s, r) => s + r.potentialPct, 0) / rows.length;
    const maxP = Math.max(...rows.map(r => r.potential), 1);
    /* 量程裁剪：以 P95 为基准设定 Y 轴上限，超限离群点钳制在顶部并标注真实比例，
       避免个别 60%~80% 的实测标杆把量程撑大、把 6%~30% 的正常户压扁贴底 */
    const sortedY = rows.map(r => r.potentialPct).filter(Number.isFinite).sort((a, b) => a - b);
    const p95 = sortedY.length ? sortedY[Math.min(sortedY.length - 1, Math.floor(sortedY.length * 0.95))] : 30;
    const yCap = Math.max(15, Math.ceil((p95 * 1.12) / 5) * 5);
    const clampedY = yCap * 0.94;
    const series = types.map(t => ({
      name: t, type: 'scatter',
      data: rows.filter(r => r.type === t).map(r => {
        const real = Number.isFinite(r.potentialPct) ? r.potentialPct : 0;
        const over = real > yCap;
        const noInc = !!r.noInc;
        return {
          value: [r.baseLoad, over ? clampedY : real, r.potential, real],
          name: r.name, bid: r.id, ac: r.acType, district: r.district, over, noInc,
          symbol: noInc ? 'emptyCircle' : 'circle',
          label: over ? { show: true, formatter: '↑' + fmt(real, 0) + '%', position: 'top', color: CHART_THEME.amber, fontSize: 10, fontWeight: 700, backgroundColor: 'rgba(11,18,32,.78)', padding: [2, 4], borderRadius: 3 } : undefined,
          itemStyle: noInc
            ? { color: 'rgba(11,18,32,.12)', borderColor: this.typeColor(t), borderWidth: 1.4, opacity: .9, shadowBlur: 0 }
            : (over ? { borderColor: CHART_THEME.amber, borderWidth: 1.5 } : undefined)
        };
      }),
      symbolSize: v => 6 + Math.sqrt(Math.max(0, v[2]) / maxP) * 30,
      itemStyle: { color: this.typeColor(t), opacity: .72, borderColor: 'rgba(232,237,245,.5)', borderWidth: .7, shadowBlur: 9, shadowColor: 'rgba(0,0,0,.4)' },
      emphasis: { focus: 'series', itemStyle: { opacity: 1, borderColor: '#fff', borderWidth: 1.6 } }
    }));
    if(series.length){
      series[0].markLine = {
        silent: true, symbol: 'none',
        lineStyle: { color: 'rgba(148,163,184,.5)', type: 'dashed', width: 1 },
        label: { color: CHART_THEME.text, fontSize: 10, backgroundColor: 'rgba(11,18,32,.7)', padding: [2, 4], borderRadius: 3 },
        data: [
          { xAxis: avgX, label: { formatter: '均负荷 ' + fmt(avgX, 0) + 'kW' } },
          { yAxis: avgY, label: { formatter: '均比例 ' + fmt(avgY, 1) + '%' } }
        ]
      };
    }
    const chart=ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 56, right: 24, top: 42, bottom: 46 },
      legend: { top: 4, left: 'center', itemWidth: 9, itemHeight: 9, textStyle: { color: CHART_THEME.text, fontSize: 11 }, icon: 'circle' },
      tooltip: ChartHub.tooltip({
        trigger: 'item',
        formatter: p => {
          const d = p.data;
          return `<div style="font-weight:700;margin-bottom:4px">${esc(d.name)}</div>
            <div style="font-size:11.5px;color:#9fb0c9">${p.seriesName} · ${esc(d.ac)} · ${esc(d.district)}</div>
            <div style="margin-top:5px;line-height:1.7">基准负荷 <b style="color:#60a5fa">${fmt(d.value[0], 0)}</b> kW<br>
            可调比例 <b style="color:#f59e0b">${fmt(d.value[3], 1)}</b>%${d.over ? ' <span style="color:#f59e0b;font-size:10.5px">（超出显示量程 ' + yCap + '%，钳制在顶部）</span>' : ''}<br>
            可调潜力 <b style="color:#22d3ee">${fmt(d.value[2], 1)}</b> kW</div>
            ${d.noInc ? '<div style="margin-top:5px;color:#f59e0b;font-size:10.5px">⚠ 无激励 · 监测互动用户，f响应按被动执行达成率 Kp=0.6 折减</div>' : ''}
            <div style="margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.22);color:#22d3ee;font-size:10.5px">点击气泡 → 明细表仅显示该楼宇</div>`;
        }
      }),
      xAxis: Object.assign({ name: '基准负荷 (kW)', nameLocation: 'middle', nameGap: 26, nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value', scale: true }, ChartHub.axisCommon()),
      yAxis: Object.assign({ name: '可调比例 (%)', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value', min: 0, max: yCap }, ChartHub.axisCommon()),
      series
    });
    if(chart)chart.on('click',p=>{ if(p.data&&p.data.bid!=null)Ledger.focusBuilding(p.data.bid); });
  },

  /* ⑤ 全市推算 · 帕累托：区县中性潜力降序柱 + 累计占比折线（累计分布，非趋势线） */
  cityPareto(id, rows){
    if(!rows || !rows.length) return;
    const rs = [...rows].sort((a, b) => b.neutral - a.neutral);
    const total = rs.reduce((s, r) => s + r.neutral, 0) || 1;
    let acc = 0;
    const names = [], barData = [], cumData = [], shareData = [], dispatchData = [];
    rs.forEach(r => {
      const v = r.neutral / 1000;
      acc += r.neutral;
      names.push(r.district);
      barData.push(+v.toFixed(2));
      shareData.push(+(r.neutral / total * 100).toFixed(1));
      cumData.push(+(acc / total * 100).toFixed(1));
      dispatchData.push(r.dispatch20 ? +(r.dispatch20 / 1000).toFixed(2) : +(v * 0.2).toFixed(2));
    });
    const idx80 = cumData.findIndex(v => v >= 80);
    ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 56, right: 60, top: 44, bottom: 76 },
      legend: { top: 4, left: 'center', itemWidth: 10, itemHeight: 10, textStyle: { color: CHART_THEME.text, fontSize: 11 } },
      tooltip: ChartHub.tooltip({
        trigger: 'axis',
        axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(59,130,246,.08)' } },
        formatter: ps => {
          const i = ps[0].dataIndex;
          return `<div style="font-weight:700;margin-bottom:4px">${names[i]}（第 ${i + 1} 位）</div>
            <div style="margin-top:4px;line-height:1.8">中性潜力 <b style="color:#22d3ee">${fmt(barData[i], 2)}</b> MW（占全市 ${fmt(shareData[i], 1)}%）<br>
            可下发 <b style="color:#34d399">${fmt(dispatchData[i], 2)}</b> MW（= 中性 × ${Math.round(CityPotential.dispatchRatio * 100)}%）<br>
            累计占比 <b style="color:#f59e0b">${fmt(cumData[i], 1)}</b>%${i + 1 === idx80 ? ' <span style="color:#f59e0b;font-size:10.5px">← 80% 分界</span>' : ''}</div>`;
        }
      }),
      xAxis: Object.assign({ type: 'category', data: names, axisLabel: { color: CHART_THEME.text, fontSize: 10, interval: 0, rotate: 38 } }, ChartHub.axisCommon()),
      yAxis: [
        Object.assign({ name: '中性潜力 (MW)', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value' }, ChartHub.axisCommon()),
        Object.assign({ name: '累计占比 (%)', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value', min: 0, max: 100, splitLine: { show: false } }, ChartHub.axisCommon())
      ],
      series: [
        {
          name: '中性潜力 (MW)', type: 'bar', data: barData, barWidth: '62%',
          itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#22d3ee' }, { offset: 1, color: '#3b82f655' }] }, borderRadius: [3, 3, 0, 0] }
        },
        {
          name: '累计占比 (%)', type: 'line', yAxisIndex: 1, data: cumData,
          symbol: 'circle', symbolSize: 5.5, smooth: false,
          lineStyle: { color: CHART_THEME.amber, width: 2 }, itemStyle: { color: CHART_THEME.amber, borderColor: '#0b1220', borderWidth: 1 },
          markLine: {
            silent: true, symbol: 'none',
            lineStyle: { color: 'rgba(245,158,11,.55)', type: 'dashed', width: 1 },
            label: { color: CHART_THEME.amber, fontSize: 10, formatter: '80% 分界', backgroundColor: 'rgba(11,18,32,.7)', padding: [2, 4], borderRadius: 3 },
            data: [{ yAxis: 80 }]
          },
          markPoint: idx80 > 0 ? {
            symbol: 'pin', symbolSize: 40, itemStyle: { color: CHART_THEME.amber },
            label: { color: '#0b1220', fontSize: 9, fontWeight: 700, formatter: '第' + (idx80 + 1) + '县' },
            data: [{ coord: [idx80, cumData[idx80]] }]
          } : undefined
        }
      ]
    });
  },

  /* ④ 协同执行 · 瀑布图：区县任务 → 初次未覆盖 → 协同承接 → 剩余缺口 → 最终可执行（kW） */
  waterfall(id, s){
    const steps = [
      { name: '区县任务', from: 0, to: s.target, color: CHART_THEME.blue, kind: 'total' },
      { name: '初次未覆盖', from: s.initial, to: s.target, color: CHART_THEME.red, kind: 'down' },
      { name: '协同承接', from: s.initial, to: s.final, color: CHART_THEME.green, kind: 'up' },
      { name: '剩余缺口', from: s.final, to: s.target, color: CHART_THEME.amber, kind: 'down' },
      { name: '最终可执行', from: 0, to: s.final, color: CHART_THEME.cyan, kind: 'total' }
    ];
    const helper = steps.map(x => x.from);
    const bars = steps.map(x => ({
      value: +(x.to - x.from).toFixed(2),
      itemStyle: {
        color: x.kind === 'total'
          ? { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: x.color }, { offset: 1, color: x.color + '66' }] }
          : x.color + 'cc',
        borderRadius: 3, borderColor: x.color, borderWidth: 1
      }
    }));
    ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 64, right: 26, top: 40, bottom: 44 },
      tooltip: ChartHub.tooltip({
        trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(59,130,246,.08)' } },
        formatter: ps => {
          const i = ps[0].dataIndex, x = steps[i];
          const sign = x.kind === 'up' ? '+' : x.kind === 'down' ? '−' : '';
          return `<div style="font-weight:700;margin-bottom:4px">${x.name}</div>
            <div style="font-size:12px">${sign}<b>${fmt(Math.abs(x.to - x.from), 1)}</b> kW<br>
            <span style="color:#9fb0c9">区间 ${fmt(x.from, 1)} → ${fmt(x.to, 1)} kW</span></div>`;
        }
      }),
      xAxis: Object.assign({ type: 'category', data: steps.map(x => x.name), axisLabel: { color: CHART_THEME.text, fontSize: 11, interval: 0 } }, ChartHub.axisCommon(), { splitLine: { show: false } }),
      yAxis: Object.assign({ name: 'kW', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value' }, ChartHub.axisCommon()),
      series: [
        { name: 'placeholder', type: 'bar', stack: 'wf', silent: true, itemStyle: { color: 'transparent' }, emphasis: { itemStyle: { color: 'transparent' } }, data: helper },
        { name: '任务分解', type: 'bar', stack: 'wf', barWidth: '42%', data: bars,
          label: { show: true, position: 'top', color: '#c9d6e8', fontSize: 10.5, formatter: p => { const x = steps[p.dataIndex]; return x.kind === 'total' ? fmt(x.to, 0) : (x.kind === 'up' ? '+' : '−') + fmt(Math.abs(x.to - x.from), 0); } }
        }
      ]
    });
  },

  /* ⑥ 协同 · 楼宇能力排行（横向条形）：一条一栋楼，长度=稳定可调能力，颜色=业态 */
  ledgerRankBars(id, rows){
    if(!rows || !rows.length) return;
    const sorted = [...rows].sort((a, b) => (b.potential || 0) - (a.potential || 0));
    const total = sorted.reduce((s, r) => s + (Number(r.potential) || 0), 0);
    ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 6, right: 92, top: 8, bottom: 22, containLabel: true },
      tooltip: ChartHub.tooltip({
        trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(59,130,246,.08)' } },
        formatter: ps => {
          const r = sorted[ps[0].dataIndex];
          const share = total ? (Number(r.potential) || 0) / total * 100 : 0;
          return `<div style="font-weight:700;margin-bottom:4px">${esc(r.name)}</div>
            <div style="font-size:12px">稳定可调能力 <b>${fmt(r.potential, 1)}</b> kW<br>
            <span style="color:#9fb0c9">占本区 ${fmt(share, 1)}% · ${esc(r.category || '')} · ${esc(r.priority || '')}${r.incentive === '无激励' ? ' · 无激励' : ''}</span></div>`;
        }
      }),
      xAxis: Object.assign({ type: 'value', axisLabel: { show: true, color: CHART_THEME.muted, fontSize: 10 } }, ChartHub.axisCommon()),
      yAxis: Object.assign({ type: 'category', data: sorted.map(r => r.name), inverse: true,
        axisLabel: { color: '#c9d6e8', fontSize: 11, width: 118, overflow: 'truncate' },
        axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } }),
      series: [{
        type: 'bar', barWidth: 13, borderRadius: [0, 4, 4, 0],
        data: sorted.map(r => ({
          value: Number((Number(r.potential) || 0).toFixed(1)),
          itemStyle: { color: r.incentive === '无激励' ? CHART_THEME.grayBar : ChartBuilders.typeColor(r.category) }
        })),
        label: { show: true, position: 'right', color: '#c9d6e8', fontSize: 11, formatter: p => fmt(p.value, 1) }
      }]
    });
  },

  /* ⑦ 协同 · 任务覆盖对比（横向条形）：任务多大 → 清单能接多少 → 缺口多少 */
  taskCoverage(id, d){
    if(!d || !(d.task > 0)) return;
    const share = v => d.task ? v / d.task * 100 : 0;
    const rows = [
      { name:'区县任务',   value:d.task,     color:'rgba(59,130,246,.42)', border:'rgba(96,165,250,.9)',
        what:'平台下达给本区的削减目标',               how:'也是这张图的满格刻度：两根条都跟它比' },
      { name:'清单可承接', value:d.capacity, color:'#06b6d4',              border:'#06b6d4',
        what:`本区 ${d.count} 栋楼宇合计能削减多少`,   how:'已扣掉安全利用比例和历史响应率，不是额定能力' },
      { name:'剩余缺口',   value:d.gap,      color:'rgba(245,158,11,.92)',  border:'#f59e0b',
        what:'任务里没人接的部分',                    how:'要补楼宇或从别的区调，否则这笔任务落空' }
    ].filter(r => r.value > 0 || r.name === '区县任务');
    ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 8, right: 128, top: 6, bottom: 6, containLabel: true },
      tooltip: ChartHub.tooltip({
        trigger: 'item',
        formatter: p => {
          const r = rows[p.dataIndex], isTask = r.name === '区县任务';
          return `<div style="font-weight:700;margin-bottom:6px">${r.name}</div>
            <div style="height:20px;font-size:12.5px"><b style="font-size:15px">${fmt(r.value, 2)}</b> MW
              <span style="color:#9fb0c9">${isTask ? '（任务全额，作为对比基准）' : `＝任务的 ${fmt(share(r.value), 1)}%`}</span></div>
            <div style="height:19px;color:#c9d6e8;font-size:12px">${r.what}</div>
            <div style="height:18px;color:#93a4bb;font-size:11.5px">${r.how}</div>`;
        }
      }),
      xAxis: { type: 'value', max: d.task, show: false },
      yAxis: Object.assign({}, {
        type: 'category', inverse: true, data: rows.map(r => r.name),
        axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false },
        axisLabel: { color: '#c9d6e8', fontSize: 12, fontWeight: 600 }
      }),
      series: [{
        type: 'bar', barWidth: 22, borderRadius: [0, 4, 4, 0],
        data: rows.map(r => ({
          value: Number(r.value.toFixed(2)),
          itemStyle: { color: r.color, borderColor: r.border, borderWidth: r.name === '区县任务' ? 1.2 : 0 }
        })),
        label: {
          show: true, position: 'right', color: '#c9d6e8', fontSize: 11.5,
          formatter: p => `${fmt(p.value, 2)} MW  ${fmt(share(rows[p.dataIndex].value), 1)}%`
        }
      }]
    });
  },

  /* ⑤ 单体执行 · 双轴时序：负荷面积曲线 + 削减量柱 + 保持时段 markArea + 反弹 markPoint */
  singleTimeline(id, timeline, meta){
    if(!timeline || !timeline.length) return;
    const xs = timeline.map(p => p.minute + 'm');
    const loads = timeline.map(p => p.load);
    const reds = timeline.map(p => Math.max(0, p.reduction));
    const holdStart = xs[timeline.findIndex(p => p.stage === '稳定保持')];
    const checkIdx = timeline.findIndex(p => p.stage === '效果校核');
    const reboundIdx = timeline.findIndex(p => p.stage === '反弹校核');
    const area = {
      type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
      colorStops: [{ offset: 0, color: 'rgba(59,130,246,.42)' }, { offset: 1, color: 'rgba(59,130,246,.02)' }]
    };
    ChartHub.init(id, {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT },
      grid: { left: 62, right: 62, top: 44, bottom: 42 },
      legend: { top: 6, left: 'center', itemWidth: 10, itemHeight: 9, textStyle: { color: CHART_THEME.text, fontSize: 11 } },
      tooltip: ChartHub.tooltip({
        trigger: 'axis', axisPointer: { type: 'cross', crossStyle: { color: '#5a6d85' }, label: { backgroundColor: '#1e293b' } },
        formatter: ps => {
          const i = ps[0].dataIndex, p = timeline[i];
          return `<div style="font-weight:700;margin-bottom:4px">${p.stage} · ${p.minute} min</div>
            <div style="font-size:12px;line-height:1.8">负荷 <b style="color:#60a5fa">${fmt(p.load, 2)}</b> kW<br>
            削减 <b style="color:#22d3ee">${fmt(p.reduction, 2)}</b> kW</div>`;
        }
      }),
      xAxis: Object.assign({ type: 'category', data: xs, boundaryGap: false, axisLabel: { color: CHART_THEME.text, fontSize: 10, interval: 0 } }, ChartHub.axisCommon(), { splitLine: { show: false } }),
      yAxis: [
        Object.assign({ name: '负荷 (kW)', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value', scale: true }, ChartHub.axisCommon()),
        Object.assign({ name: '削减 (kW)', nameTextStyle: { color: CHART_THEME.muted, fontSize: 11 }, type: 'value', splitLine: { show: false } }, ChartHub.axisCommon(), { splitLine: { show: false } })
      ],
      series: [
        {
          name: '负荷曲线', type: 'line', yAxisIndex: 0, data: loads, smooth: true, symbol: 'circle', symbolSize: 5,
          lineStyle: { width: 2.6, color: CHART_THEME.blue, shadowBlur: 12, shadowColor: 'rgba(59,130,246,.45)' },
          itemStyle: { color: '#93c5fd', borderColor: '#1d4ed8', borderWidth: 1 },
          areaStyle: area,
          markArea: {
            silent: true,
            itemStyle: { color: 'rgba(16,185,129,.10)', borderColor: 'rgba(16,185,129,.5)', borderWidth: 1, borderType: 'dashed' },
            label: { color: '#6ee7b7', fontSize: 10.5, position: 'insideTop' },
            data: holdStart ? [[{ xAxis: holdStart, name: '保持时段' }, { xAxis: xs[xs.length - 1] }]] : []
          },
          markPoint: reboundIdx > -1 ? {
            symbol: 'pin', symbolSize: 42, data: [{ coord: [xs[reboundIdx], loads[reboundIdx]], value: fmt(loads[reboundIdx], 0), name: '反弹峰值' }],
            itemStyle: { color: CHART_THEME.amber }, label: { color: '#111827', fontSize: 9.5, fontWeight: 700 }
          } : undefined
        },
        {
          name: '削减量', type: 'bar', yAxisIndex: 1, data: reds, barWidth: '46%',
          itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(6,182,212,.85)' }, { offset: 1, color: 'rgba(6,182,212,.18)' }] }, borderRadius: [3, 3, 0, 0] }
        }
      ]
    });
  }
};

  compute() {
    const P = {};
    Object.keys(this.params).forEach(k => { P[k] = parseFloat(this.params[k].value) || 0; });
    const totalTarget = P['全域削峰总目标'] || 256.4;
    const safety = P['单区县安全余量系数'] || 0.2;
    const emSafety = P['应急工况安全余量系数'] || 0.3;
    const w1 = P['潜力权重ω₁'] || 0.6, w2 = P['历史响应率权重ω₂'] || 0.25, w3 = P['区域等级系数权重ω₃'] || 0.15;
    const lambda = P['邻接互济分配系数λ'] || 0.8;
    const crossK = P['跨片区互济系数'] || 0.3;
    // 数据源对齐附件7「38区县基础参数」：使用理论可调潜力(如渝中167.5MW)，
    // 最大可调上限=理论潜力×安全余量系数，与附件7「最大可调上限」口径一致
    const source = this.DEFAULT_DISTRICTS;
    const maxPot = Math.max(...source.map(d => d.potential));
    // 常规可调上限：按各区县口径逐项折算后求和（与附件7「最大可调上限」口径一致）
    const regularCapTotal = source.reduce((s,d) => s + d.potential * safety, 0);
    // 应急工况下的最大可调能力
    const emergencyCapTotal = source.reduce((s,d) => s + d.potential * emSafety, 0);
    // 工况判定阈值：常规上限 × 1.05 —— 允许常规工况覆盖到上限附近（含5%容差），
    // 只有目标明确超出常规可调能力时才升级为应急工况，避免默认目标就触发应急
    const emergencyThreshold = regularCapTotal * 1.05;
    const emergency = totalTarget > emergencyThreshold + 0.005;
    // 应急工况下按需逐步放宽：系数随目标在 [常规, 应急系数] 区间线性插值，
    // 目标越高放宽越多，避免一到应急就把能力顶满导致"目标调高反而完成率100%"的失真。
    // 同时兜一条下限：应急工况下能力至少要覆盖目标（target/ΣQ），否则调高应急系数
    // 反而因插值分母变大把 effSafety 稀释下去，出现"系数越大能力越小"的自相矛盾。
    const totalPotential = source.reduce((s, d) => s + d.potential, 0);
    const effSafety = emergency
      ? Math.min(emSafety, Math.max(
          safety + (emSafety - safety) * ((totalTarget - emergencyThreshold) / Math.max(0.01, emergencyCapTotal - emergencyThreshold)),
          totalPotential > 0 ? totalTarget / totalPotential : safety))
      : safety;
    this.workCondition = {
      emergency,
      regularCapTotal,
      emergencyThreshold,
      effSafety,
      target: totalTarget,
      emergencyCapTotal
    };
    this.districts = source.map((d, i) => {
      const normPot = d.potential / maxPot;
      const A_i = w1 * normPot + w2 * d.history_rate + w3 * d.region_coeff;
      // 应急工况下按同一放宽比例放大各区县可调上限
      return { seq: i+1, name: d.name, tier: d.tier, group: this.GROUPS[d.name] || '未知',
        potential: d.potential, history_rate: d.history_rate, region_coeff: d.region_coeff,
        norm_potential: normPot, A_i, max_adjustable: d.potential * effSafety };
    });
    const totalA = this.districts.reduce((s,d) => s + d.A_i, 0);
    this.districts.forEach(d => {
      d.capacity_ratio = d.A_i / totalA;
      d.initial_target = d.capacity_ratio * totalTarget;
      d.first_dispatch = Math.min(d.initial_target, d.max_adjustable);
      d.first_unmet = Math.max(0, d.initial_target - d.max_adjustable);
      d.remaining_space = Math.max(0, d.max_adjustable - d.initial_target);
      d.deviation = d.initial_target - d.max_adjustable;
      d.status = d.deviation > 0.5 ? '缺口' : (d.deviation < -0.5 ? '富余' : '平衡');
      d.intra_group_aid = 0; d.cross_group_aid = 0; d.mutual_aid = 0;
    });
    // 方案A：全域二次下发 —— 市级统一调度，按全市剩余空间等比例补发。
    // 全域调动需跨片区协调、响应链路长，实际可动用比例受「跨片区互济系数」约束。
    const totalFirstUnmet = this.districts.reduce((s, d) => s + d.first_unmet, 0);
    const totalRemainingSpace = this.districts.reduce((s, d) => s + d.remaining_space, 0);
    const secondDispatchTotal = Math.min(totalFirstUnmet, totalRemainingSpace * crossK);
    this.districts.forEach(d => {
      d.second_dispatch = totalRemainingSpace > 0 ? Math.min(d.remaining_space, secondDispatchTotal * d.remaining_space / totalRemainingSpace) : 0;
      d.after_second_dispatch = d.first_dispatch + d.second_dispatch;
      d.second_final = d.after_second_dispatch;
      d.second_capped = 0;
      d.second_status = d.second_dispatch > 0.005 ? '接收二次下发' : (d.first_unmet > 0.005 ? '无可调空间' : '无需二次下发');
    });
    // 方案B：分区轮调互济 —— 分两级调动，模拟「就近优先、成本递增」的真实调度逻辑：
    //   ① 片区内互济：同片区富余区县动用剩余空间的 λ 倍承接本片区缺口（响应快、协调成本低）
    //   ② 跨片区互济：片区内调完后仍有缺口，由仍有富余的区县按跨片区系数补充（协调链路长，可动用比例低）
    // 两级系数差异是方案B相对方案A的核心优势来源：同样的富余空间，就地在片区内消化能多调出更多。
    // 剩余空间在两个层级之间流转，不重复计用同一份额度。
    this.districts.forEach(d=>{
      d.mutual_final=d.first_dispatch;
      d.space_spent=0;               // 已动用的剩余空间（原始 MW 口径）
    });
    // 从候选区县中按 剩余空间×本级系数 的额度等比例分配；实际动用的原始剩余空间记入 space_spent
    const distribute=(amount,candidates,field,ratio)=>{
      const quota=d=>Math.max(0,d.remaining_space-d.space_spent);
      const totalQuota=candidates.reduce((s,d)=>s+quota(d),0);
      const moved=Math.min(amount,totalQuota*ratio);
      candidates.forEach(d=>{
        const q=quota(d);
        const take=totalQuota>0?moved*(q/totalQuota):0;   // 本次实际调动量
        const used=ratio>0?take/ratio:0;                  // 消耗掉的原始剩余空间
        d[field]+=take; d.mutual_final+=take; d.space_spent+=Math.min(used,q);
      });
      return amount-moved;
    };
    const groups={};this.districts.forEach(d=>(groups[d.group]=groups[d.group]||[]).push(d));
    let crossNeed=0;
    Object.values(groups).forEach(gs=>{const need=gs.reduce((s,d)=>s+d.first_unmet,0);crossNeed+=distribute(need,gs.filter(d=>d.remaining_space-d.space_spent>0.005),'intra_group_aid',lambda);});
    // 跨片区：只使用各区县尚未动用的剩余空间，按跨片区系数折算可调动量
    distribute(crossNeed,this.districts.filter(d=>d.remaining_space-d.space_spent>0.005),'cross_group_aid',crossK);
    this.districts.forEach(d => {
      d.mutual_aid = d.intra_group_aid + d.cross_group_aid;
      d.mutual_adjustment=d.mutual_final-d.initial_target;
      d.mutual_capped=0;
      d.final_target=this.selectedScheme==='second'?d.second_final:d.mutual_final;
      d.final_adjustment=d.final_target-d.initial_target;
      d.load_utilization = d.max_adjustable > 0 ? d.final_target / d.max_adjustable : 0;
      d.compliance = d.load_utilization <= 1.05 ? '合规' : '超限';
    });
  },

          <div class="formula-row"><span class="fcase">③ 可调上限</span><span class="fexpr">P<sub>cap,i</sub> = μ · Q<sub>i</sub>(t)</span></div>
          <div class="formula-row"><span class="fcase">④ 偏差识别</span><span class="fexpr">e<sub>i</sub>(t) = P<sub>i,target</sub>(t) − P<sub>i,real</sub>(t)　，P<sub>i,real</sub> = min[ P<sub>i,target</sub> , P<sub>cap,i</sub> ]</span></div>
        </div>

        <div class="grp-cap">第三步 · 邻接互济 <em>· 只允许地理相邻，λ 预留自身裕度</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">⑤ 邻接判定</span><span class="fexpr">M<sub>ij</sub> = 1（相邻）　/　0（不相邻）　·　38×38 矩阵</span></div>
          <div class="formula-row"><span class="fcase">⑥ 支援容量</span><span class="fexpr">T<sub>ij</sub>(t) = λ<sub>ij</sub> · M<sub>ij</sub> · [ Q<sub>j</sub>(t) − P<sub>j,real</sub>(t) ]</span></div>
          <div class="formula-row"><span class="fcase">⑦ 最终任务</span><span class="fexpr">P<sub>i</sub>*(t) = P<sub>i,real</sub>(t) + Σ<sub>j</sub>T<sub>ji</sub>(t) − Σ<sub>j</sub>T<sub>ij</sub>(t)</span></div>
        </div>

        <div class="grp-cap">两种组织方式 <em>· 同一个 ⑥ 式，不同的连通范围与 λ</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">方案 A</span><span class="fexpr">M<sub>ij</sub>≡1，λ<sub>ij</sub>=${fmt(ck,2)}　→　全市一次补发，跨片区协调</span></div>
          <div class="formula-row"><span class="fcase">方案 B</span><span class="fexpr">先片区内 λ<sub>ij</sub>=${fmt(lam,2)}　→　余缺口再跨片区 λ<sub>ij</sub>=${fmt(ck,2)}</span></div>
        </div>

        <div class="sym-cap">符号含义与参数依据</div>
        <table class="sym-tb">
          <thead><tr><th>符号</th><th>含义</th><th>取值 · 依据</th></tr></thead>
          <tbody>
            <tr><td>A<sub>i</sub>(t)</td><td>区县综合承担能力</td><td>无量纲，38 区县合计 ${fmt(totalA,3)}；只用来定份额，本身不是负荷量</td></tr>
            <tr><td>Q<sub>i</sub>(t)</td><td>实时可调潜力</td><td>${fmt(minPot,1)}～${fmt(maxPot,1)} MW，合计 ${fmt(potSum,1)} MW。进 ① 式前先 ÷ ${fmt(maxPot,1)} 归一化，否则量级差 40 倍会吞掉另两项权重</td></tr>
            <tr><td>R<sub>i</sub></td><td>历史响应率</td><td>${fmt(rg[0],2)}～${fmt(rg[1],2)}；该区县历史调控实际达成比例的均值，反映"分得下去、落得下来"的能力</td></tr>
            <tr><td>M<sub>i</sub></td><td>区域等级系数</td><td>${fmt(mg[0],2)}～${fmt(mg[1],2)}；随城市能级五档递减，核心城区 0.93～0.95 → 普通县域 0.40～0.48，能级越高承担越多，保障类区域在档内取低值</td></tr>
            <tr><td>ω₁ / ω₂ / ω₃</td><td>三项权重</td><td>${w1} / ${w2} / ${w3}，和恒为 1。容量主导：工程仿真中容量类指标普遍取 0.5～0.65，本模型取 ${w1}；响应率次之，等级系数用于兜底降权</td></tr>
            <tr><td>P<sub>t</sub>(t)</td><td>全市削峰总目标</td><td>${fmt(tt,2)} MW，取全市可下发量；② 式归一化后各区县目标之和恒等于该值</td></tr>
            <tr><td>P<sub>i,target</sub></td><td>初次目标</td><td>按 A<sub>i</sub> 份额切分；与可调上限比较后定缺口或富余</td></tr>
            <tr><td>μ / μ<sub>E</sub></td><td>安全余量系数</td><td>常规 ${mu}、应急 ${muE}。留 20%：暖通规范室内温差不超 3℃ ＋ 设备 5% 容错；目标超常规上限 1.05 倍时按超出程度线性放宽</td></tr>
            <tr><td>P<sub>cap,i</sub></td><td>可调上限</td><td>= μ·Q<sub>i</sub>，常规合计 ${fmt(regTotal,2)} MW；应急放宽后上限合计 ${fmt(emTotal,2)} MW</td></tr>
            <tr><td>e<sub>i</sub>(t)</td><td>调控偏差</td><td>&gt;0 为缺口、&lt;0 为富余、=0 为平衡。当前缺口 ${gapN} 个、富余 ${surN} 个；富余额度转入 S<sub>j</sub> 供互济调用</td></tr>
            <tr><td>M<sub>ij</sub></td><td>邻接矩阵</td><td>38×38，相邻取 1、不相邻取 0。远距离互济通信时延与线损都不划算，直接禁止</td></tr>
            <tr><td>λ<sub>ij</sub></td><td>互济分配系数</td><td>片区内 ${fmt(lam,2)}（预留 20% 自身温度裕度，响应 ≤15 min）；跨片区 ${fmt(ck,2)}（需预留送受两端裕度、市级协调，响应 ≥60 min）</td></tr>
            <tr><td style="white-space:normal">Q<sub>j</sub>−P<sub>j,real</sub></td><td>可外送剩余空间</td><td>富余区县尚未用掉的额度；页面以 P<sub>cap,j</sub> 封顶，保证互济后仍不突破 μ，同一份额度不重复计用</td></tr>
            <tr><td>T<sub>ij</sub>(t)</td><td>单组支援容量</td><td>富余区县 j 给缺口区县 i 的支援量（MW），只有 M<sub>ij</sub>=1 时才可能非零</td></tr>
            <tr><td>P<sub>i</sub>*(t)</td><td>最终任务</td><td>自身可执行 + 接收支援 − 转出支援；仍补不齐的缺口由市级可中断负荷兜底</td></tr>
          </tbody>
        </table>
        <div class="calc-note">三条守恒：② 式保证 ΣP<sub>i,target</sub> = P<sub>t</sub>；④ 式保证任何区县不超 μ 上限；⑥ 式保证转出量 = 承接量，同一份额度不重复调用。目标超过应急上限（${fmt(regTotal*1.05,2)} MW 判定阈值）才切换工况，避免目标在能力边界附近反复横跳。</div>
        <div class="calc-note green">💡 例：${ex.name}潜力 ${fmt(ex.potential,1)} MW 为全市最高，归一化取 1.00，A = 1.00×${w1} + ${fmt(ex.history_rate,2)}×${w2} + ${fmt(ex.region_coeff,2)}×${w3} = ${fmt(ex.A_i,3)}，占 ${fmt(ex.A_i/totalA*100,2)}% 份额，初次目标 ${fmt(ex.initial_target,2)} MW，低于可调上限 ${fmt(ex.max_adjustable,2)} MW，无需互济即可执行。</div>
        ${ParameterCatalog.renderInline('本模型参数取值与来源',['区县任务分配'])}
      `;})()}
      </div>
    </details>`;
    this.renderTab();
    ScrollKeeper.restore(_sk, el);
  },
  switchTab(t) { ScrollKeeper.skipNext(); this.tab = t; this.render(); },

  // 图4 桑基：削峰目标 → 承担渠道 → 片区
  chartSankey() {
    const T = CHART_THEME;
    const target = parseFloat(this.params['全域削峰总目标'].value) || 0;
    const firstTotal = this.districts.reduce((s, d) => s + d.first_dispatch, 0);
    const finalTotal = this.districts.reduce((s, d) => s + d.final_target, 0);
    const gap = Math.max(0, target - finalTotal);
    const groups = ['主城都市区', '渝东北三峡库区', '渝东南武陵山区'];
    const sumBy = (g, f) => this.districts.filter(d => d.group === g).reduce((s, d) => s + (f(d) || 0), 0);
    const r = v => +v.toFixed(2);
    /* 追加渠道随方案切换：A=全域二次下发；B=片内互济+跨片区互济。字段与最终任务口径同源 */
    const isSecond = this.selectedScheme === 'second';
    const channels = isSecond
      ? [{ name: '全域二次下发', color: 'rgba(16,185,129,.8)', f: d => d.second_dispatch }]
      : [
          { name: '片内互济', color: 'rgba(16,185,129,.8)', f: d => d.intra_group_aid },
          { name: '跨片区互济', color: 'rgba(245,158,11,.8)', f: d => d.cross_group_aid }
        ];
    const nodes = [
      { name: '削峰目标', itemStyle: { color: T.blue } },
      { name: '初次分配', itemStyle: { color: 'rgba(59,130,246,.75)' } },
      ...channels.map(c => ({ name: c.name, itemStyle: { color: c.color } })),
      { name: '市级兜底缺口', itemStyle: { color: 'rgba(239,68,68,.6)' } },
      ...groups.map(g => ({ name: g, itemStyle: { color: 'rgba(139,92,246,.55)' } }))
    ];
    const links = [{ source: '削峰目标', target: '初次分配', value: r(firstTotal) }];
    channels.forEach(c => {
      const v = this.districts.reduce((s, d) => s + (c.f(d) || 0), 0);
      if (v > 0.005) links.push({ source: '削峰目标', target: c.name, value: r(v) });
    });
    links.push({ source: '削峰目标', target: '市级兜底缺口', value: r(gap) });
    groups.forEach(g => {
      const a = sumBy(g, d => d.first_dispatch);
      if (a > 0.005) links.push({ source: '初次分配', target: g, value: r(a) });
      channels.forEach(c => {
        const v = sumBy(g, c.f);
        if (v > 0.005) links.push({ source: c.name, target: g, value: r(v) });
      });
    });
    return {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: CHART_FONT, color: T.text },
      tooltip: ChartHub.tooltip({
        trigger: 'item',
        formatter: p => p.dataType === 'edge'
          ? `${p.data.source} → <b>${p.data.target}</b><br/><b>${fmt(p.data.value, 2)}</b> MW`
          : `<b>${p.name}</b><br/>合计 <b>${fmt(p.value, 2)}</b> MW`
      }),
      series: [{
        type: 'sankey', left: 100, right: 120, top: 16, bottom: 16,
        nodeWidth: 16, nodeGap: 12, layoutIterations: 0, nodeAlign: 'justify',
        emphasis: { focus: 'adjacency', lineStyle: { opacity: .62 } },
        label: { color: '#cbd5e1', fontSize: 11.5, fontFamily: CHART_FONT },
        lineStyle: { color: 'gradient', opacity: .32, curveness: .5 },
        data: nodes, links
      }]
    };
  },

          <summary>基础分配 · 38 区县明细 <span class="calc-hint">按规模加权，再受可调上限约束 · 点击展开</span></summary>

            <th>#</th><th>区县</th><th>片区</th><th>中性潜力(MW)</th><th>已接入实测</th><th>响应率</th><th>初次目标(MW)</th><th>可调上限(MW)</th><th>初次可执行(MW)</th><th>初次缺口(MW)</th><th>状态</th></tr></thead><tbody>
            ${this.districts.map(d => {const ac=accessMap[d.name];return `<tr><td>${d.seq}</td><td style="text-align:left"><strong>${d.name}</strong></td><td>${d.group}</td>
              <td>${fmt(d.potential,1)}</td>
              <td style="font-size:12px;color:${ac?'var(--accent-cyan)':'var(--text-muted)'}">${ac?`${ac.n} 栋 · ${fmt(ac.kw,0)} kW`:'—'}</td><td>${fmt(d.history_rate*100,0)}%</td><td style="font-weight:600;">${fmt(d.initial_target,2)}</td>
              <td>${fmt(d.max_adjustable,2)}</td><td>${fmt(d.first_dispatch,2)}</td>
              <td style="color:${d.first_unmet>0.005?'var(--danger)':'var(--text-muted)'};">${fmt(d.first_unmet,2)}</td>
              <td><span class="badge ${d.status==='富余'?'badge-green':d.status==='缺口'?'badge-red':'badge-yellow'}">${d.status}</span></td></tr>`;}).join('')}
          </tbody></table></div></div>
        </details>
        <details class="calc-logic" style="margin-top:12px" ${this.paramOpen?'open':''} ontoggle="DistrictAlloc.paramOpen=this.open"><summary>⚙️ 模型参数 <span class="calc-hint">改完立即重算</span></summary>
          <div class="calc-body">
            <div class="param-flow">

          ${tierOrder.map(t => { const g = tierGroups[t]; if (!g) return ''; const grand = this.districts.reduce((s,d)=>s+d.final_target,0); return `<tr><td style="text-align:left"><strong>${t}（${tierNames[t]}）</strong></td><td>${g.count}</td><td>${fmt(g.pot,1)}</td><td>${fmt(g.target,2)}</td><td>${fmt(g.target/grand*100,1)}%</td></tr>`; }).join('')}

          ${['主城都市区','渝东北三峡库区','渝东南武陵山区'].map(g => { const d = groupStats[g]; if (!d) return ''; const net = d.surplus - d.deficit; return `<tr><td style="text-align:left"><strong>${g}</strong></td><td>${d.count}</td><td>${fmt(d.pot,1)}</td><td>${fmt(d.target,1)}</td><td>${fmt(d.surplus,1)}</td><td>${fmt(d.deficit,1)}</td><td><span class="badge ${net>0?'badge-green':net<0?'badge-red':'badge-yellow'}">${net>0?'净输出 '+fmt(net,1)+'MW':net<0?'净接收 '+fmt(Math.abs(net),1)+'MW':'平衡'}</span></td></tr>`; }).join('')}

  },
  setParam(el) {
    const key = el.dataset.param;
    const p = this.params[key];
    const raw = parseFloat(el.value);
    const notes = [];
    /* ① 范围硬约束：越界即钳制，不允许负数、也不允许突破工程上限 */
    let v = Number.isFinite(raw) ? raw : p.value;
    const clamped = Math.min(p.max, Math.max(p.min, v));
    if (Math.abs(clamped - v) > 1e-9) {
      notes.push(`${key} 超出可调范围 ${p.min}~${p.max}，已钳制为 ${clamped}`);
      v = clamped;
    }
    p.value = +v.toFixed(3);
    /* ② 三个 ω 必须和为 1：改一项，另两项按原比例缩放，保持相对偏好不变 */
    const W = ['潜力权重ω₁', '历史响应率权重ω₂', '区域等级系数权重ω₃'];
    if (W.includes(key)) {
      const rest = W.filter(k => k !== key);
      const sumRest = rest.reduce((s, k) => s + this.params[k].value, 0);
      const targetRest = 1 - p.value;
      if (sumRest > 1e-6 && targetRest > 1e-6) {
        rest.forEach(k => this.params[k].value = +(this.params[k].value * targetRest / sumRest).toFixed(3));
        const err = 1 - W.reduce((s, k) => s + this.params[k].value, 0);
        this.params[rest[0]].value = +(this.params[rest[0]].value + err).toFixed(3);
        notes.push(`ω 三项已归一化为 1（${W.map(k => this.params[k].value).join(' / ')}）`);
      }
    }
    /* ③ 应急系数不得低于常规系数，否则放宽逻辑失效 */
    const mu = this.params['单区县安全余量系数'].value;
    const muE = this.params['应急工况安全余量系数'];
    if (muE.value < mu - 1e-9) {
      muE.value = +Math.min(muE.max, mu).toFixed(3);
      notes.push(`应急安全余量不得低于常规值，已同步为 ${muE.value}`);
    }
    if (key === '全域削峰总目标') {
      /* 用户手动改目标后停止上游覆盖；全市页仍保留自己的可下发量口径，不再被区县值反向污染 */
      this.autoSyncTarget = false;
    }
    this.compute(); this.renderTab();
    showToast(notes.length ? notes.join('；') : `参数已更新：${key} = ${p.value}`);
  },
  /* 按当前削峰目标反算系数建议。
     做法：固定目标与 ω 权重，只扫 μ（0.20→0.35，步长 0.005），每次走完整 compute（含两级互济），
     找到"方案B 恰好补齐目标"的最小 μ；再扫一次 λ 说明它是不是瓶颈。
     扫描区间全部落在常规工况（μ≥0.20 时判定阈值 1.05ΣμQ > 目标），故与真实运行一致。 */
  adviseCoef() {
    const P = this.params, target = parseFloat(P['全域削峰总目标'].value) || 0;
    const keys = Object.keys(P), saved = {};
    keys.forEach(k => saved[k] = P[k].value);
    /* 先按当前参数记下真实结果（若已处应急工况，能力由 μ 插值决定，不能从扫描行里取） */
    const sum = k => this.districts.reduce((s, d) => s + d[k], 0);
    const base = { mu: +parseFloat(saved['单区县安全余量系数']).toFixed(3),
      exe: sum('first_dispatch'), a: sum('second_final'), b: sum('mutual_final') };
    const rows = [];
    for (let mu = 0.20; mu <= 0.3501; mu += 0.005) {
      P['单区县安全余量系数'].value = +mu.toFixed(3);
      this.compute();
      if (this.workCondition.emergency) continue;   // 应急区间能力由插值决定、非单调，不纳入建议
      rows.push({ mu: +mu.toFixed(3),
        exe: this.districts.reduce((s, d) => s + d.first_dispatch, 0),
        a: this.districts.reduce((s, d) => s + d.second_final, 0),
        b: this.districts.reduce((s, d) => s + d.mutual_final, 0) });
    }
    const cur = base;
    const hit = rows.find(r => r.b >= target - 0.05) || null;
    // λ 敏感度：μ 回到当前值，只动 λ（用于结论里的"λ 不是瓶颈"）
    P['单区县安全余量系数'].value = saved['单区县安全余量系数'];
    const lamRows = [];
    [0.5, 0.8, 1.0].forEach(v => {
      P['邻接互济分配系数λ'].value = v; this.compute();
      lamRows.push({ lam: v, b: this.districts.reduce((s, d) => s + d.mutual_final, 0) });
    });
    /* 其余系数：各自恢复到基准后单独调到"附件允许的区间边界"，看方案B 还能多补多少 MW。
       基准场景固定 μ=0.20（原始工程取值）：当前若已靠调 μ 补齐，方案B 会顶到目标饱和，
       任何系数都只会显示 +0.0，看不出差别。用"有缺口"的口径测才有比较意义。 */
    const PROBE_MU = 0.20;
    const resetAll = () => keys.forEach(k => P[k].value = saved[k]);
    const resetProbe = () => { resetAll(); P['单区县安全余量系数'].value = PROBE_MU; };
    const bOf = () => this.districts.reduce((s, d) => s + d.mutual_final, 0);
    resetProbe(); this.compute();
    const bBase = bOf();
    const probes = [];
    const probe = (label, fn, note) => { resetProbe(); fn(); this.compute(); probes.push({ label, note, d: bOf() - bBase, b: bOf() }); };
    /* 权重按"抬到区间边界、其余两项等比缩放"处理，保证三项之和仍为 1 */
    probe('ω₁ 0.60→0.65', () => { P['潜力权重ω₁'].value = 0.65; P['历史响应率权重ω₂'].value = 0.219; P['区域等级系数权重ω₃'].value = 0.131; }, '已到上限，再多偏离容量主导');
    probe('ω₂ 0.25→0.30', () => { P['历史响应率权重ω₂'].value = 0.30; P['潜力权重ω₁'].value = 0.56; P['区域等级系数权重ω₃'].value = 0.14; }, '压低容量权重，反而少补');
    probe('κ 0.30→1.00', () => { P['跨片区互济系数'].value = 1; }, '响应 15→60 min，仍补不齐');
    probe('μ<sub>E</sub> 0.30→0.50', () => { P['应急工况安全余量系数'].value = 0.5; }, '常规工况不参与');
    resetAll();
    this.compute();
    /* 斜率取"当前 → 建议"段：μ 大到一定程度会顶到目标饱和，全区间平均会低估前半段的效果 */
    const ref = hit || (rows.length > 1 ? rows[rows.length - 1] : null);
    const slope = ref && Math.abs(ref.mu - cur.mu) > 0.004
      ? (ref.b - cur.b) / (ref.mu - cur.mu) * 0.01
      : 0;
    this.advice = { target, cur, hit: hit ? hit.mu : null, hitRow: hit, rows, lamRows, slope, probes, probeBase: bBase, probeMu: PROBE_MU, capSum: sum('max_adjustable'), sumPot: sum('potential') };
    this.renderAdvice();
    showToast(hit ? `反算完成：单区县安全余量系数建议 ${hit.mu}` : '反算完成：当前目标即便 μ=0.35 仍补不齐，需降目标或转应急统筹');
  },
  renderAdvice() {
    const box = document.getElementById('adviceResult');
    if (!box || !this.advice) return;
    const { target, cur, hit, hitRow, rows, probes, probeBase, probeMu, capSum, sumPot } = this.advice;
    const ok = cur.b >= target - 0.05;
    const baseRow = rows.length ? rows[0] : null;          // μ=0.20 基线（附件原值）
    const tgtRow = ok ? cur : hitRow;                      // 现状 or 建议值
    const EXEC = 0.95;                                     // 附件：61 户实测稳定上限 93%~97%，取 0.95
    const pct = (v) => target > 0 ? (v / target * 100) : 0;
    const row = (name, a, b, unit, better) => {
      const d = b - a, good = better === 'up' ? d > 0.005 : d < -0.005;
      return `<tr><td style="text-align:left">${name}</td>
        <td>${fmt(a, 2)}${unit}</td>
        <td style="color:var(--accent-cyan);font-weight:600">${fmt(b, 2)}${unit}</td>
        <td style="color:${Math.abs(d) < 0.005 ? 'var(--text-muted)' : good ? 'var(--accent-green)' : 'var(--danger)'}">${d >= 0 ? '+' : ''}${fmt(d, 2)}${unit}</td></tr>`;
    };
    /* 极简版：只留两组表 + 一句注，去掉过程性叙述 */
    const gapCur = Math.max(0, target - cur.b);
    const tgt = tgtRow || cur;
    const baseB = baseRow ? baseRow.b : cur.b;
    const baseE = baseRow ? baseRow.exe : cur.exe;
    box.innerHTML = `
      ${!ok && hit !== null && Math.abs(hit - cur.mu) > 0.004
        ? `<div style="margin-top:11px"><button class="btn btn-primary btn-sm" onclick="DistrictAlloc.applyAdvice()">套用 μ=${hit.toFixed(3)}</button></div>`
        : ''}
      <div class="grp-cap" style="margin-top:13px">μ ${probeMu.toFixed(2)} → ${tgt.mu.toFixed(3)}<em>${ok ? '当前已可取' : hit !== null ? '建议值' : '已到边界仍补不齐'}</em></div>
      <div class="data-table-wrapper"><table class="data-table"><thead><tr>
        <th>指标</th><th>μ=${probeMu.toFixed(2)}</th><th>μ=${tgt.mu.toFixed(3)}</th><th>变化</th></tr></thead><tbody>
        ${row('ΣμQ<sub>i</sub> 能力上限', sumPot * probeMu, sumPot * tgt.mu, ' MW', 'up')}
        ${row('初次可执行', baseE, tgt.exe, ' MW', 'up')}
        ${row('互济后任务', baseB, tgt.b, ' MW', 'up')}
        ${row('剩余缺口', Math.max(0, target - baseB), Math.max(0, target - tgt.b), ' MW', 'down')}
        ${row('按 95% 落地', baseB * EXEC, tgt.b * EXEC, ' MW', 'up')}
      </tbody></table></div>

      <div class="grp-cap" style="margin-top:14px">其余系数调到区间边界<em>基准 μ=${probeMu.toFixed(2)}，方案B ${fmt(probeBase, 1)} MW</em></div>
      <div class="data-table-wrapper"><table class="data-table"><thead><tr>
        <th>系数</th><th>调到边界后</th><th>多补</th><th>代价</th></tr></thead><tbody>
        ${probes.map(p => `<tr>
          <td style="text-align:left">${p.label}</td>
          <td>${fmt(p.b, 1)} MW</td>
          <td style="color:${p.d > 0.5 ? 'var(--accent-cyan)' : p.d < -0.5 ? 'var(--danger)' : 'var(--text-muted)'};font-weight:600">${p.d >= 0 ? '+' : ''}${fmt(p.d, 1)} MW</td>
          <td style="text-align:left;font-size:11.5px;color:var(--text-muted)">${p.note}</td></tr>`).join('')}
      </tbody></table></div>

      <div class="calc-note" style="margin-top:10px">
        只有 μ 抬高能力上限 ΣμQ<sub>i</sub>；ω 只改份额、λ/κ 只搬剩余空间（合计 ${fmt(probeBase - baseE, 1)} MW ＜ 缺口 ${fmt(gapCur, 1)} MW，搬满也补不平）。
        <div style="margin-top:5px;color:var(--text-muted)">
          μ 0.20→${tgt.mu.toFixed(3)} 是补 P<sub>t</sub> 与 ΣQ 的基数差（1282.05 / 1225.20），不是放松安全边界；温度裕度 ${fmt((1 - probeMu) * 100, 0)}% → ${fmt((1 - tgt.mu) * 100, 1)}%。
          100% 指任务分配合规，按实测执行率 95% 实际落地 ${fmt(target * EXEC, 1)} MW。
        </div>
      </div>`;
  },
  applyAdvice() {
    if (!this.advice || this.advice.hit == null) return;
    const v = this.advice.hit;
    this.params['单区县安全余量系数'].value = v;
    this.compute(); this.render();
    setTimeout(() => this.adviseCoef(), 50);
    showToast(`已套用建议值：单区县安全余量系数 = ${v}`);
  },
  exportCSV() {
    let csv = '\ufeff序号,区县,梯队,片区,中性潜力MW,历史响应率,初次目标MW,初次可执行MW,初次缺口MW,方案A追加MW,方案A最终MW,方案B片区内承接MW,方案B跨片区承接MW,方案B最终MW,采用方案,最终任务MW,调整量MW,利用率,合规\n';
    const scheme=this.selectedScheme==='second'?'方案A-全域二次下发':'方案B-分区轮调互济';
    this.districts.forEach(d => { csv += [d.seq,d.name,d.tier,d.group,fmt(d.potential,2),fmt(d.history_rate,2),fmt(d.initial_target,2),fmt(d.first_dispatch,2),fmt(d.first_unmet,2),fmt(d.second_dispatch,2),fmt(d.second_final,2),fmt(d.intra_group_aid,2),fmt(d.cross_group_aid,2),fmt(d.mutual_final,2),scheme,fmt(d.final_target,2),fmt(d.final_adjustment,2),fmt(d.load_utilization*100,1)+'%',d.compliance].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n'; });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = '区县可调潜力分配_' + new Date().toISOString().slice(0,10) + '.csv'; a.click();
    showToast('区县分配结果已导出');
  }
};

const CityPotential={

  scenarioFactor(){

    const std=BUILDINGS.filter(b=>SampleBaseline.isBaseline(b));

    const total={neutral:rows.reduce((a,d)=>a+d.neutral,0),conservative:rows.reduce((a,d)=>a+d.conservative,0),dispatch20:rows.reduce((a,d)=>a+d.dispatch20,0)};

  setDispatchRatio(ratioStr){
    const ratio=parseFloat(ratioStr)/100;
    if(isNaN(ratio)||ratio<=0||ratio>1){showToast('比例需在1%-100%之间');return;}
    this.dispatchRatio=ratio;
    this.dispatchOverride=null;
    if(typeof DistrictAlloc!=='undefined')DistrictAlloc.autoSyncTarget=true;
    this.render();
    showToast(`可下发比例已设为 ${Math.round(ratio*100)}%`);
  },
  setDispatchValue(valStr){
    const val=parseFloat(valStr);
    if(isNaN(val)||val<=0){showToast('请输入有效数值');return;}
    this.dispatchOverride=val;
    if(typeof DistrictAlloc!=='undefined')DistrictAlloc.autoSyncTarget=true;
    const total=this.totals();
    const neutralMW=this.mw(total.neutral);
    if(neutralMW>0){this.dispatchRatio=val/neutralMW;}
    this.render();
    showToast(`可下发量已设为 ${val} MW`);
  },
  exportCSV(){
    let csv='\ufeff区县,梯队,楼宇户当量(户),中性潜力MW(资源量),保守情景MW(参考),可下发MW(调度目标)\n';
    this.districtRows().forEach(d=>{csv+=[d.district,d.tier,d.householdEquivalent,fmt(this.mw(d.neutral),3),fmt(this.mw(d.conservative),3),fmt(this.mw(d.dispatch20),3)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')+'\n';});

    showToast('全市潜力推算结果已导出');
