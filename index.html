   补贴敏感性：复现技术报告表3.12 / 表3.13 的情景口径
   口径声明：调研问卷只有"是/否"二值意愿，无金额分档；报告的 3 元/kWh
   是测算假设。金额调整仅做线性情景推演，不冒充实测响应曲线，
   也不改写全市 1282.05/256.41 标准口径与区县分配。
============================================================ */
const SubsidySensitivity={
  key:'ac-v3-subsidy-rate',
  rate:(()=>{try{const v=parseFloat(localStorage.getItem('ac-v3-subsidy-rate'));return Number.isFinite(v)&&v>=0?v:3}catch(e){return 3}})(),
  open:false,
  /* 报告表3.12：三档调控强度 × 六类业态的响应系数 α（无激励 / 3元情景有激励） */
  ALPHA:{
    '中温升档（25℃）':{
      note:'综合体/商超对标 23℃；低强度下多数业态无激励已满额响应',
      rows:[['党政机关',0.10,0.10],['企事业单位',0.075,0.10],['办公写字楼',0.10,0.10],['商业综合体',0.10,0.10],['商超',0.10,0.10],['酒店',0.075,0.075]]
    },
    '高温升档（26℃）':{
      note:'综合体/商超对标最高温；补贴拉动效果最显著',
      rows:[['党政机关',0.060,0.100],['企事业单位',0.025,0.050],['办公写字楼',0.070,0.100],['商业综合体',0.050,0.095],['商超',0.033,0.070],['酒店',0.040,0.043]]
    },
    '超高温档（27℃）':{
      note:'仅党政机关、办公写字楼有实测样本；其余业态无样本',
      rows:[['党政机关',0.02,0.05],['企事业单位',null,null],['办公写字楼',0.06,0.09],['商业综合体',null,null],['商超',null,null],['酒店',null,null]]
    }
  },
  /* 报告表3.13：高档调控（接近舒适底线）六类业态可调潜力，单位 kW */
  POTENTIAL:[
    ['党政机关',141.89,136.17],['企事业单位',164.06,164.06],['办公写字楼',885.07,663.31],
    ['商业综合体',445.46,531.02],['商超',205.02,206.52],['酒店',215.42,66.16]
  ],
  /* 报告以 3 元/kWh 为基准；低于 3 元按金额比例线性缩放增量，高于 3 元不再放大
     —— 报告未采集金额分档意愿，超出基准的外推无实测依据 */
  factor(){return Math.min(this.rate/3,1);},
  setRate(v){
    const n=parseFloat(v);
    if(!Number.isFinite(n)||n<0||n>10){showToast('请输入 0~10 之间的补贴金额');return;}
    this.rate=n;try{localStorage.setItem(this.key,String(n))}catch(e){}
    CityPotential.render();
    showToast(`补贴情景已设为 ${n} 元/kWh（线性推演，非实测分档）`);
  },
  resetRate(){this.setRate(3);},
  view(){
    const k=this.factor(),pct=(v,b)=>b>0?`${v>=b?'+':''}${fmt((v/b-1)*100,1)}%`:'—';
    /* 三档里只有「高温升档」有完整信息量：中温档 5/6 业态已满额、超高温档 4/6 无样本，压缩为结论行 */
    const HIGH='高温升档（26℃）';
    const liftsOf=name=>this.ALPHA[name].rows.filter(r=>r[1]!=null)
      .map(([t,no,yes])=>({t,p:no>0?((no+(yes-no)*k)/no-1)*100:0}));
    const alphaBlock=(()=>{
      const g=this.ALPHA[HIGH];
      const rows=g.rows.map(([type,no,yes])=>{
        const y=no+(yes-no)*k;
        return `<tr><td style="text-align:left">${type}</td><td class="num">${no.toFixed(3)}</td><td class="num" style="color:var(--text-muted)">${yes.toFixed(3)}</td><td class="num" style="color:var(--accent-cyan);font-weight:600">${y.toFixed(3)}</td><td class="num">${pct(y,no)}</td></tr>`;
      }).join('');
      return `<div style="font-size:12.5px;font-weight:700;margin:12px 0 6px">${HIGH}<span style="font-weight:400;color:var(--text-muted);margin-left:8px">${g.note}；各业态设定温度对标不同，强度可比</span></div>
        <div class="data-table-wrapper" style="max-height:none"><table class="data-table">
          <thead><tr><th>业态</th><th>无激励 α</th><th>3 元情景 α</th><th>当前情景 α</th><th>相对提升</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`;
    })();
    const midLifts=liftsOf('中温升档（25℃）');
    const midTop=[...midLifts].sort((a,b)=>b.p-a.p)[0];
    const midZero=midLifts.filter(x=>Math.abs(x.p)<0.05).length;
    const rateWord=this.rate<=3?`${this.rate} 元情景下`:'补贴达 3 元以上时';
    const midNote=`<div class="calc-note" style="margin:10px 0 0"><b>中温升档（25℃）· 已饱和：</b>${midLifts.length} 个业态中 ${midZero} 个无激励即达满额（α = 0.100）${midTop.p>0.05?`，${rateWord}仅 <b>${midTop.t}</b> 有提升（+${fmt(midTop.p,1)}%）`:'，各业态均无增量'}。常规调控靠运行管理即可达标，补贴不是必要条件。</div>`;
    const hiLifts=liftsOf('超高温档（27℃）');
    const hiNoNum=this.ALPHA['超高温档（27℃）'].rows.length-hiLifts.length;
    const hiNote=`<div class="calc-note" style="margin:8px 0 0"><b>超高温档（27℃）· 样本有限：</b>仅 ${hiLifts.map(x=>`${x.t}（+${fmt(x.p,1)}%）`).join('、')} 有实测样本，其余 ${hiNoNum} 类无样本、不作外推。</div>`;
    const pRows=this.POTENTIAL.map(([type,no,delta])=>{
      const d=delta*k,y=no+d;
      return `<tr><td style="text-align:left">${type}</td><td class="num">${fmt(no,2)}</td><td class="num" style="color:var(--text-muted)">${fmt(no+delta,2)}</td><td class="num" style="color:var(--accent-cyan);font-weight:600">${fmt(y,2)}</td><td class="num">${fmt(d,2)}</td><td class="num">${fmt(d/no*100,1)}%</td></tr>`;
    }).join('');
    const noSum=this.POTENTIAL.reduce((s,r)=>s+r[1],0),deltaSum=this.POTENTIAL.reduce((s,r)=>s+r[2],0);
    const dSum=deltaSum*k,ySum=noSum+dSum;
    const pTotal=`<tr style="border-top:2px solid var(--border-accent)"><td style="text-align:left"><strong>全样本合计</strong></td><td class="num"><strong>${fmt(noSum,2)}</strong></td><td class="num" style="color:var(--text-muted)"><strong>${fmt(noSum+deltaSum,2)}</strong></td><td class="num"><strong style="color:var(--accent-cyan)">${fmt(ySum,2)}</strong></td><td class="num"><strong>${fmt(dSum,2)}</strong></td><td class="num"><strong>${fmt(dSum/noSum*100,1)}%</strong></td></tr>`;
    const pureReport=Math.abs(this.rate-3)<1e-9;
    return `<details class="calc-logic" ${this.open?'open':''} ontoggle="SubsidySensitivity.open=this.open">
      <summary>补贴怎么起作用 · 敏感性 <span class="calc-hint">三档调控强度情景 · 当前 ${this.rate} 元/kWh（${pureReport?'政策基准':'线性推演'}）· 点击展开</span></summary>
      <div class="calc-body">
        <div class="info-box warning"><strong>口径说明：</strong>调研问卷对补贴只有"是/否"二值意愿，<b>没有金额分档</b>。本页以 <b>3 元/kWh</b> 作统一情景，调整金额时按 <b>min(金额 ÷ 3, 1)</b> 线性缩放增量，属<b>参数推演而非实测响应曲线</b>。</div>
        <div class="form-row" style="margin-bottom:10px;align-items:end">
          <div class="form-group" style="max-width:210px"><label>补贴金额（元/kWh）</label>
            <input class="form-input" type="number" min="0" max="10" step="0.1" value="${this.rate}" onchange="SubsidySensitivity.setRate(this.value)"></div>
          <div class="form-group" style="max-width:150px"><button class="btn btn-outline btn-sm" onclick="SubsidySensitivity.setRate(3)">政策基准 3 元</button></div>
          <div class="form-group" style="max-width:170px"><button class="btn btn-outline btn-sm" onclick="SubsidySensitivity.setRate(0.2)">现行削峰移峰 0.2 元</button></div>
          <div class="form-group" style="max-width:130px"><button class="btn btn-outline btn-sm" onclick="SubsidySensitivity.resetRate()">恢复</button></div>
        </div>
        <div class="calc-note">政策参考：重庆 2025 需求响应补贴基准为 <b>25 元/kW·次</b>（按响应功率）；削峰移峰为<b>周 0.2 元/kWh、月 0.15 元/kWh</b>（按电量）。与本页 3 元/kWh <b>计量口径不同，不可直接比较</b>；3 元为项目测算假设，不是政策标准。</div>
        <div style="font-size:13px;font-weight:700;margin:14px 0 6px">① 响应系数 α：补贴的拉动集中在高温升档</div>
        ${alphaBlock}
        ${midNote}
        ${hiNote}
        <div style="font-size:13px;font-weight:700;margin:14px 0 6px">② 高档调控潜力：补贴撬动量（kW）</div>
        <div class="data-table-wrapper" style="max-height:none"><table class="data-table">
          <thead><tr><th>业态</th><th>无激励潜力</th><th>3元情景潜力</th><th>当前情景潜力</th><th>撬动增量</th><th>增量占比</th></tr></thead>
          <tbody>${pRows}${pTotal}</tbody></table></div>
        <div class="calc-note green"><b>测算结论：</b>高档调控下无激励潜力 ${fmt(noSum,0)} kW，${this.rate<=3?`${this.rate} 元补贴后`:'补贴达 3 元以上后'} ${fmt(ySum,0)} kW，撬动 ${fmt(dSum,0)} kW（+${fmt(dSum/noSum*100,1)}%）；增量主要集中在办公写字楼、商业综合体、商超与企事业单位。低档、中档常规调控无激励已具备充足响应能力，补贴投入几乎无增量。</div>
        <div class="calc-note">本模块为<b>独立情景视图</b>：不改写全市中性 ${fmt(CityPotential.mw(CityPotential.totals().neutral),2)} MW / 可下发 ${fmt(CityPotential.mw(CityPotential.totals().dispatch20),2)} MW 标准口径，不进入区县任务分配；撬动量 ${fmt(dSum,0)} kW（≈${fmt(dSum/1000,2)} MW）约为全市中性潜力的 ${fmt(dSum/1000/CityPotential.mw(CityPotential.totals().neutral)*100,2)}%，与全市外推不同尺度、不可相加；新增样本使全市总量波动时，本表仍按基准样本口径展示，二者不互相覆盖。</div>
      </div>
    </details>`;
  }
};

/* ============================================================
   系统复原：出厂快照须在任何持久化数据载入之前捕获
============================================================ */
const FACTORY_SNAPSHOT={
  buildings:BUILDINGS.map(b=>({...b})),
  ledger:{filterType:'全部',filterAC:'全部',filterDistrict:'全部',outdoorTemp:35,incentive:'按楼宇配置',tempMode:'building',tempOffset:1},
  synergyParams:Object.fromEntries(Object.entries(Aggregate.synergyParams).map(([k,v])=>[k,v.value])),
  districtParams:Object.fromEntries(Object.entries(DistrictAlloc.params).map(([k,v])=>[k,v.value])),
  city:{tab:'districts',tier:'全部',district:'全部',mode:'standard',dispatchRatio:0.2,dispatchOverride:null,sensitivity:{...CityPotential.sensitivity}},
  subsidyRate:3
};
const SystemReset={
  dataKeys:['ac-v3-custom-buildings','ac-v3-building-config','ac-v3-sample-baseline','ac-v3-baseline-auto','ac-v3-synergy-source-mode-v2','ac-v3-synergy-buildings','ac-v3-subsidy-rate'],
  open(){
    if(document.querySelector('.modal-overlay[data-reset]'))return;
    const m=document.createElement('div');
    m.className='modal-overlay show';m.dataset.reset='1';
    m.innerHTML=`<div class="modal" style="width:540px">
      <h3>系统复原</h3>
      <div class="calc-note" style="margin-bottom:14px">复原后各页参数回归出厂值，全市测算、区县分配与协同执行自动重算。请选择复原范围。</div>
      <div style="display:grid;gap:10px">
        <div style="border:1px solid var(--border);border-radius:9px;padding:12px 14px">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:5px">恢复默认参数</div>
          <div style="font-size:12.5px;color:var(--text-muted);line-height:1.7">计算参数、筛选条件、协同系数、分配权重、方案选择与样本跟随方式回到出厂值；已录入的楼宇数据保留。</div>
        </div>
        <div style="border:1px solid rgba(239,68,68,.4);border-radius:9px;padding:12px 14px;background:rgba(239,68,68,.05)">
          <div style="font-weight:700;font-size:13.5px;margin-bottom:5px;color:var(--danger)">恢复出厂状态</div>
          <div style="font-size:12.5px;color:var(--text-muted);line-height:1.7">在恢复默认参数基础上，清空全部新增楼宇、还原逐户编辑，回到合同锁定 61 栋 / 1282.05 MW。不可撤销。</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-outline" onclick="SystemReset.apply(false,this)">恢复默认参数</button>
        <button class="btn btn-primary" style="background:var(--danger);border-color:var(--danger)" onclick="SystemReset.apply(true,this)">恢复出厂状态</button>
      </div>
    </div>`;
    document.body.appendChild(m);
  },
  apply(full,btn){
    if(full&&!confirm('确认恢复出厂状态？将清空全部新增楼宇与逐户编辑，回到合同锁定 61 栋 / 1282.05 MW，且不可撤销。'))return;
    const S=FACTORY_SNAPSHOT;
    if(full){
      this.dataKeys.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
      BUILDINGS.splice(0,BUILDINGS.length,...S.buildings.map(b=>({...b})));
      SampleBaseline.state=null;SampleBaseline.preview=null;
      CITY_BENCHMARKS.splice(0,CITY_BENCHMARKS.length,...LOCKED_CITY_BENCHMARKS.map(b=>({...b})));
      DistrictAlloc.DEFAULT_DISTRICTS.forEach(d=>{if(d.__lockedPotential!==undefined)d.potential=d.__lockedPotential;});
      Aggregate.sourceList=null;Aggregate.executionResults={};
    }
    Object.assign(Ledger,S.ledger);
    Object.keys(Aggregate.synergyParams).forEach(k=>{Aggregate.synergyParams[k].value=S.synergyParams[k]});
    Object.assign(Aggregate,{tab:'task',selectedDistrict:'江北区',selectedBuildingId:null,managerOpen:false,editingId:null,formOpen:false,lastImportMessage:'',pendingImport:null});
    /* 场景复原同样遵守取值区间，防止旧快照里存着越界值把能力上限算飞 */
    Object.keys(DistrictAlloc.params).forEach(k=>{
      const p=DistrictAlloc.params[k], v=parseFloat(S.districtParams[k]);
      p.value=Number.isFinite(v)?+Math.min(p.max,Math.max(p.min,v)).toFixed(3):p.value;
    });
    DistrictAlloc.tab='alloc';DistrictAlloc.selectedScheme='mutual';DistrictAlloc.autoSyncTarget=true;
    Object.assign(CityPotential,S.city);
    CityPotential.sensitivity={...S.city.sensitivity}; // 断开与出厂快照的引用，避免复原后被后续修改污染
    SubsidySensitivity.rate=S.subsidyRate;
    if(!full){try{localStorage.setItem(SubsidySensitivity.key,String(S.subsidyRate))}catch(e){}}
    SampleBaseline.auto=true;SampleBaseline.selectedSource='custom';SampleBaseline.expanded=false;
    SingleExecution.sReset();
    Aggregate.sourceMode='ledger';
    /* 完整复原已清空存储键，不再写回；仅参数复原需把出厂默认值持久化 */
    if(!full){
      try{localStorage.setItem(SampleBaseline.autoKey,'1')}catch(e){}
      try{localStorage.setItem(Aggregate.sourceModeKey,'ledger')}catch(e){}
    }
    if(btn)btn.closest('.modal-overlay').remove();
    SystemSync.refresh();
    showToast(full?'已恢复出厂状态：61 栋 / 1282.05 MW，数据与参数全部归位':'已恢复默认参数：参数、筛选、方案与样本口径归位，楼宇数据保留','success');
  }
};

/* ============================================================
   初始化
============================================================ */
CustomBuildingStore.apply();   // 先合并扩展台账（新增/导入楼宇）
BuildingConfigStore.load();    // 再恢复逐户配置，保证扩展楼宇的设定也被还原
SampleBaseline.load();         // 最后恢复基准样本（自定义批次会重标定六类标杆与区县外推）
buildNav();
navigateTo('citypotential');
</script>
</body>
</html>
