<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重庆空调调控管理系统 V3.0 · 计算引擎驱动版</title>
<style>
:root{
  --bg-deep:#0a0e17;--bg-panel:#111827;--bg-card:#1a2235;--bg-hover:#1e2a40;
  --border:#1e3050;--border-accent:#2a4a7f;--text-primary:#e8edf5;--text-secondary:#8899b4;
  --text-muted:#5a6d85;--accent:#3b82f6;--accent-glow:rgba(59,130,246,.3);--accent-cyan:#06b6d4;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;--orange:#f97316;--accent-blue:#3b82f6;
  --gradient-1:linear-gradient(135deg,#3b82f6,#06b6d4);--font:'Microsoft YaHei','Noto Sans SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg-deep);color:var(--text-primary);min-height:100vh;overflow-x:hidden}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:60px 60px}
.bg-glow{position:fixed;pointer-events:none;z-index:0;width:600px;height:600px;background:radial-gradient(circle,rgba(59,130,246,.06) 0%,transparent 70%);top:-200px;right:-100px}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:240px;min-width:240px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0;position:sticky;top:0;height:100vh;z-index:10}
.sidebar-logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px}
.sidebar-logo .logo-icon{width:40px;height:40px;background:var(--gradient-1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;margin-bottom:10px}
.sidebar-logo h1{font-size:15px;font-weight:700;line-height:1.4}
.sidebar-logo span{font-size:11px;color:var(--text-muted)}
.sidebar-nav{flex:1;padding:0 12px;overflow-y:auto}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:12px;color:var(--text-muted);letter-spacing:.08em;padding:14px 8px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .2s;font-size:14px;color:var(--text-secondary);margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item .nav-icon{font-size:18px;width:22px;text-align:center}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.sidebar-footer .reset-btn{display:block;width:100%;margin-top:11px;padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text-muted);font-size:11.5px;cursor:pointer;transition:all .2s}
.sidebar-footer .reset-btn:hover{border-color:var(--warning);color:var(--warning);background:rgba(245,158,11,.08)}
.status-dot{display:inline-block;width:7px;height:7px;background:var(--success);border-radius:50%;margin-right:6px;box-shadow:0 0 6px var(--success)}
.main{flex:1;padding:0;overflow-y:auto;height:100vh}
.page{display:none;padding:28px 32px}
.page.active{display:block}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-header h2{font-size:22px;font-weight:700}
.page-header .breadcrumb{font-size:13px;color:var(--text-muted)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:all .3s}
.stat-card:hover{border-color:var(--border-accent);box-shadow:0 4px 20px rgba(59,130,246,.08)}
.stat-card .stat-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.stat-card .stat-value{font-size:26px;font-weight:700;line-height:1;margin-bottom:4px}
.stat-card .stat-label{font-size:13px;color:var(--text-secondary)}
.stat-card .stat-change{font-size:12px;margin-top:8px}
.stat-card.stat-clickable{cursor:pointer}
.stat-card.stat-clickable .stat-change{opacity:.9}
.stat-card.stat-clickable:hover .stat-change,.stat-card.stat-clickable.expanded .stat-change{opacity:1;text-decoration:underline}
.stat-card.stat-clickable:hover{border-color:var(--accent-cyan);box-shadow:0 4px 20px rgba(34,211,238,.1)}
.stat-change.up{color:var(--success)}.stat-change.down{color:var(--danger)}
.stat-icon.blue{background:rgba(59,130,246,.15);color:var(--accent)}
.stat-icon.cyan{background:rgba(6,182,212,.15);color:var(--accent-cyan)}
.stat-icon.purple{background:rgba(139,92,246,.15);color:var(--purple)}
.stat-icon.orange{background:rgba(249,115,22,.15);color:var(--orange)}
.stat-icon.green{background:rgba(16,185,129,.15);color:var(--success)}
.stat-icon.red{background:rgba(239,68,68,.15);color:var(--danger)}
/* 双口径统计卡：实测标杆（基准锚点）与当前设定（随参数实时重算）并列 */
.overview-stats .stat-card{padding:14px 16px}
.overview-stats .stat-icon{width:30px;height:30px;font-size:15px;margin-bottom:8px}
.overview-stats .stat-value{font-size:23px}
.overview-stats .stat-change{margin-top:6px}
.stat-dual .dual-title{font-size:13px;color:var(--text-secondary);font-weight:600;margin:-4px 0 10px}
.stat-dual .dual-values{display:flex;align-items:stretch;gap:10px}
.stat-dual .dual-item{flex:1;min-width:0}
.stat-dual .dual-sep{width:1px;background:var(--border);margin:1px 0}
.stat-dual .stat-value{font-size:23px;white-space:nowrap}
.stat-dual .stat-value.dyn{color:var(--accent-cyan)}
.stat-dual .stat-label{font-size:11.5px;white-space:nowrap}
/* 出厂参数态只有单口径：按普通统计卡排布，避免标题/副值把数值挤到中间 */
.stat-dual.factory-single .dual-title{display:none}
.stat-dual.factory-single .dual-values{display:block}
.stat-dual.factory-single .dual-item .stat-value{font-size:26px}
.stat-dual.factory-single .dual-item .stat-label{font-size:13px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border)}
.panel-header h3{font-size:16px;font-weight:600}
.panel-body{padding:20px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;font-family:var(--font)}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border-accent);color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px}
.form-input,.form-select{width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--text-primary);padding:9px 12px;border-radius:8px;font-size:14px;font-family:var(--font)}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
/* 楼宇维护表单：5 列网格，13 项属性 3 行排完，不再拉成一条长龙 */
.bm-form{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px 12px}
.bm-form .fg{display:flex;flex-direction:column;min-width:0}
.bm-form label{font-size:11.5px;color:var(--text-muted);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-form .form-input,.bm-form .form-select{height:34px;padding:0 10px;font-size:12.5px;border-radius:7px}
.bm-form .fg-act{grid-column:span 2;flex-direction:row;justify-content:flex-end;align-items:flex-end;gap:8px}
@media(max-width:1280px){.bm-form{grid-template-columns:repeat(3,minmax(0,1fr))}.bm-form .fg-act{grid-column:span 3}}
/* 表单默认收起，点「新增楼宇 / 编辑」才展开 */
.bm-form-wrap{background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.22);border-radius:9px;padding:13px 14px 14px;margin-bottom:4px}
/* 分配参数展开区：与新增楼宇表单同构的浅色框，跟在清单表之后 */
.param-embed{background:rgba(34,211,238,.045);border:1px solid rgba(34,211,238,.20);border-radius:9px;padding:12px 14px 14px;margin-top:14px}
.param-embed .grp-cap{margin-top:0}
/* 参数卡片内的建议取值行 */
.param-card .adv-line{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border);font-size:11.5px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;line-height:1.5}
.param-card .adv-line b{color:var(--accent-green);font-size:13px;font-variant-numeric:tabular-nums}
.param-card .adv-line.same b{color:var(--text-secondary)}
.param-card .adv-line span{color:var(--text-muted)}
/* 楼宇能力分布：横向条形（长度按本区最大楼宇归一化） */
.bm-bars{max-height:302px;overflow-y:auto;padding:1px 0 2px}
.bm-bars .bar-row{display:grid;grid-template-columns:158px 1fr 76px;align-items:center;gap:10px;height:19px}
.bm-bars .bar-name{font-size:11.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.bm-bars .bar-track{position:relative;height:8px;background:rgba(148,163,184,.10);border-radius:3px;overflow:hidden}
.bm-bars .bar-track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bm-bars .bar-val{font-size:11.5px;color:var(--text-primary);text-align:right;font-variant-numeric:tabular-nums}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--bg-panel);color:var(--accent);padding:10px 8px;text-align:center;border:1px solid var(--border);white-space:nowrap;font-weight:600;font-size:13px;position:sticky;top:0;z-index:2}
.data-table td{background:var(--bg-deep);padding:8px;text-align:center;border:1px solid var(--border);color:var(--text-secondary);font-size:13px}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-primary)}
.data-table tbody tr:hover td{background:var(--bg-hover)}
.data-table tbody tr.row-focused td{background:rgba(34,211,238,.14);box-shadow:inset 0 1px 0 rgba(34,211,238,.35),inset 0 -1px 0 rgba(34,211,238,.35)}
.data-table tbody tr.row-focused td:first-child{box-shadow:inset 3px 0 0 var(--accent-cyan),inset 0 1px 0 rgba(34,211,238,.35),inset 0 -1px 0 rgba(34,211,238,.35)}
.data-table-wrapper{max-height:560px;overflow:auto;margin-top:6px;border:1px solid var(--border);border-radius:8px}
.badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent)}
.badge-cyan{background:rgba(6,182,212,.15);color:var(--accent-cyan)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple)}
.badge-green{background:rgba(16,185,129,.15);color:var(--success)}
.badge-red{background:rgba(239,68,68,.15);color:var(--danger)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-orange{background:rgba(249,115,22,.15);color:var(--orange)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{padding:9px 16px;background:var(--bg-panel);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;font-size:13px;border-radius:8px 8px 0 0;transition:all .2s;font-family:var(--font)}
.tab-btn.active{background:var(--bg-card);color:var(--accent);border-bottom-color:var(--bg-card);font-weight:600}
.info-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:12px 16px;font-size:13.5px;color:var(--text-secondary);line-height:1.7;margin-bottom:16px}
.info-box strong{color:var(--accent)}
.info-box.green{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.info-box.green strong{color:var(--success)}
.info-box.warning{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.2)}
.info-box.warning strong{color:var(--warning)}
/* 弹窗遮罩与卡片：台账详情 / 新增楼宇 / 批量导入 / 扩展管理 共用 */
.modal-overlay{position:fixed;inset:0;background:rgba(8,12,22,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--bg-panel);border:1px solid var(--border-accent);border-radius:12px;padding:22px 24px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 18px 48px rgba(0,0,0,.45)}
.modal h3{margin:0 0 14px;font-size:17px;color:var(--accent)}
/* 全局提示条：固定底部居中，压在弹窗之上（弹窗 z-index:999） */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:1200;
  max-width:min(720px,86vw);padding:11px 20px 11px 18px;border-radius:10px;
  background:rgba(17,24,39,.98);border:1px solid var(--border-accent);border-left:4px solid var(--accent);
  color:var(--text-primary);font-size:13.5px;line-height:1.65;
  box-shadow:0 16px 42px rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;white-space:pre-line;text-align:left}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.is-error{border-left-color:var(--danger);border-color:rgba(239,68,68,.45)}
.toast.is-success{border-left-color:var(--success);border-color:rgba(16,185,129,.4)}
.toast.is-warn{border-left-color:var(--warning);border-color:rgba(245,158,11,.4)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
/* 表单字段级校验反馈 */
.nb-invalid{border-color:var(--danger) !important;box-shadow:0 0 0 2px rgba(239,68,68,.18)}
.field-err{color:var(--danger);font-size:11.5px;margin-top:4px;line-height:1.5}
.range-row{display:flex;align-items:center;gap:6px}
.range-row .form-input{width:100%;min-width:0}
.range-row .sep{color:var(--text-muted);flex:none}
.formula-box{margin:8px 0;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:8px;padding:10px 14px;font-family:ui-monospace,Consolas,monospace;font-size:14px;text-align:center;color:var(--accent)}
.mini-tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.mini-tb th,.mini-tb td{border:1px solid rgba(255,255,255,.08);padding:5px 8px;text-align:center}
.mini-tb th{background:rgba(255,255,255,.05);color:var(--text-muted);font-weight:600}
details.calc-logic{margin:14px 0;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
details.calc-logic summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:600;color:var(--accent);list-style:none;display:flex;align-items:center;gap:8px}
details.calc-logic summary::-webkit-details-marker{display:none}
.calc-hint{font-size:11px;font-weight:400;color:var(--text-muted)}
.calc-body{padding:4px 18px 18px;color:var(--text-secondary);font-size:13.5px;line-height:1.85}
.calc-body b{color:var(--accent)}
details.calc-logic.nested-model{margin:14px 0 2px;margin-left:2px;border-left:3px solid var(--accent);background:rgba(255,255,255,.035)}
details.calc-logic.nested-model>summary{padding:10px 14px;font-size:12.5px;color:var(--accent-cyan)}
.calc-step{margin:14px 0 6px;font-weight:700;font-size:13px;color:var(--accent-cyan)}
.flow-step{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.flow-step .step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.flow-step .step-num.done{background:var(--success)}
.flow-step .step-num.active{background:var(--warning);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.flow-step .step-content{flex:1}
.flow-step .step-title{font-size:13px;font-weight:600}
.flow-step .step-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
.rank-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rank-bar-name{width:90px;font-size:12px;color:var(--text-secondary);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-bar-track{flex:1;height:20px;background:var(--bg-deep);border-radius:4px;overflow:hidden}
.rank-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-cyan));border-radius:4px;transition:width .4s}
.rank-bar-val{width:80px;font-size:12px;font-weight:600;color:var(--accent-cyan);flex-shrink:0}
.param-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
@media(max-width:1200px){.param-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.param-grid{grid-template-columns:1fr}}
.param-card{background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:11px 13px}
.param-card h3{font-size:13px;margin-bottom:8px;color:var(--accent-cyan);display:flex;align-items:center;gap:6px}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.psym{font-size:11.5px;font-weight:600;border:1px solid;border-radius:4px;padding:0 5px;line-height:17px;min-width:22px;text-align:center;display:inline-block}
.pname{font-size:12.5px;color:var(--text-primary)}
.param-card .value-row{display:flex;align-items:center;gap:8px}
.param-card .value-row input{background:var(--bg-deep);border:1px solid var(--border);color:var(--text-primary);padding:6px 10px;border-radius:6px;font-size:13px;width:100%}
.param-card .unit{font-size:12px;color:var(--text-muted);white-space:nowrap}
.prange{font-size:11px;color:var(--text-muted);margin-top:6px;letter-spacing:.2px}
.param-card .desc{font-size:11.5px;color:var(--text-secondary);margin-top:7px;line-height:1.55}
.pnum{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;font-size:11.5px;border:1px solid currentColor;flex-shrink:0}
.psrc{font-size:11px;color:var(--text-muted);margin-top:6px;line-height:1.5;padding-left:8px;border-left:2px solid var(--border)}
.param-flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;margin-bottom:12px;padding:7px 12px;border:1px dashed var(--border);border-radius:6px;background:rgba(255,255,255,.02)}
.param-flow .pstep{white-space:nowrap;display:inline-block}
.param-flow b{color:var(--accent-cyan);font-weight:600}
.param-flow i{color:var(--text-secondary);font-style:normal;font-size:11.5px}
.param-flow .arrow{color:var(--text-muted);opacity:.55}
.param-flow sub{font-size:.72em;vertical-align:-1.5px;margin:0;letter-spacing:0}
.mini-tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.mini-tb th,.mini-tb td{border:1px solid var(--border);padding:5px 8px;text-align:center}
.mini-tb th{background:var(--bg-panel);color:var(--accent-cyan)}
.calc-step{font-size:13px;font-weight:600;color:var(--accent);margin:14px 0 6px;padding-left:8px;border-left:3px solid var(--accent)}
/* 模型原理：放大公式 + 符号区间表 */
.model-logic .calc-body{padding:2px 16px 16px;line-height:1.6}
.model-lead{font-size:12.5px;color:var(--text-secondary);margin:2px 0 12px}
.formula-list{display:grid;gap:8px}
.formula-row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-left:3px solid var(--accent-cyan);border-radius:6px;padding:9px 12px}
.formula-row .fcase{font-size:13px;font-weight:600;color:var(--text-primary)}
.formula-row .fexpr{font-family:ui-monospace,Consolas,monospace;font-size:16px;color:var(--accent-cyan);white-space:nowrap;overflow-x:auto}
.grp-cap{display:flex;align-items:center;gap:9px;margin:16px 0 9px;font-size:12px;font-weight:700;color:var(--accent-cyan);letter-spacing:.4px}
.grp-cap:first-child{margin-top:2px}
.grp-cap::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(56,189,248,.38),rgba(56,189,248,.02))}
.grp-cap em{font-style:normal;font-weight:500;color:var(--text-muted);letter-spacing:0}
.sym-cap{font-size:12.5px;font-weight:600;color:var(--text-muted);margin:14px 0 6px}
.sym-tb{width:100%;border-collapse:collapse;font-size:12.5px}
.sym-tb th,.sym-tb td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.sym-tb th{background:var(--bg-panel);color:var(--text-muted);font-weight:600;white-space:nowrap}
.sym-tb td:first-child{width:96px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--accent-cyan);font-weight:600;white-space:nowrap}
.sym-tb td:nth-child(2){width:170px;color:var(--text-primary)}
/* 模型内嵌「参数解析」小折叠块：归置到各自模型下，避免 40 项大表扎堆 */
.param-sub{margin-top:12px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.015)}
.param-sub>summary{padding:7px 11px;font-size:11.5px;color:var(--text-muted);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px}
.param-sub>summary::-webkit-details-marker{display:none}
.param-sub>summary::before{content:'▸';font-size:10px;color:var(--accent-cyan);transition:transform .2s}
.param-sub[open]>summary::before{transform:rotate(90deg)}
.param-sub>summary b{font-size:11.5px;color:var(--text-secondary);font-weight:600}
.param-sub .ps-body{padding:0 10px 10px}
.param-sub table{width:100%;border-collapse:collapse;font-size:11.5px}
.param-sub th,.param-sub td{border:1px solid var(--border);padding:4px 7px;text-align:left;vertical-align:top}
.param-sub th{background:var(--bg-panel);color:var(--text-muted);font-weight:600;white-space:nowrap;font-size:11px}
.param-sub td:first-child{color:var(--text-secondary)}
.param-sub .ps-sym{font-family:ui-monospace,Consolas,monospace;color:var(--accent-cyan);white-space:nowrap}
.param-sub .ps-val{color:var(--accent-cyan);font-weight:600;white-space:nowrap}
@media(max-width:900px){
  .formula-row{grid-template-columns:1fr;gap:4px}
  .sym-tb{font-size:12px}
}
@media(max-width:1100px){
  .sidebar{width:64px;min-width:64px}
  .sidebar-logo h1,.sidebar-logo span,.nav-item span:not(.nav-icon),.nav-section-title,.sidebar-footer{display:none}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}

/* ============================================================

function showToast(msg,type){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;
  t.classList.remove('is-error','is-success','is-warn');
  if(type==='error')t.classList.add('is-error');
  else if(type==='success')t.classList.add('is-success');
  else if(type==='warn')t.classList.add('is-warn');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),type==='error'?4600:2600);
}
function fmt(v,d){d=d??2;const n=parseFloat(v);return isNaN(n)?v:n.toFixed(d)}
function fmtInt(v){return Math.round(v).toLocaleString()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* 重渲染会整体替换 innerHTML，替换瞬间页面高度归零，浏览器把滚动位置钳到页首，
   导致「改一格参数 → 视线跳回顶部」。这里在渲染前记下滚动位置与焦点输入框，
   渲染后原样还原，做到改完还停在原来那一行。 */
const ScrollKeeper={
  /* 实际滚动容器是 main.main（overflow:auto），不是 document —— 记错容器就还原不了 */
  _box(){return document.querySelector('main.main')||document.scrollingElement||document.documentElement;},
  capture(){
    if(this._skip){this._skip=false;return null;}
    const box=this._box();
    const y=box?box.scrollTop:0;
    const a=document.activeElement;
    let key=null,pos=null,innerY=0;
    if(a&&a.dataset&&a.dataset.fkey){
      key=a.dataset.fkey;
      try{pos=a.selectionStart;}catch(e){pos=null;}
      const w=a.closest('.data-table-wrapper');
      if(w)innerY=w.scrollTop;
    }
    return {y,key,pos,innerY};
  },
  /* 切标签/换区县属于整屏换内容，保持原滚动位置反而容易停到半空，这里主动放弃还原 */
  skipNext(){this._skip=true;const b=this._box();if(b)b.scrollTop=0;},
  restore(snap,root){
    if(!snap)return;
    const box=this._box();
    if(box&&snap.y>0)box.scrollTop=snap.y;
    if(snap.key){
      const t=(root||document).querySelector('[data-fkey="'+snap.key+'"]');
      if(t){
        try{t.focus({preventScroll:true});}catch(e){try{t.focus();}catch(e2){}}
        if(snap.pos!=null){try{t.setSelectionRange(snap.pos,snap.pos);}catch(e){}}
        if(snap.innerY>0){const w=t.closest('.data-table-wrapper');if(w)w.scrollTop=snap.innerY;}
      }
    }
    if(box&&snap.y>0)box.scrollTop=snap.y;
  }
};
const NAV_ITEMS=[

let currentPage='citypotential';
function navigateTo(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  if(page==='ledger')Ledger.render();
  if(page==='citypotential')CityPotential.render();
  if(page==='district')DistrictAlloc.init();
  if(page==='aggregate')Aggregate.render();
  /* 真正滚动的是 main.main（overflow:auto），window.scrollTo 对它无效，换页会停在上一页的位置 */
  const _main=document.querySelector('main.main');
  if(_main)_main.scrollTop=0;
  window.scrollTo(0,0);
}

/* ============================================================
   第一层：可调潜力计算引擎（核心地基）
   基于计算说明书：ΔP = P·α·K·ΔT
   多联机：高响应K取大；冷水机组：K取小且随温度动态修正
============================================================ */
const PotentialEngine={
  /* K系数矩阵：附件6《国网可调潜力修.xlsx》按 系统 × 业态 × 设定温度 × 室外温度段 标定（1/℃）。
     原 0.35~0.45「业态×年限」工程表已停用；某系统缺该业态样本时按同系统其他业态均值回退。 */
  K_MATRIX:{
    VRF:{"企事业单位":{"24":{"30-34℃":0.08,"35-39℃":0.29,"40+℃":0.09},"25":{"30-34℃":0.07,"35-39℃":0.22,"40+℃":0.07},"26":{"30-34℃":0.05,"35-39℃":0.2,"40+℃":0.06}},"党政机关":{"24":{"30-34℃":0.16,"35-39℃":0.2,"40+℃":0.09},"25":{"30-34℃":0.115,"35-39℃":0.15,"40+℃":0.07},"26":{"30-34℃":0.17,"35-39℃":0.125,"40+℃":0.06}},"办公写字楼":{"24":{"30-34℃":0.11,"35-39℃":0.25,"40+℃":0.11},"25":{"30-34℃":0.08,"35-39℃":0.2,"40+℃":0.09},"26":{"30-34℃":0.06,"35-39℃":0.11,"40+℃":0.07}},"商业综合体":{"24":{"30-34℃":0.19,"35-39℃":0.14,"40+℃":0.11},"25":{"30-34℃":0.16,"35-39℃":0.1,"40+℃":0.08},"26":{"30-34℃":0.14,"35-39℃":0.1,"40+℃":0.06}},"商超":{"24":{"30-34℃":0.18,"35-39℃":0.18,"40+℃":0.08},"25":{"30-34℃":0.11,"35-39℃":0.13,"40+℃":0.06},"26":{"30-34℃":0.07,"35-39℃":0.11,"40+℃":0.05}},"酒店":{"24":{"30-34℃":0.13,"35-39℃":0.13,"40+℃":0.12},"25":{"30-34℃":0.15,"35-39℃":0.1,"40+℃":0.08},"26":{"30-34℃":0.1,"35-39℃":0.08,"40+℃":0.08}}},
    WC:{"企事业单位":{"24":{"30-34℃":0.07,"35-39℃":0.14,"40+℃":0.13},"25":{"30-34℃":0.06,"35-39℃":0.1,"40+℃":0.07},"26":{"30-34℃":0.05,"35-39℃":0.06,"40+℃":0.05}},"办公写字楼":{"24":{"30-34℃":0.09,"35-39℃":0.17,"40+℃":0.14},"25":{"30-34℃":0.07,"35-39℃":0.11,"40+℃":0.12},"26":{"30-34℃":0.07,"35-39℃":0.06,"40+℃":0.1}},"商业综合体":{"21":{"30-34℃":0.12,"35-39℃":0.1,"40+℃":0.12},"22":{"30-34℃":0.1,"35-39℃":0.09,"40+℃":0.08},"23":{"30-34℃":0.06,"35-39℃":0.07,"40+℃":0.06}},"商超":{"24":{"30-34℃":0.15,"35-39℃":0.18,"40+℃":0.15},"25":{"30-34℃":0.11,"35-39℃":0.17,"40+℃":0.11},"26":{"30-34℃":0.08,"35-39℃":0.16,"40+℃":0.1}}}
  },
  /* 附件6 逐栋样本 K：样本楼优先用原表值，新增/未标定楼回退 K_MATRIX 业态均值 */
  K_EXACT:{"华岩镇人民政府办公楼":{"system":"VRF","sp":{"24":{"30-34℃":0.12,"35-39℃":0.17,"40+℃":0.09},"25":{"30-34℃":0.07,"35-39℃":0.11,"40+℃":0.07},"26":{"30-34℃":0.04,"35-39℃":0.09,"40+℃":0.06}}},"北碚科技创业中心":{"system":"VRF","sp":{"24":{"30-34℃":0.08,"35-39℃":0.29,"40+℃":0.09},"25":{"30-34℃":0.07,"35-39℃":0.22,"40+℃":0.07},"26":{"30-34℃":0.05,"35-39℃":0.2,"40+℃":0.06}}},"重庆市市政府2号楼":{"system":"VRF","sp":{"24":{"30-34℃":0.2,"35-39℃":0.23,"40+℃":0.09},"25":{"30-34℃":0.16,"35-39℃":0.19,"40+℃":0.07},"26":{"30-34℃":0.3,"35-39℃":0.16,"40+℃":0.06}}},"环球大厦":{"system":"VRF","sp":{"24":{"30-34℃":0.11,"35-39℃":0.25,"40+℃":0.11},"25":{"30-34℃":0.08,"35-39℃":0.2,"40+℃":0.09},"26":{"30-34℃":0.06,"35-39℃":0.11,"40+℃":0.07}}},"龙湖西城天街":{"system":"VRF","sp":{"24":{"30-34℃":0.19,"35-39℃":0.14,"40+℃":0.11},"25":{"30-34℃":0.16,"35-39℃":0.1,"40+℃":0.08},"26":{"30-34℃":0.14,"35-39℃":0.1,"40+℃":0.06}}},"兰里酒店":{"system":"VRF","sp":{"24":{"30-34℃":0.13,"35-39℃":0.13,"40+℃":0.12},"25":{"30-34℃":0.15,"35-39℃":0.1,"40+℃":0.08},"26":{"30-34℃":0.1,"35-39℃":0.08,"40+℃":0.08}}},"江城名都1号楼":{"system":"VRF","sp":{"24":{"30-34℃":0.13,"35-39℃":0.13,"40+℃":0.12},"25":{"30-34℃":0.15,"35-39℃":0.1,"40+℃":0.08},"26":{"30-34℃":0.1,"35-39℃":0.08,"40+℃":0.08}}},"华熙超市":{"system":"VRF","sp":{"24":{"30-34℃":0.18,"35-39℃":0.18,"40+℃":0.08},"25":{"30-34℃":0.11,"35-39℃":0.13,"40+℃":0.06},"26":{"30-34℃":0.07,"35-39℃":0.11,"40+℃":0.05}}},"恒大中渝广场（写字楼）":{"system":"WC","sp":{"24":{"30-34℃":0.09,"35-39℃":0.17,"40+℃":0.14},"25":{"30-34℃":0.07,"35-39℃":0.11,"40+℃":0.12},"26":{"30-34℃":0.07,"35-39℃":0.06,"40+℃":0.1}}},"恒大中渝广场（商场）":{"system":"WC","sp":{"21":{"30-34℃":0.12,"35-39℃":0.1,"40+℃":0.12},"22":{"30-34℃":0.1,"35-39℃":0.09,"40+℃":0.08},"23":{"30-34℃":0.06,"35-39℃":0.07,"40+℃":0.06}}},"红星美凯龙":{"system":"WC","sp":{"24":{"30-34℃":0.15,"35-39℃":0.18,"40+℃":0.15},"25":{"30-34℃":0.11,"35-39℃":0.17,"40+℃":0.11},"26":{"30-34℃":0.08,"35-39℃":0.16,"40+℃":0.1}}},"万象城":{"system":"WC","sp":{"21":{"30-34℃":0.12,"35-39℃":0.1,"40+℃":0.12},"22":{"30-34℃":0.1,"35-39℃":0.09,"40+℃":0.08},"23":{"30-34℃":0.06,"35-39℃":0.07,"40+℃":0.06}}},"宜家家居":{"system":"WC","sp":{"24":{"30-34℃":0.15,"35-39℃":0.18,"40+℃":0.15},"25":{"30-34℃":0.11,"35-39℃":0.17,"40+℃":0.11},"26":{"30-34℃":0.08,"35-39℃":0.16,"40+℃":0.1}}},"空港工业园":{"system":"WC","sp":{"24":{"30-34℃":0.07,"35-39℃":0.14,"40+℃":0.13},"25":{"30-34℃":0.06,"35-39℃":0.1,"40+℃":0.07},"26":{"30-34℃":0.05,"35-39℃":0.06,"40+℃":0.05}}}},
  /* 标定表与台账的楼宇名称可能只差空格，匹配前统一去空白 */
  normName(s){return String(s==null?'':s).replace(/[\s\u3000]/g,'');},
  // 用户响应系数α：无激励 / 有激励，来自计算说明书表3（26℃基准）
  ALPHA_TABLE:{
    '党政机关':{'无激励':0.075,'有激励':0.10},
    '企事业单位':{'无激励':0.005,'有激励':0.075},
    '办公写字楼':{'无激励':0.05,'有激励':0.075},
    '商业综合体':{'无激励':0.05,'有激励':0.075},
    '商超':{'无激励':0.005,'有激励':0.05},
    '酒店':{'无激励':0.0,'有激励':0.025}
  },
  // 被动执行达成率 Kp：实测标杆分支的响应修正下限。
  // α 表是意愿调查口径（部分业态无激励=0），但实测标杆本身就是该楼宇真实响应行为的
  // 测量结果——无激励户在实测中也测出了标杆值，用 α=0 把实测能力清零自相矛盾。
  // 故响应修正 = max(α比值, Kp)：无激励（监测互动）户按通知式调节仍可执行标杆能力的
  // 60%（需求响应行业纯通知/自愿响应的典型达成率 50%~70% 取中，情景参数可校准）。
  PASSIVE_RATE:0.6,
  /* 注：曾评估把「上调幅度」由线性（×Δt）改为边际递减（每多 1℃ 增 35%），更贴近
     空调能耗的饱和曲线。但三级策略库的 F2/F3 正是用 1.5℃/2℃ 取得更大的 C(ℓ) 容量，
     改递减会连带压低策略侧能力（实测江北区可执行量 4289 → 3582 kW），属口径变更
     而非缺陷修复，故不启用；改为在界面标注该口径的乐观边界，并对结果按基准负荷封顶。 */
  AMP_DECAY:null,
  HISTORY_RATE:{'党政机关':0.95,'企事业单位':0.85,'办公写字楼':0.92,'商业综合体':0.88,'商超':0.80,'酒店':0.75},
  // 冷水机组冷冻水温提升效率系数：每提升1℃，压缩机功耗下降约3%（ASHRAE标准）
  CHW_EFFICIENCY_PER_C:0.03,
  /* 室外温度分段削减率：兼容展示入口，值取多联机柔性调节实测均值。
     实际计算按 系统×调节方式 走 MEASURED_RATES，见 measuredRate()。 */
  TEMP_SEGMENTS:{
    '30-34℃':{reductionRate:0.0896,label:'30-34℃'},
    '35-39℃':{reductionRate:0.1699,label:'35-39℃'},
    '40+℃':{reductionRate:0.0785,label:'40℃以上'}
  },
  /* 实测单位温升削减率：来源为调控策略模型 data.json 的 72 个 unit_rate_per_C，
     按 系统(VRF多联机/WC冷水机) × 调节方式(柔性/监测) × 温度段 取六业态均值。
     实测曲线在 35-39℃ 达峰、40℃以上回落，与原计算说明书单调递增假设不同。
     BASE_SEG 为基准段：默认室外温度 35℃ 落此段，温度修正因子=1，保证出厂口径不变。 */
  MEASURED_RATES:{
    VRF:{'柔性调节':{'30-34℃':0.0896,'35-39℃':0.1699,'40+℃':0.0785},
         '监测互动':{'30-34℃':0.0886,'35-39℃':0.1648,'40+℃':0.0762}},
    WC: {'柔性调节':{'30-34℃':0.0880,'35-39℃':0.1106,'40+℃':0.1010},
         '监测互动':{'30-34℃':0.0883,'35-39℃':0.1098,'40+℃':0.0996}},
    BASE_SEG:'35-39℃'
  },

  /* 按附件6取K：系统 × 业态 × 设定温度 × 室外温度段。
     设定温度超范围时取最近档；该业态缺样本时按同系统其他业态均值回退。 */
  getK(building,outdoorTemp,setTemp){
    const ac=building.acType||'';
    const system=ac.includes('冷水')?'WC':'VRF';
    const band=outdoorTemp>=40?'40+℃':outdoorTemp>=35?'35-39℃':'30-34℃';
    const table=this.K_MATRIX[system],types=Object.keys(table);
    const allSp=[...new Set(types.flatMap(t=>Object.keys(table[t]).map(Number)))].sort((a,b)=>a-b);
    const raw=Number.isFinite(setTemp)?Number(setTemp):26;
    const sp=Math.min(Math.max(raw,allSp[0]),allSp[allSp.length-1]);
    const airFallback=ac.includes('风冷')&&!ac.includes('多联机')&&!ac.includes('冷水');
    /* 附件6 有逐栋标定的样本楼直接用原表值。
       名称需归一化后匹配：标定表写作「重庆市市政府2号楼」，台账写作「重庆市市政府 2 号楼」，
       直接查表会漏配并回退到业态均值（0.125，而本楼标定为 0.16）。 */
    const exact=this.K_EXACT[building.name]
      ||this.K_EXACT[Object.keys(this.K_EXACT).find(k=>this.normName(k)===this.normName(building.name))];
    if(exact&&exact.system===system){
      const exSp=Object.keys(exact.sp).map(Number);
      const near=exSp.reduce((a,b)=>Math.abs(b-raw)<Math.abs(a-raw)?b:a,exSp[0]);
      const rec=exact.sp[String(near)];
      if(rec&&Number.isFinite(rec[band]))
        return{k:rec[band],setpoint:near,system,band,typeUsed:'附件6·本楼标定',airCooledFallback:airFallback};
    }
    const lookup=t=>{
      const bySp=table[t]; if(!bySp)return null;
      const keys=Object.keys(bySp).map(Number);
      const near=keys.reduce((a,b)=>Math.abs(b-sp)<Math.abs(a-sp)?b:a,keys[0]);
      const rec=bySp[String(near)];
      return rec&&Number.isFinite(rec[band])?{k:rec[band],setpoint:near}:null;
    };
    let hit=types.includes(building.type)?lookup(building.type):null;
    let basis=hit?'附件6·本业态':null;
    if(!hit){
      const vals=types.map(lookup).filter(Boolean);
      if(vals.length){
        hit={k:Math.round(vals.reduce((s,v)=>s+v.k,0)/vals.length*10000)/10000,setpoint:vals[0].setpoint};
        basis='附件6·同系统业态均值';
      }
    }
    if(!hit){hit={k:system==='WC'?0.10:0.12,setpoint:sp};basis='系统默认';}
    return{...hit,system,band,typeUsed:basis,airCooledFallback:airFallback};
  },
  // 获取响应系数α
  getAlpha(buildingType,incentive){
    const tier=this.ALPHA_TABLE[buildingType]||this.ALPHA_TABLE['办公写字楼'];
    return tier[incentive]??0.05;
  },
  getHistoryRate(building){return Number.isFinite(building.historyRate)?building.historyRate:(this.HISTORY_RATE[building.type]??0.85);},
  actualReduction(building,target,available){
    const requested=Math.max(0,Number(target)||0);
    const capacity=Math.max(0,Number(available)||0);
    return Math.min(requested,capacity*this.getHistoryRate(building));
  },
  // 获取温度分段
  getTempSegment(outdoorTemp){
    if(outdoorTemp>=40)return this.TEMP_SEGMENTS['40+℃'];
    if(outdoorTemp>=35)return this.TEMP_SEGMENTS['35-39℃'];
    return this.TEMP_SEGMENTS['30-34℃'];
  },
  /* 按系统形式与调控方式取该温度段的实测单位温升削减率。
     风冷机无独立测试数据（交付资料仅有多联机/水冷两类测试），归入多联机口径并在结果里标注。 */
  rateFor(building,outdoorTemp,incentive){
    const seg=outdoorTemp>=40?'40+℃':outdoorTemp>=35?'35-39℃':'30-34℃';
    const label=seg==='40+℃'?'40℃以上':seg;
    const ac=building.acType||'';
    const hasWC=ac.includes('冷水'),hasVRF=ac.includes('多联机'),hasAC=ac.includes('风冷');
    // 系统判定：含冷水机组→水冷口径；否则（含多联机 / 纯风冷）→多联机口径。
    // 纯风冷无独立测试数据，回退多联机率并标注；多联机＋风冷按多联机口径，无需标注。
    const system=hasWC?'WC':'VRF';
    const mode=incentive==='无激励'?'监测互动':'柔性调节';
    const table=this.MEASURED_RATES[system][mode];
    return{seg,label,system,mode,rate:table[seg],base:table[this.MEASURED_RATES.BASE_SEG],
      airCooledFallback:hasAC&&!hasVRF&&!hasWC};
  },

  /**
   * 计算单栋楼宇可调潜力（核心公式）
   * @param {Object} building - 楼宇对象
   * @param {number} outdoorTemp - 室外温度℃
   * @param {number} setTemp - 室内设定温度℃
   * @param {string} incentive - '无激励' / '有激励'
   * @param {number} tempOffset - 温度上调幅度℃（默认1）
   * @returns {Object} 潜力计算结果
   */
  calc(building,outdoorTemp,setTemp,incentive,tempOffset){
    incentive=incentive==='按楼宇配置'?(building.incentive||'有激励'):incentive;
    const requestedOffset=tempOffset==='按楼宇配置'?(building.tempOffset??1):(tempOffset??1);
    tempOffset=Math.min(Math.max(0,requestedOffset),building.maxTempOffset??requestedOffset);
    const P=building.baseLoad; // 基准负荷 kW
    setTemp=building.setTemp??setTemp??26;
    const alpha=this.getAlpha(building.type,incentive); // 用户响应系数
    /* 附件6口径：K 取「上调后目标设定温度 × 室外温度段」的标定值；
       上调幅度通过目标设定温度进入公式，不再单独乘一遍 Δt。 */
    const targetSet=setTemp+tempOffset;
    const kInfo=this.getK(building,outdoorTemp,targetSet);
    /* 上调幅度按「以 1℃ 标定值为基准 × Δt」线性放大。注意：这是简化口径 ——
       三级策略库正是靠 F2/F3 的 1.5℃/2℃ 上调取得更大的 C(ℓ) 容量，
       故此处若改成边际递减，会连带压低策略侧能力与区县可执行量，
       属口径变更而非缺陷修复，故保持线性，仅在各页说明其偏乐观的边界。 */
    const ampGain=Math.max(0,tempOffset);
    let potential=0;
    let detail={};

    if(Number.isFinite(building.sourcePotential)){
      const anchorAlpha=this.getAlpha(building.type,'有激励');
      const rt=this.rateFor(building,outdoorTemp,incentive);
      const tempFactor=rt.rate/rt.base;
      // f响应 = max(α比值, 被动执行达成率)：α 表无激励值过低或为 0 时，
      // 以实测标杆证明的响应能力为准，按被动执行达成率 Kp 折减而非清零
      const alphaRatio=anchorAlpha===0?1:alpha/anchorAlpha;
      const incentiveFactor=Math.max(alphaRatio,this.PASSIVE_RATE);
      const fRespBasis=incentiveFactor>alphaRatio?'被动执行达成率 Kp':'α比值';
      potential=building.sourcePotential*tempFactor*incentiveFactor*ampGain;
      detail={model:'实测标杆情景修正',formula:'ΔP = P实测 × f温 × f响 × Δt',
        components:{实测标杆:building.sourcePotential,温度修正:tempFactor,响应修正:incentiveFactor,响应口径:fRespBasis,上调幅度:tempOffset,幅度增益:ampGain,
          实测削减率:rt.rate,基准削减率:rt.base,取率口径:`${rt.system==='VRF'?'多联机':'水冷机'}·${rt.mode}·${rt.label}`,
          风冷回退:rt.airCooledFallback}};
    }else if(building.acType==='多联机'){
      // 面板控制型（报告 3.3.1）：ΔP = P·α·K(Tin,温度段)·(Tout−Tin)
      const deltaT=Math.max(0,outdoorTemp-targetSet);
      potential=P*alpha*kInfo.k*deltaT;
      detail={model:'多联机面板控制型（附件6标定）',formula:'ΔP = P × α × K × (Tout − Tin)',
        components:{基准负荷P:P,响应系数α:alpha,K系数:kInfo.k,目标设定温度Tin:targetSet,温差ΔT:deltaT,上调幅度:tempOffset,
          取K口径:`${kInfo.system==='WC'?'水冷':'多联机'}·${kInfo.band}·${kInfo.setpoint}℃·${kInfo.typeUsed}`,
          风冷回退:kInfo.airCooledFallback}};
    }else{
      // 冷冻水温调节型（报告 3.3.1）：末端削减 + 冷冻水温效率提升
      // ΔTin = Δt·α；η 取附件6 同系统业态/设定温度/温度段标定的 K
      const terminalReduction=P*kInfo.k*ampGain*alpha;
      const chwEfficiencyGain=P*this.CHW_EFFICIENCY_PER_C*ampGain*0.5; // 0.5为实际可利用率
      potential=terminalReduction+chwEfficiencyGain;
      detail={model:'冷水机组冷冻水温调节型（附件6标定）',formula:'ΔP = P × η × α × Δt + P × 3% × Δt × 0.5',
        components:{基准负荷P:P,末端削减率:kInfo.k,响应系数α:alpha,上调幅度:tempOffset,幅度增益:ampGain,
          末端削减量:terminalReduction,冷冻水效率收益:chwEfficiencyGain,温度分段:kInfo.band,
          目标设定温度:targetSet,
          取率口径:`${kInfo.system==='WC'?'水冷':'多联机'}·${kInfo.band}·${kInfo.setpoint}℃·${kInfo.typeUsed}（附件6）`,
          风冷回退:kInfo.airCooledFallback,
          口径说明:'末端削减第一项为附件6标定的空调本体系数，依赖用户响应意愿故乘α；冷冻水效率收益第二项是供水温度提升带来的设备侧收益(ASHRAE 3%/℃×可利用率0.5)，不依赖用户意愿，故不乘α'}};
    }

    // 安全上限单独用于风险提示；不覆盖经确认的实测潜力口径。
    const maxPotential=Number.isFinite(building.safeLimit)?building.safeLimit:P*0.30;
    /* 物理硬约束：削减量不可能超过该楼自身的基准负荷（等于"全关"），
       多算的部分既不真实也无法执行，直接钳到基准负荷并标记。 */
    const rawPotential=Math.max(0,potential);
    const actualPotential=Math.min(rawPotential,P);
    /* 舒适区校验：设定温度 + 采用上调 是否越过该楼舒适上限 —— 这是「当前设定」
       唯一进入计算的位置（不改潜力，只改合规判定），使调整设定温度有可见反馈。 */
    const cm=String(building.comfort||'').match(/(\d+(?:\.\d+)?)\s*[-~—]\s*(\d+(?:\.\d+)?)/);
    const comfortHigh=cm?parseFloat(cm[2]):null;
    const comfortExcess=comfortHigh!=null?Math.round(Math.max(0,setTemp+tempOffset-comfortHigh)*10)/10:0;

    return {
      building:building.name,
      type:building.type,
      acType:building.acType,
      baseLoad:P,
      outdoorTemp:outdoorTemp,
      setTemp:setTemp,
      incentive:incentive,
      potential:Math.round(actualPotential*100)/100,
      potentialPct:Math.round(actualPotential/P*1000)/10,
      maxPotential:Math.round(maxPotential*100)/100,
      /* 超上限判定留 5.5% 容差：台账口径里「安全可调上限」本身就是可调潜力的 95%
         （61 栋中 28 栋严格等于 0.95×标杆），拿潜力直接比它必然 100% 触发，
         属于空警报。只有潜力比上限高出 5% 以上（两列口径真的不一致）才提示。 */
      capped:actualPotential>maxPotential*1.055,
      ampCapped:rawPotential>P+1e-9,
      rawPotential:Math.round(rawPotential*100)/100,
      ampGain:Math.round(ampGain*1000)/1000,
      comfortHigh:comfortHigh,
      comfortExcess:comfortExcess,
      detail:detail
    };
  },

  // 批量计算所有楼宇潜力
  calcAll(buildings,outdoorTemp,setTemp,incentive,tempOffset){
    return buildings.map(b=>this.calc(b,outdoorTemp,setTemp,incentive,tempOffset));
  },

  // 汇总潜力
  summarize(results){
    const total=results.reduce((s,r)=>s+r.potential,0);
    const byType={};
    const byAC={};
    results.forEach(r=>{
      byType[r.type]=(byType[r.type]||0)+r.potential;
      byAC[r.acType]=(byAC[r.acType]||0)+r.potential;
    });
    return{total,byType,byAC,count:results.length};
  }
};

/* ============================================================
   第二层：六类建筑三级策略库（可调用）
   编码规则：建筑类别—系统形式—调控方式—等级
   例：JG-WC-F2 = 党政机关·水冷·柔性调节·Ⅱ级
============================================================ */
const StrategyLibrary={
  TYPE_CODES:{'党政机关':'JG','企事业单位':'QS','办公写字楼':'BG','商业综合体':'SZ','商超':'SC','酒店':'JD'},
  // 六类建筑 × 三级策略定义（来自调控策略说明书表6-1）
  STRATEGIES:{
    '党政机关':{
      icon:'🏛️',restricted:'档案、机房、重要会议、政务窗口',
      levels:[
        {code:'F1',name:'办公稳态轻调',desc:'小范围末端温度提高1℃，优先普通办公区，互动目标10%',tempOffset:1,zoneFraction:0.3,interactiveTarget:10},
        {code:'F2',name:'分区协同削峰',desc:'扩大参与区域，开展分区轮调，互动目标15%',tempOffset:1.5,zoneFraction:0.5,interactiveTarget:15},
        {code:'F3',name:'重点避让深度响应',desc:'在已验证范围继续扩大，避让重要区域，互动目标20%',tempOffset:2,zoneFraction:0.7,interactiveTarget:20}
      ]
    },
    '企事业单位':{
      icon:'🏭',restricted:'工艺、实验、恒温恒湿、连续保障区域',
      levels:[
        {code:'F1',name:'办公辅助轻调',desc:'办公辅助区域轻调，互动目标10%',tempOffset:1,zoneFraction:0.25,interactiveTarget:10},
        {code:'F2',name:'非工艺区协同',desc:'非工艺区域协同削峰，互动目标15%',tempOffset:1.5,zoneFraction:0.45,interactiveTarget:15},
        {code:'F3',name:'生产边界受限响应',desc:'生产边界受限深度响应，互动目标20%',tempOffset:2,zoneFraction:0.6,interactiveTarget:20}
      ]
    },
    '办公写字楼':{
      icon:'🏢',restricted:'加班租户、强日晒区域、敏感用户',
      levels:[
        {code:'F1',name:'租户分组轻调',desc:'租户分组轻调，互动目标10%',tempOffset:1,zoneFraction:0.3,interactiveTarget:10},
        {code:'F2',name:'楼层协同削峰',desc:'楼层协同削峰，互动目标15%',tempOffset:1.5,zoneFraction:0.5,interactiveTarget:15},
        {code:'F3',name:'多租户受限深度响应',desc:'多租户受限深度响应，互动目标20%',tempOffset:2,zoneFraction:0.65,interactiveTarget:20}
      ]
    },
    '商业综合体':{
      icon:'🛍️',restricted:'餐饮、影院、儿童区、大型活动及必要新风',
      levels:[
        {code:'F1',name:'低客流温和响应',desc:'低客流区域温和响应，互动目标10%',tempOffset:1,zoneFraction:0.25,interactiveTarget:10},
        {code:'F2',name:'业态轮调削峰',desc:'业态轮调削峰，互动目标15%',tempOffset:1.5,zoneFraction:0.45,interactiveTarget:15},
        {code:'F3',name:'核心避让深度响应',desc:'核心避让深度响应，互动目标20%',tempOffset:2,zoneFraction:0.6,interactiveTarget:20}
      ]
    },
    '商超':{
      icon:'🛒',restricted:'冷链、生鲜、熟食及空气品质不足区域',
      levels:[
        {code:'F1',name:'后勤区域轻调',desc:'后勤区域轻调，互动目标10%',tempOffset:1,zoneFraction:0.2,interactiveTarget:10},
        {code:'F2',name:'非冷链协同削峰',desc:'非冷链区域协同削峰，互动目标15%',tempOffset:1.5,zoneFraction:0.4,interactiveTarget:15},
        {code:'F3',name:'营业边界受限响应',desc:'营业边界受限深度响应，互动目标20%',tempOffset:2,zoneFraction:0.55,interactiveTarget:20}
      ]
    },
    '酒店':{
      icon:'🏨',restricted:'在用客房、会议宴会、餐饮高峰及重要接待',
      levels:[
        {code:'F1',name:'公共区域轻调',desc:'公共区域轻调，互动目标10%',tempOffset:1,zoneFraction:0.2,interactiveTarget:10},
        {code:'F2',name:'空置空间协同',desc:'空置空间协同削峰，互动目标15%',tempOffset:1.5,zoneFraction:0.35,interactiveTarget:15},
        {code:'F3',name:'低入住受限持续响应',desc:'低入住受限持续响应，互动目标20%',tempOffset:2,zoneFraction:0.5,interactiveTarget:20}
      ]
    }
  },

  // 生成策略编码
  genCode(buildingType,acType,mode,level){
    const typeCode=this.TYPE_CODES[buildingType]||'BG';
    const hasVRF=acType.includes('多联机'),hasWC=acType.includes('冷水机组'),hasAC=acType.includes('风冷');
    const parts=[hasVRF?'VRF':'',hasWC?'WC':'',hasAC?'AC':''].filter(Boolean);
    const acCode=parts.length===0?'WC':parts.length===1?parts[0]:'MIX';
    const modeCode=mode==='柔性调节'?'F':'I';
    return `${typeCode}-${acCode}-${level}`;
  },

  /**
   * 策略匹配算法（来自调控策略说明书4.2节）
   * 原则：优先选择能满足目标的最低等级策略，由Ⅰ级向Ⅱ级、Ⅲ级逐级调用
   * @param {Object} building - 楼宇对象
   * @param {number} targetReduction - 目标削减量 kW
   * @param {number} outdoorTemp - 室外温度
   * @param {string} incentive - 激励政策
   * @returns {Object} 匹配结果
   */
  match(building,targetReduction,outdoorTemp,incentive){
    const strat=this.STRATEGIES[building.type]||this.STRATEGIES['办公写字楼'];
    const setTemp=building.setTemp??26;
    let matchedLevel=0;
    const levelResults=[];

    // 逐级计算每级能提供的削减量
    for(let i=0;i<3;i++){
      const lv=strat.levels[i];
      const pot=PotentialEngine.calc(building,outdoorTemp,setTemp,incentive,lv.tempOffset);
      // 实际可调 = 潜力 × 参与区域比例
      const actualAdjustable=pot.potential*lv.zoneFraction;
      levelResults.push({level:i+1,code:lv.code,name:lv.name,potential:pot.potential,
        zoneFraction:lv.zoneFraction,actualAdjustable:actualAdjustable,
        interactiveTarget:lv.interactiveTarget,tempOffset:lv.tempOffset,
        meetsTarget:actualAdjustable>=targetReduction});
      if(actualAdjustable>=targetReduction&&matchedLevel===0)matchedLevel=i+1;
    }

    // 如果三级都不满足，返回最高级+剩余缺口
    const finalLevel=matchedLevel||3;
    const selected=levelResults[finalLevel-1];
    const remainingGap=Math.max(0,targetReduction-selected.actualAdjustable);

    return{
      building:building.name,
      type:building.type,
      acType:building.acType,
      targetReduction:targetReduction,
      matchedLevel:finalLevel,
      matchedLevelName:selected.name,
      strategyCode:this.genCode(building.type,building.acType,'柔性调节',selected.code),
      actualAdjustable:Math.round(selected.actualAdjustable*100)/100,
      remainingGap:Math.round(remainingGap*100)/100,
      meetsTarget:remainingGap<=0.01,
      tempOffset:selected.tempOffset,
      zoneFraction:selected.zoneFraction,
      interactiveTarget:selected.interactiveTarget,
      restricted:strat.restricted,
      allLevels:levelResults
    };
  }
};

/* ============================================================
   楼宇台账数据
   标准业务口径 V3.1：61 户有效业务样本（合同报告锁定值，固定不变）
   台账可扩展：新增/导入楼宇进入 BUILDINGS，标记 custom，仅参与台账与调控演示，
   不计入标准口径的全市外推，因此 1282.05 MW → 区县 → 256.4 MW 链路不受影响。
   sourcePotential 为已确认实测标杆；情景参数只对该标杆作修正。

function buildBuilding({id,name,district,type,acType,capacity,baseLoad,sourcePotential,safeLimit,
  setTemp,incentive,comfort,tempOffset,maxTempOffset,age,custom,ledgerSource}){
  const hasIncentive=incentive==='有激励'||incentive==='无激励';
  const effIncentive=hasIncentive?incentive:(incentive==='否'?'无激励':'有激励');
  const hasTemp=Number.isFinite(Number(setTemp))&&setTemp!==''&&setTemp!==null;
  const hasComfort=!!comfort&&comfort!=='—'&&comfort!=='待采集';
  const effMaxOff=Number.isFinite(Number(maxTempOffset))&&maxTempOffset!==''&&maxTempOffset!==null
    ?Number(maxTempOffset):maxOffsetOf(type);
  const effOff=Number.isFinite(Number(tempOffset))&&tempOffset!==''&&tempOffset!==null
    ?Math.min(Number(tempOffset),effMaxOff):Math.min(1,effMaxOff);
  const hasSource=sourcePotential!==null&&sourcePotential!==undefined&&sourcePotential!==''&&Number.isFinite(Number(sourcePotential));
  const hasSafe=safeLimit!==null&&safeLimit!==undefined&&safeLimit!==''&&Number.isFinite(Number(safeLimit));
  return{
    id,name,district,type,acType,
    capacity:Number(capacity)||0,
    baseLoad:Number(baseLoad)||0,
    sourcePotential:hasSource?Number(sourcePotential):undefined,
    safeLimit:hasSafe?Number(safeLimit):undefined,
    age:age||'未采集',
    setTemp:hasTemp?Number(setTemp):26,
    incentive:effIncentive,
    comfort:hasComfort?comfort:'待采集',
    userType:effIncentive==='无激励'?'监测互动':'柔性调节',
    tempOffset:effOff,
    maxTempOffset:effMaxOff,
    priority:priorityOf(type),
    /* 台账字段来源：true=附件1实测；false=新增录入或缺失待采集 */
    ledgerSource:!!ledgerSource,
    hasTempField:hasTemp,
    hasComfortField:hasComfort,
    custom:!!custom
  };
}

    this.list().forEach(rec=>{
      if(BUILDINGS.some(b=>b.id===rec.id))return;
      BUILDINGS.push(buildBuilding({...rec,custom:true,ledgerSource:false}));
    });
  },
  add(obj){
    const rec=buildBuilding({...obj,custom:true,ledgerSource:false});
    const arr=this.list().filter(x=>x.id!==rec.id);arr.push(rec);this.persist(arr);
    const exist=BUILDINGS.find(b=>b.id===rec.id);
    if(exist)Object.assign(exist,rec);else BUILDINGS.push(rec);
    return rec;
  },
  remove(id){
    this.persist(this.list().filter(x=>x.id!==id));
    const i=BUILDINGS.findIndex(b=>b.id===id&&b.custom);
    if(i>=0)BUILDINGS.splice(i,1);
  },

      sourcePotential:list.reduce((s,b)=>s+b.sourcePotential,0)};
    const benchmarks=BUILDING_TYPES.map(c=>{
      const arr=list.filter(b=>b.type===c).map(b=>b.sourcePotential);
      const ref=LOCKED_CITY_BENCHMARKS.find(x=>x.category===c);
      const mean=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:ref.benchmark;
      return{category:c,samples:arr.length,benchmark:mean,
        calcBenchmark:c==='商超'?mean*this.SUPERMARKET_CALIB:mean,fallback:!arr.length};
    });
    const scale={};
    Object.keys(CITY_TIER_FACTORS).forEach(t=>{
      const f=CITY_TIER_FACTORS[t];
      const w=bs=>bs.reduce((s,b)=>s+b.calcBenchmark*(f.shares[b.category]||0),0);
      const base=w(LOCKED_CITY_BENCHMARKS);
      scale[t]=base>0?w(benchmarks)/base:1;
    });
    const den=CITY_DISTRICTS.reduce((s,d)=>s+d.neutral,0);
    const num=CITY_DISTRICTS.reduce((s,d)=>s+d.neutral*(scale[d.tier]??1),0);
    const overallScale=den>0?num/den:1;
    return{source,ids:list.map(b=>b.id),profile,benchmarks,scale,overallScale,
      missing:benchmarks.filter(b=>b.fallback).map(b=>b.category),
      label:source==='all'?'当前楼宇库全量':source==='custom'?'新导入批次':'原始 61 户',
      version:'自定义基准 · '+new Date().toISOString().slice(0,10),
      cityNeutral:this.LOCKED_CITY_TOTALS.neutral*overallScale};
  },
  install(){
    if(!this.state)return;
    CITY_BENCHMARKS.splice(0,CITY_BENCHMARKS.length,...this.state.benchmarks.map(b=>({...b})));
    if(typeof DistrictAlloc!=='undefined'&&Array.isArray(DistrictAlloc.DEFAULT_DISTRICTS)){
      DistrictAlloc.DEFAULT_DISTRICTS.forEach(d=>{
        if(d.__lockedPotential===undefined)d.__lockedPotential=d.potential;
        d.potential=d.__lockedPotential*(this.state.scale[d.tier]??1);
      });
    }
  },
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.state));}catch(e){showToast('基准样本保存失败');}},
  load(){
    /* 自动跟随模式下，基准始终由当前台账现算，忽略历史缓存，避免刷新后口径落后于台账 */
    if(this.auto){this.sync();return;}
    try{
      const s=JSON.parse(localStorage.getItem(this.key)||'null');
      if(!s||!Array.isArray(s.ids)||!Array.isArray(s.benchmarks))return;
      this.state=s;this.install();
    }catch(e){}
  },
  syncTarget(){
    if(typeof DistrictAlloc==='undefined'||!DistrictAlloc.params)return;
    if(DistrictAlloc.autoSyncTarget!==false){
      DistrictAlloc.params['全域削峰总目标'].value=parseFloat(fmt(CityPotential.mw(CityPotential.totals().dispatch20),1));
    }
    DistrictAlloc.compute();
  },
  apply(source){
    const c=this.compute(source||this.selectedSource);
    if(!c){showToast('所选样本没有可用的实测标杆，无法重标定');return;}
    const msg=`确认把「${c.label}」${c.profile.count} 户设为新基准样本？\n\n`
      +'六类业态标杆、38 区县外推结果、附件7 分配权重基准、一致性校验期望值都会同步重算；\n'
      +'原合同锁定口径可用「恢复合同锁定口径」一键还原。';
    if(!confirm(msg))return;
    /* 手动设定基准即视为"锁定当前批次"，暂停自动跟随，避免下一次增删被自动覆盖 */
    this.auto=false;try{localStorage.setItem(this.autoKey,'0')}catch(e){}
    this.state=c;this.preview=null;this.save();this.install();this.syncTarget();
    if(typeof Aggregate!=='undefined'&&Aggregate.synergyBuildings)Aggregate.computeSynergy();
    navigateTo(currentPage);
    showToast(`已切换基准：${c.label} ${c.profile.count} 户 · 全市中性 ${fmt(CityPotential.mw(c.cityNeutral),1)} MW`);
  },
  reset(){
    if(!this.state)return;
    if(!confirm('恢复合同锁定口径 V3.1（61 户 / 1282.05 MW）？当前自定义基准会被清除，自动跟随也会暂停。'))return;
    this.auto=false;try{localStorage.setItem(this.autoKey,'0')}catch(e){}
    this.state=null;localStorage.removeItem(this.key);
    CITY_BENCHMARKS.splice(0,CITY_BENCHMARKS.length,...LOCKED_CITY_BENCHMARKS.map(b=>({...b})));
    if(typeof DistrictAlloc!=='undefined'&&Array.isArray(DistrictAlloc.DEFAULT_DISTRICTS)){
      DistrictAlloc.DEFAULT_DISTRICTS.forEach(d=>{if(d.__lockedPotential!==undefined)d.potential=d.__lockedPotential;});

    navigateTo(currentPage);

  },
  setSource(v){

          return `<tr><td>${b.category}</td><td class="num">${b.samples}${b.fallback?' <span class="badge badge-orange">沿用锁定值</span>':''}</td><td class="num">${fmt(b.calcBenchmark,1)}</td><td class="num" style="color:var(--text-muted)">${fmt(ref.calcBenchmark,1)}</td><td class="num" style="color:${dev>=0?'var(--accent-cyan)':'var(--warning)'}">${dev>0?'+':''}${fmt(dev,1)}%</td></tr>`;}).join('')}</tbody>

/* 标准业务口径（合同报告锁定值），作为 SampleBaseline 的出厂基准 */
const STANDARD_PROFILE={version:'统一业务口径 V3.1（合同锁定）',updated:'2026-09-03',count:61,baseLoad:203819.76,sourcePotential:33107.28};
const DATA_PROFILE={
  get version(){return SampleBaseline.version()},
  get updated(){return STANDARD_PROFILE.updated},
  get expected(){return SampleBaseline.profile()},
  sum(list){return{count:list.length,baseLoad:list.reduce((s,b)=>s+(b.baseLoad||0),0),sourcePotential:list.reduce((s,b)=>s+(b.sourcePotential||0),0)}},
  /* 标准样本 = 当前基准样本集（默认合同锁定 61 户；换样本后为新的基准批次） */
  standard(){return this.sum(BUILDINGS.filter(b=>SampleBaseline.isBaseline(b)))},
  actual(){return this.sum(BUILDINGS)},
  validate(){
    const std=this.standard(),all=this.actual(),exp=this.expected;
    const stdOk=std.count===exp.count&&Math.abs(std.baseLoad-exp.baseLoad)<0.01&&Math.abs(std.sourcePotential-exp.sourcePotential)<0.01;
    const extra=all.count-std.count;
    const status=!stdOk?'mismatch':extra>0?'extended':'standard';
    return{pass:stdOk,status,extra,standard:std,actual:all,expected:exp};
  },
  /* 界面统一口径描述：标准口径是合同锁定值，扩展台账单独说明，不冒充口径异常 */
  describe(){
    const v=this.validate();
    const ref=SampleBaseline.state?'当前自定义基准':'统一业务口径';
    const base=`标准样本 ${v.standard.count} 户 · 基准负荷 ${fmt(v.standard.baseLoad,2)} kW · 可调潜力 ${fmt(v.standard.sourcePotential,2)} kW`;
    if(v.status==='mismatch')return{cls:'warning',icon:'⚠️',label:'口径异常',text:`标准样本与${ref}不一致（${v.standard.count} 户 / ${fmt(v.standard.baseLoad,2)} kW / ${fmt(v.standard.sourcePotential,2)} kW），导出前请核查`};
    if(v.status==='extended')return{cls:'green',icon:'✅',label:'口径一致·已扩展',text:`${base} — 与${ref}一致；当前楼宇库另含 ${v.extra} 栋楼宇（合计 ${v.actual.count} 栋），${SampleBaseline.auto?'已并入基准样本并实时参与测算':'未纳入基准，需手动设为基准后才进入测算'}`};
    return{cls:'green',icon:'✅',label:'口径校验通过',text:`${base} — 与${ref}一致`};
  }
};

/* ============================================================
   第四层：单体调控执行闭环模拟器
   触发→检查→能力判断→策略匹配→执行→校核→升级/降级→恢复
============================================================ */
const SingleExecution={
  /* 执行层能力上限：三级策略中最大可提供量 × 历史响应率。
     协同分配的安全上限直接复用此值，保证"分配得出的任务 = 执行能兑现的量"，
     不再出现分配按 0.95×稳定能力、执行按 参与区域×历史响应率 两套口径。 */
  availableCapacity(building,outdoorTemp,incentive){
    const inc=incentive||building.incentive||'有激励';
    const temp=Number(outdoorTemp)||35;
    const m=StrategyLibrary.match(building,Number.MAX_SAFE_INTEGER,temp,inc);
    const maxAdjustable=Math.max(...m.allLevels.map(l=>l.actualAdjustable));
    return Math.max(0,maxAdjustable*PotentialEngine.getHistoryRate(building));
  },
  buildTimeline(baseline,actualReduction,checkInterval,duration,isVRF,adjustAt=null){
    const holdMinutes=Math.max(checkInterval*2,Number(duration)||60);
    const batches=isVRF?3:2;
    const reboundRate=isVRF?0.06:0.10;
    const points=[
      {minute:-15,stage:'基准观察',load:baseline,reduction:0},
      {minute:0,stage:'指令下发',load:baseline,reduction:0},
      {minute:checkInterval,stage:'响应爬坡',load:baseline-actualReduction*0.65,reduction:actualReduction*0.65}
    ];
    if(Number.isFinite(adjustAt))points.push({minute:adjustAt,stage:'动态指令调整',load:baseline-actualReduction*0.82,reduction:actualReduction*0.82});
    points.push({minute:checkInterval*2,stage:'效果校核',load:baseline-actualReduction,reduction:actualReduction});
    points.push({minute:holdMinutes,stage:'稳定保持',load:baseline-actualReduction,reduction:actualReduction});
    for(let i=1;i<=batches;i++){
      const reduction=actualReduction*(1-i/batches);
      points.push({minute:holdMinutes+i*checkInterval,stage:`恢复第${i}批`,load:baseline-reduction,reduction});
    }
    const recoveryEnd=holdMinutes+batches*checkInterval;
    const rebound=actualReduction*reboundRate;
    points.push({minute:recoveryEnd+checkInterval,stage:'反弹校核',load:baseline+rebound,reduction:-rebound});
    points.push({minute:recoveryEnd+checkInterval*2,stage:'恢复稳定',load:baseline,reduction:0});
    return points.map(p=>({...p,load:Math.round(p.load*100)/100,reduction:Math.round(p.reduction*100)/100}));
  },
  /* ===== 楼宇级安全阈值 =====
     取值全部来自附件7「楼宇互济全局参数总控」第 2~7 行，逐项进入 execute() 判定：
     温度偏移以「基准设定温度」为原点，含末端响应滞后的超调量；
     室外每高于 30℃ 1℃，末端超调 0.10℃（上限 1.5℃），这是温度阈值在高温天才触发的物理原因。 */
  safetyMeta:{
    tempWarn:{sym:'T_warn',label:'温度预警阈值',value:2.5,def:2.5,min:1.0,max:5.0,step:0.1,unit:'℃',desc:'室内温度偏移超过此值触发温度修正，超出部分不再计入可调量'},
    tempRollback:{sym:'T_back',label:'温度紧急回退阈值',value:3.0,def:3.0,min:2.0,max:6.0,step:0.1,unit:'℃',desc:'偏移超过此值立即回退基准温度，本轮调控取消'},
    loadDev:{sym:'ε_load',label:'负荷偏差触发阈值',value:0.10,def:0.10,min:0.02,max:0.30,step:0.01,unit:'比例',desc:'实际削减与目标偏差超过此比例才启动逐级调令修正'},
    chwMax:{sym:'T_chw',label:'冷冻水最高温度',value:10.0,def:10.0,min:8.0,max:14.0,step:0.5,unit:'℃',desc:'冷水机组出水温度安全上限，超出部分不作为可调量'},
    compMax:{sym:'η_comp',label:'压缩机最高负荷率',value:0.90,def:0.90,min:0.70,max:1.00,step:0.01,unit:'比例',desc:'多联机压缩机负荷率安全上限，超出部分按比例折减可调量'},
    envSwing:{sym:'ΔT_env',label:'环境突变温度阈值',value:3.0,def:3.0,min:1.0,max:8.0,step:0.5,unit:'℃/15min',desc:'室外温度 15 分钟波动超过此值转应急待命，不执行调控'}
  },
  sGet(k){const m=this.safetyMeta[k];return m?Number(m.value):0;},
  sSet(k,v){const m=this.safetyMeta[k];if(!m)return null;const n=Number(v);if(!Number.isFinite(n))return null;m.value=Math.min(m.max,Math.max(m.min,n));return m.value;},
  sReset(){Object.values(this.safetyMeta).forEach(m=>{m.value=m.def;});},
  /* 末端超调：室外温度高于 30℃ 时，末端响应滞后导致实际室温额外上浮 0.1℃/℃ */
  overshootOf(outdoorTemp){return Math.min(1.5,Math.max(0,((Number(outdoorTemp)||35)-30)*0.10));},
  /**
   * 安全边界校验：给定温度偏移，返回各项阈值实算值与综合折减系数
   * @returns {{factor:number,rollback:boolean,emergency:boolean,rows:Array,realOffset:number,overshoot:number,loadRate:number,chw:number|null}}
   */
  safetyCheck(building,tempOffset,outdoorTemp,outdoorSwing=0,targetReduction=0){
    const meta=this.safetyMeta, off=Math.max(0,Number(tempOffset)||0);
    const os=this.overshootOf(outdoorTemp), real=off+os;
    const isChiller=(building.acType||'').includes('冷水机组');
    const isVRF=(building.acType||'').includes('多联机');
    const loadRate=building.capacity>0?building.baseLoad/building.capacity:0;
    const chw=isChiller?7+off*1.5:null;
    const swing=Math.max(0,Number(outdoorSwing)||0);
    const rows=[]; let factor=1, rollback=false, emergency=false;

    /* ① 环境突变（最高优先：室外剧变时一律不执行） */
    const sTh=this.sGet('envSwing');
    rows.push({key:'envSwing',label:'环境突变',val:swing.toFixed(1)+' ℃/15min',limit:'≤ '+sTh+' ℃',state:swing>sTh+1e-9?'over':'ok',
      note:swing>sTh?'室外温度剧变，转应急待命，不下发调控指令':'室外温度平稳，可正常下发'});
    if(swing>sTh+1e-9){emergency=true;factor=0;}

    /* ② 温度紧急回退 → ③ 温度预警（同一物理量，先判上限） */
    const rTh=this.sGet('tempRollback'), wTh=this.sGet('tempWarn');
    rows.push({key:'tempRollback',label:'温度紧急回退',val:real.toFixed(2)+' ℃',limit:'≤ '+rTh+' ℃',state:real>rTh+1e-9?'over':'ok',
      note:real>rTh+1e-9?'已超紧急回退阈值，立即回退基准温度':(real>wTh+1e-9?'未触及回退阈值，但已进入预警区':'距回退阈值 '+Math.max(0,rTh-real).toFixed(2)+' ℃')});
    if(real>rTh+1e-9){rollback=true;factor=0;}
    const warnOver=real>wTh+1e-9;
    rows.push({key:'tempWarn',label:'温度预警',val:real.toFixed(2)+' ℃（设定 '+off.toFixed(2)+' + 超调 '+os.toFixed(2)+'）',limit:'≤ '+wTh+' ℃',state:emergency||rollback?'skip':(warnOver?'warn':'ok'),
      note:emergency||rollback?'本轮不执行，不触发温度修正':(warnOver?`超出 ${(real-wTh).toFixed(2)} ℃，温度偏移压回 ${Math.max(0,wTh-os).toFixed(2)} ℃，超出部分不计可调量`:'未触及预警阈值')});
    if(!emergency&&!rollback&&warnOver&&off>0){
      const capped=Math.max(0,wTh-os);
      factor*=Math.max(0,Math.min(1,capped/off));
    }

    /* ④ 冷冻水最高温度（仅冷水机组；出水温度随末端温度偏移等比上浮 1.5 倍） */
    if(isChiller){
      const cTh=this.sGet('chwMax');
      const over=chw>cTh+1e-9;
      rows.push({key:'chwMax',label:'冷冻水出水温度',val:chw.toFixed(2)+' ℃',limit:'≤ '+cTh+' ℃',state:emergency||rollback?'skip':(over?'warn':'ok'),
        note:emergency||rollback?'本轮不执行':(over?`超出 ${(chw-cTh).toFixed(2)} ℃，安全出水上限折算折减 ${((cTh-7)/(1.5*Math.max(off,.01))*100).toFixed(0)}%`:(cTh-chw<0.051?'恰在安全上限，无余量可再上调':`安全余量 ${(cTh-chw).toFixed(2)} ℃`))});
      if(!emergency&&!rollback&&over&&off>0)factor*=Math.max(0,Math.min(1,(cTh-7)/(1.5*off)));
    }else if(isVRF){
      rows.push({key:'chwMax',label:'冷冻水出水温度',val:'不适用',limit:'—',state:'skip',note:'多联机无冷冻水环路，本项不参与'});
    }else{
      rows.push({key:'chwMax',label:'冷冻水出水温度',val:'不适用',limit:'—',state:'skip',note:'风冷机组无冷冻水环路，本项不参与'});
    }

    /* ⑤ 压缩机最高负荷率（仅多联机；负荷率=基准负荷/额定容量） */
    if(isVRF){
      const pTh=this.sGet('compMax');
      const over=loadRate>pTh+1e-9;
      rows.push({key:'compMax',label:'压缩机负荷率',val:(loadRate*100).toFixed(1)+' %',limit:'≤ '+(pTh*100).toFixed(0)+' %',state:emergency||rollback?'skip':(over?'warn':'ok'),
        note:emergency||rollback?'本轮不执行':(over?`设备已接近满载，超出安全负荷率的裕度不计入可调量，折减 ${((pTh/loadRate)*100).toFixed(0)}%`:'设备有调节裕度')});
      if(!emergency&&!rollback&&over)factor*=Math.max(0,Math.min(1,pTh/loadRate));
    }else{
      rows.push({key:'compMax',label:'压缩机负荷率',val:`不适用（冷机负荷率 ${(loadRate*100).toFixed(1)}%）`,limit:'—',state:'skip',
        note:loadRate>0.9?'附件该项为多联机阈值，冷机已接近满载但按原口径不折减':'附件该项为多联机安全阈值，冷水机组不参与'});
    }

    /* ⑥ 负荷偏差触发：仅作展示，实际用于判断是否启动逐级调令 */
    const dTh=this.sGet('loadDev');
    rows.push({key:'loadDev',label:'负荷偏差触发',val:'执行后回填',limit:'> '+(dTh*100).toFixed(0)+' %',state:'info',
      note:`偏差超 ${(dTh*100).toFixed(0)}% 才启动逐级调令，避免小幅缺口频繁升降级`});

    return{factor:Math.max(0,Math.min(1,factor)),rollback,emergency,rows,realOffset:real,overshoot:os,loadRate,chw,tempOffset:off};
  },
  /**
   * 执行单体调控闭环模拟
   * @param {Object} building - 楼宇对象
   * @param {number} targetReduction - 目标削减量
   * @param {number} outdoorTemp - 室外温度
   * @param {string} incentive - 激励政策
   * @param {number} outdoorSwing - 室外温度 15 分钟波动幅度℃（环境突变判定用）
   * @returns {Object} 执行过程记录
   */
  execute(building,targetReduction,outdoorTemp,incentive,duration=60,monitorFeedback=1,startLevel=0,outdoorSwing=0){
    /* 达标偏差 δ：直接取协同页「任务允许偏差」，让参数真正参与判定（缺省 5%） */
    const dev=(()=>{try{const v=Number(Aggregate.synergyParams['任务允许偏差'].value);return v>0?v:0.05;}catch(e){return 0.05;}})();
    const setTemp=building.setTemp??26;
    const match=StrategyLibrary.match(building,targetReduction,outdoorTemp,incentive);
    const isMixed=building.acType.includes('多联机')&&building.acType.includes('冷水机组');
    const isVRF=building.acType.includes('多联机')&&!building.acType.includes('冷水机组');
    const checkInterval=isVRF?5:15; // 混合系统按较慢的水冷响应周期统一校核
    duration=Math.max(checkInterval*2,Number(duration)||60);
    const executedAt=new Date().toLocaleString('zh-CN',{hour12:false});
    const phases=[];
    /* 安全阈值校验：按本次匹配的最高温度偏移一次性算出综合折减与逐项结果 */
    const safety=this.safetyCheck(building,match.tempOffset,outdoorTemp,outdoorSwing,targetReduction);

    // 阶段1：任务触发
    phases.push({phase:'任务触发',status:'done',time:'0min',
      desc:`接收调控任务，目标削减 ${targetReduction}kW，记录基准负荷 ${building.baseLoad}kW`});

    // 阶段2：状态检查
    const checkOK=building.available!==false;
    phases.push({phase:'状态检查',status:checkOK?'done':'blocked',time:`${checkInterval}min`,
      desc:checkOK?'设备、通信、计量正常，存在可调区域，通过检查':'设备异常或无可调区域，阻断执行'});

    if(!checkOK){
      return{building:building.name,success:false,phases:phases,match:match,
        target:targetReduction,actualReduction:0,achievementRate:0,reason:'状态检查未通过，不具备调控条件',exitReason:'设备或通信状态异常'};
    }

    // 环境突变阻断：室外温度 15 分钟波动超阈值时不下发任何调控指令
    if(safety.emergency){
      phases.push({phase:'环境校核',status:'blocked',time:'0min',
        desc:`室外温度 15 分钟波动 ${Math.max(0,Number(outdoorSwing)||0).toFixed(1)}℃ 超阈值 ${this.sGet('envSwing')}℃，转应急待命，本轮不下发调控指令`});
      return{building:building.name,type:building.type,acType:building.acType,success:false,phases,safety,
        target:targetReduction,actualReduction:0,achievementRate:0,monitorFeedback:1,adjustments:[],
        checkInterval,strategyCode:match.strategyCode,finalLevel:match.matchedLevel,initialLevel:match.matchedLevel,
        reason:'室外温度突变，转应急待命',exitReason:'室外温度剧变转应急待命，返回剩余缺口',
        comfortLoss:0,restricted:'室外温度突变，暂停调控',duration:Number(duration)||60,executedAt,reboundPeak:0};
    }

    // 阶段3：能力判断
    const capacity=PotentialEngine.calc(building,outdoorTemp,setTemp,incentive,match.tempOffset);
    phases.push({phase:'能力判断',status:'done',time:`${checkInterval*2}min`,
      desc:`当前可调潜力 ${capacity.potential}kW（${capacity.potentialPct}%），安全上限 ${capacity.maxPotential}kW`});

    // 阶段3b：安全边界校验（温度预警 / 温度紧急回退 / 冷冻水上限 / 压缩机负荷率）
    const safetyHits=safety.rows.filter(r=>r.state==='warn'||r.state==='over');
    phases.push({phase:'安全边界校验',status:safety.rollback?'blocked':(safetyHits.length?'warning':'done'),time:`${checkInterval*2}min`,
      desc:safety.rollback
        ? `室内温度偏移 ${safety.realOffset.toFixed(2)}℃ 超紧急回退阈值 ${this.sGet('tempRollback')}℃，回退基准温度，本轮撤销`
        : (safetyHits.length
            ? `${safetyHits.map(r=>r.label+' '+r.val+'（限 '+r.limit+'）').join('；')}；可调量按 ${Math.round(safety.factor*100)}% 计入`
            : `温度偏移 ${safety.realOffset.toFixed(2)}℃、设备负荷率 ${(safety.loadRate*100).toFixed(0)}%、冷冻水 ${safety.chw==null?'不适用':safety.chw.toFixed(1)+'℃'}，各项均在安全边界内`)});

    if(safety.rollback){
      phases.push({phase:'指令回退',status:'blocked',time:`${checkInterval*3}min`,
        desc:`按温度紧急回退阈值执行：恢复基准设定温度 ${setTemp}℃，撤销本轮调令，缺口由平台重新分配`});
      return{building:building.name,type:building.type,acType:building.acType,success:false,phases,safety,
        target:targetReduction,actualReduction:0,achievementRate:0,monitorFeedback:1,adjustments:[],
        checkInterval,strategyCode:match.strategyCode,finalLevel:match.matchedLevel,initialLevel:match.matchedLevel,
        reason:'室内温度超紧急回退阈值，指令已回退',exitReason:'室内温度超紧急回退阈值，回退基准温度，返回剩余缺口',
        comfortLoss:Math.round(match.tempOffset*10)/10,restricted:'温度超紧急回退阈值',duration:Number(duration)||60,executedAt,reboundPeak:0};
    }

    // 阶段4：策略匹配
    phases.push({phase:'策略匹配',status:'done',time:`${checkInterval*2}min`,
      desc:`匹配到 ${match.matchedLevel===1?'Ⅰ级':match.matchedLevel===2?'Ⅱ级':'Ⅲ级'}策略 ${match.matchedLevelName}，编码 ${match.strategyCode}${isMixed?'；分别调用多联机末端与水冷末端/冷源分支':''}`});

    // 阶段5：指令执行
    phases.push({phase:'指令执行',status:'active',time:`${checkInterval*3}min`,
      desc:`下发指令：末端温度上调 ${match.tempOffset}℃，参与区域 ${Math.round(match.zoneFraction*100)}%，互动目标 ${match.interactiveTarget}%`});

    // 阶段6：效果校核（与协同分配同源：能力取三级策略最大可提供量 × 历史响应率）
    // 监测反馈：monitorFeedback<1 表示现场监测到实际响应低于预期，触发指令动态调整
    const feedback=Math.min(1,Math.max(0,Number(monitorFeedback)||1));
    const responseRate=PotentialEngine.getHistoryRate(building);
    const capacityAdjustable=Math.max(...match.allLevels.map(l=>l.actualAdjustable));
    const initialLevel=startLevel>=1&&startLevel<=3?startLevel:match.matchedLevel;
    // 监测反馈=1 时按三级最大能力校核（与协同分配同源，保持既有口径）；
    // 反馈<1 时按实际下发的初始等级能力校核，才能真实反映"监测到打折→缺口→升级"的闭环。
    const forcedLevel=startLevel>=1&&startLevel<=3&&startLevel<match.matchedLevel;
    const initialCapacity=(feedback<1||forcedLevel)?(match.allLevels.find(l=>l.level===initialLevel)?.actualAdjustable??capacityAdjustable):capacityAdjustable;
    const initialReduction=PotentialEngine.actualReduction(building,targetReduction,initialCapacity*feedback*safety.factor);
    let currentLevel=initialLevel;
    let actualReduction=initialReduction;
    let remainingGap=Math.max(0,targetReduction-actualReduction);
    const adjustments=[];
    phases.push({phase:'效果校核',status:remainingGap<=targetReduction*dev?'done':'warning',time:`${checkInterval*4}min`,
      desc:`三级策略最大可提供量 ${Math.round(capacityAdjustable)}kW × 历史响应率 ${Math.round(responseRate*100)}%${feedback<1?` × 监测反馈 ${Math.round(feedback*100)}%`:''}${safety.factor<1?` × 安全折减 ${Math.round(safety.factor*100)}%`:''}，实际削减 ${Math.round(actualReduction)}kW${remainingGap>0?`，剩余缺口 ${Math.round(remainingGap)}kW`:'，达到目标'}`});

    // 阶段6b：动态指令调整——缺口率超「负荷偏差触发阈值」才逐级升级，避免小幅缺口频繁升降级
    const loadDevTh=this.sGet('loadDev');
    const gapRateOf=g=>targetReduction>0?g/targetReduction:1;
    if(remainingGap>0.01&&gapRateOf(remainingGap)>loadDevTh&&currentLevel<3){
      const stratForType=StrategyLibrary.STRATEGIES[building.type]||StrategyLibrary.STRATEGIES['办公写字楼'];
      for(let lv=currentLevel+1;lv<=3;lv++){
        const up=match.allLevels.find(l=>l.level===lv);
        if(!up)continue;
        const upReduction=PotentialEngine.actualReduction(building,targetReduction,up.actualAdjustable*feedback*safety.factor);
        if(upReduction<=actualReduction+0.01)continue;
        const fromLevel=currentLevel;
        const fromCode=currentLevel===initialLevel?match.strategyCode:adjustments[adjustments.length-1].toCode;
        const toCode=StrategyLibrary.genCode(building.type,building.acType,'柔性调节',up.code);
        currentLevel=lv;actualReduction=upReduction;
        remainingGap=Math.max(0,targetReduction-actualReduction);
        adjustments.push({fromLevel,toLevel:lv,fromCode,toCode,
          trigger:`监测反馈 ${Math.round(feedback*100)}% 下校核剩余缺口 ${Math.round(targetReduction-initialReduction)}kW`,
          reason:lv===3?'已达最高级Ⅲ级，追加至安全边界':`${fromLevel===1?'Ⅰ':fromLevel===2?'Ⅱ':'Ⅲ'}级不足，升级至${lv===1?'Ⅰ':lv===2?'Ⅱ':'Ⅲ'}级重新下发`,
          afterReduction:Math.round(upReduction*100)/100,remainingGap:Math.round(remainingGap*100)/100,
          time:`${checkInterval*(4+adjustments.length)}min`});
        phases.push({phase:'动态指令调整',status:remainingGap<=targetReduction*dev?'done':'warning',
          time:`${checkInterval*(4+adjustments.length)}min`,
          desc:`监测发现缺口，指令由 ${fromLevel===1?'Ⅰ':fromLevel===2?'Ⅱ':'Ⅲ'}级（${fromCode}）升级为 ${lv===1?'Ⅰ':lv===2?'Ⅱ':'Ⅲ'}级（${toCode}）重新下发；削减升至 ${Math.round(upReduction)}kW${remainingGap>0?`，仍余缺口 ${Math.round(remainingGap)}kW`:'，达标'}`});
        if(remainingGap<=0.01)break;
      }
    }else if(remainingGap>0.01&&currentLevel>=3){
      phases.push({phase:'动态指令调整',status:'warning',time:`${checkInterval*4}min`,
        desc:`已达最高级Ⅲ级（${match.strategyCode}）仍余缺口 ${Math.round(remainingGap)}kW，按边界规则上报平台由其他楼宇/互济补足，不再升级本级指令`});
    }
    const finalStrategyCode=adjustments.length?adjustments[adjustments.length-1].toCode:match.strategyCode;

    phases.push({phase:'稳定保持',status:'done',time:`至${duration}min`,
      desc:`按当前策略保持 ${duration}min，期间每 ${checkInterval}min 复核一次负荷与设备状态`});

    // 阶段7：恢复
    phases.push({phase:'分批恢复',status:'done',time:`${duration}min后`,
      desc:`重点区域优先恢复，末端先行冷源后调，每批观察 ${checkInterval}min，分 ${isVRF?3:isMixed?3:2} 批恢复`});

    /* 回填负荷偏差实算值：让「负荷偏差触发阈值」在每栋楼的校验表里可见 */
    const gapRow=safety.rows.find(r=>r.key==='loadDev');
    if(gapRow){
      const gr=targetReduction>0?Math.max(0,targetReduction-actualReduction)/targetReduction:0;
      const th=this.sGet('loadDev');
      gapRow.val=(gr*100).toFixed(1)+' %';
      gapRow.state=gr>th+1e-9?'warn':'ok';
      gapRow.note=gr>th+1e-9?`偏差 ${(gr*100).toFixed(1)}% 超阈值 ${(th*100).toFixed(0)}%，已按规则逐级调令修正`
        :`偏差 ${(gr*100).toFixed(1)}% 未达阈值 ${(th*100).toFixed(0)}%，不启动调令修正`;
    }
    const finalReduction=actualReduction;
    const timeline=this.buildTimeline(building.baseLoad,finalReduction,checkInterval,duration,isVRF,adjustments.length?checkInterval*(4+adjustments.length):null);
    const reboundPeak=Math.max(...timeline.map(p=>p.load))-building.baseLoad;
    const achievementRate=targetReduction>0?Math.round(finalReduction/targetReduction*1000)/10:0;
    const exitReason=achievementRate>=100*(1-dev)?'目标完成，按计划退出'
      :(safety.factor<1?'受温度/设备安全阈值限制，返回剩余缺口'
      :match.restricted?'受安全边界限制，返回剩余缺口':'可用潜力或历史响应率不足');
    return{
      building:building.name,
      type:building.type,
      acType:building.acType,
      success:true,
      target:targetReduction,
      actualReduction:Math.round(finalReduction*100)/100,
      achievementRate,
      finalLevel:currentLevel,
      strategyCode:finalStrategyCode,
      initialLevel,
      initialReduction:Math.round(initialReduction*100)/100,
      monitorFeedback:feedback,
      adjustments,
      checkInterval:checkInterval,
      phases:phases,
      timeline,
      duration:Number(duration)||60,
      executedAt,
      reboundPeak:Math.round(reboundPeak*100)/100,
      exitReason,
      comfortLoss:Math.round(match.tempOffset*10)/10,
      restricted:match.restricted,
      safety
    };
  }
};

  /* 模型原理：三条公式 + 符号区间表，供现场讲解 */
  modelPrinciple(){
    return `<details class="calc-logic model-logic" style="margin-top:14px">
      <summary>🧮 模型原理 <span class="calc-hint">单栋计算 · 三支模型 · 符号与取值区间</span></summary>
      <div class="calc-body model-body">
        <div class="grp-cap">公共前置量 <em>· 三类楼宇共用</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">① 温度分段</span><span class="fexpr">band = 30-34℃ / 35-39℃ / 40℃以上　（按 T<sub>out</sub> 判段）</span></div>
          <div class="formula-row"><span class="fcase">② 目标设定</span><span class="fexpr">T<sub>in</sub> = T<sub>s</sub> + Δt　，　Δt ≤ 楼宇上调上限</span></div>
          <div class="formula-row"><span class="fcase">②′ 幅度口径</span><span class="fexpr">ΔP 以「上调 1℃」实测标定为基准，按 Δt 线性放大　<em>（1℃ 最可靠，2℃ 为外推值、偏乐观）</em></span></div>
        </div>

        <div class="grp-cap">分支 A · 有实测标杆 <em>· ${DATA_PROFILE.standard().count} 栋样本楼全部适用</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">③ 温度修正</span><span class="fexpr">f<sub>温</sub> = r(band) ÷ r<sub>0</sub></span></div>
          <div class="formula-row"><span class="fcase">④ 响应修正</span><span class="fexpr">f<sub>响</sub> = max( α ÷ α<sub>0</sub> , K<sub>p</sub> )</span></div>
          <div class="formula-row"><span class="fcase">⑤ 分支潜力</span><span class="fexpr">ΔP = min[ P<sub>实测</sub> × f<sub>温</sub> × f<sub>响</sub> × Δt , P ]</span></div>
        </div>

        <div class="grp-cap">分支 B · 多联机 <em>· 无实测标杆的新增楼宇</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">⑥ 分支潜力</span><span class="fexpr">ΔP = min[ P × α × K × ( T<sub>out</sub> − T<sub>in</sub> ) , P ]</span></div>
        </div>

        <div class="grp-cap">分支 C · 冷水机组 <em>· 无实测标杆的新增楼宇</em></div>
        <div class="formula-list">
          <div class="formula-row"><span class="fcase">⑦ 分支潜力</span><span class="fexpr">ΔP = min[ P × η × α × Δt　+　P × 3% × Δt × 0.5 , P ]</span></div>
        </div>

        <div class="calc-note" style="margin-top:14px">三支<b>互斥、不叠加</b>：楼宇有实测标杆即取 A 支，否则按空调类型取 B 或 C 支。分支 C 第一项是末端削减（乘 α，依赖用户响应），第二项是冷冻水供水温度提升带来的设备侧收益（不乘 α）。<b>封顶说明</b>：三支结果统一按 min(·, P) 钳到基准负荷——削减量不可能大于该楼自身用冷总量（等于全部关停）；与安全上限（P × 30% 或台账值）比较时仍只标注风险、不截断。<b>Δt 说明</b>：<b>设定温度 T<sub>s</sub> 本身不放大潜力</b>（其影响已含在实测标杆内），只有上调幅度 Δt 放大；Δt&gt;1 为线性外推，2℃ 结果偏乐观。</div>

        <div class="sym-cap">符号含义与取值区间</div>
        <table class="sym-tb">
          <thead><tr><th>符号</th><th>含义</th><th>取值 / 区间</th></tr></thead>
          <tbody>
            <tr><td>ΔP</td><td>单栋可调潜力</td><td>计算输出（kW），三支取其一</td></tr>
            <tr><td>P</td><td>基准负荷</td><td>400～20000 kW，取台账实测</td></tr>
            <tr><td>P<sub>实测</sub></td><td>实测标杆</td><td>44～1820 kW，61 栋逐栋实测值</td></tr>
            <tr><td>band</td><td>室外温度分段</td><td>T<sub>out</sub> &lt; 35℃ → 30-34℃；35 ≤ T<sub>out</sub> &lt; 40℃ → 35-39℃；T<sub>out</sub> ≥ 40℃ → 40℃以上</td></tr>
            <tr><td>T<sub>out</sub> / T<sub>in</sub></td><td>室外温度 / 目标设定温度</td><td>T<sub>in</sub> = T<sub>s</sub> + Δt；设定温度 T<sub>s</sub> 取 22～27℃</td></tr>
            <tr><td>Δt</td><td>温度上调幅度</td><td>0～楼宇上限（1～2℃），默认 1℃；<b>唯一放大来源</b>。设定温度 T<sub>s</sub> 本身不放大潜力（影响已含在实测标杆内）。Δt&gt;1 为线性外推，2℃ 偏乐观</td></tr>
            <tr><td>r / r<sub>0</sub></td><td>单位温升实测削减率 / 基准段值</td><td>多联机 0.1699、水冷机 0.1106（35-39℃ 段）；r<sub>0</sub> 即该基准段值</td></tr>
            <tr><td>f<sub>温</sub></td><td>温度修正因子</td><td>多联机 0.46～1.00、水冷机 0.80～1.00；基准段（35-39℃）= 1</td></tr>
            <tr><td>α / α<sub>0</sub></td><td>用户响应系数 / 锚定值</td><td>α 取 0～0.10（按业态 × 激励查表）；α<sub>0</sub> 为该业态「有激励」值</td></tr>
            <tr><td>K<sub>p</sub></td><td>被动执行达成率</td><td>0.60；α 比值低于此值时按下限折减，不清零</td></tr>
            <tr><td>f<sub>响</sub></td><td>响应修正因子</td><td>0.60～0.75，按业态 α 比值与 K<sub>p</sub> 取大</td></tr>
            <tr><td>K</td><td>多联机本体可调系数</td><td>0.04～0.30 /℃，按系统 × 业态 × T<sub>in</sub> × band 标定</td></tr>
            <tr><td>η</td><td>冷水机本体可调系数</td><td>0.05～0.18 /℃，标定方式同 K</td></tr>
            <tr><td>3% · 0.5</td><td>冷冻水温能效收益</td><td>水温每升 1℃ 机组功耗降约 3%，可利用率取 50%</td></tr>
          </tbody>
        </table>
        ${ParameterCatalog.renderInline('本模型参数取值与来源',['实测标杆情景修正','单体执行仿真'])}
      </div>
    </details>`;
  },
  render(){
    const el=document.getElementById('page-ledger');
    const _sk=ScrollKeeper.capture();
    /* 计算参数已并入「单栋模型参数依据」块：重渲染前记住展开态，避免调参后自动收起 */
    const pBlock=document.getElementById('lgParamBlock');
    if(pBlock)this.paramOpen=pBlock.open;
    const types=['全部',...new Set(BUILDINGS.map(b=>b.type))];
    const acs=['全部',...new Set(BUILDINGS.map(b=>b.acType))];
    const districts=['全部',...new Set(BUILDINGS.map(b=>b.district))];
    /* 删除扩展楼宇后，筛选值可能失效，回落到全部 */
    if(!types.includes(this.filterType))this.filterType='全部';
    if(!acs.includes(this.filterAC))this.filterAC='全部';
    if(!districts.includes(this.filterDistrict))this.filterDistrict='全部';

    let filtered=BUILDINGS;
    if(this.filterType!=='全部')filtered=filtered.filter(b=>b.type===this.filterType);
    if(this.filterAC!=='全部')filtered=filtered.filter(b=>b.acType===this.filterAC);
    if(this.filterDistrict!=='全部')filtered=filtered.filter(b=>b.district===this.filterDistrict);
    /* 聚焦行若被筛掉，自动取消聚焦，避免明细表空白 */
    if(this.focusId!=null&&!filtered.some(b=>b.id===this.focusId))this.focusId=null;

    const offsetArg=this.tempMode==='building'?'按楼宇配置':this.tempOffset;
    const results=PotentialEngine.calcAll(filtered,this.outdoorTemp,null,this.incentive,offsetArg);
    const summary=PotentialEngine.summarize(results);
    const filteredBaseLoad=filtered.reduce((s,b)=>s+b.baseLoad,0);
    /* 锚点口径合计（与全市页"样本潜力"同源）：Σ实测标杆，缺标杆的扩展户计 0；
       当前参数合计（summary.total）随温度/激励情景变化，作副注展示 */
    const anchorTotal=filtered.reduce((s,b)=>s+(Number.isFinite(b.sourcePotential)?b.sourcePotential:0),0);
    /* 双口径：出厂参数态下"当前设定"锚定实测标杆；改动任一计算参数后切回模型解算值 */
    const factoryMode=this.isFactoryParams();
    const displayKW=factoryMode?anchorTotal:summary.total;
    const scenDiffKW=displayKW-anchorTotal;
    const scenDiffPct=anchorTotal?Math.round(scenDiffKW/anchorTotal*1000)/10:0;
    const scenDiffTxt=factoryMode
      ?'出厂参数 · 当前设定＝实测标杆'

      if(key==='maxTempOffset')b.tempOffset=Math.min(b.tempOffset,b.maxTempOffset);

         <div class="stat-card"><div class="stat-icon ${(r.capped||r.comfortExcess>0)?'orange':'green'}">${(r.capped||r.comfortExcess>0)?'⚠️':'✅'}</div><div class="stat-value" style="font-size:20px">${r.comfortExcess>0?'超舒适区':(r.capped?'口径待核':'正常')}</div><div class="stat-label">${r.comfortExcess>0?`舒适上限 ${r.comfortHigh}℃ · 超出 ${r.comfortExcess}℃`:(r.capped?`潜力比安全上限 ${fmt(r.maxPotential,1)} kW 高 5% 以上 · 仅提示不裁剪`:`安全上限 ${fmt(r.maxPotential,1)} kW · 仅提示不裁剪`)}</div></div>

  },

  openAdd(editId){
    const b=editId?BUILDINGS.find(x=>x.id===editId&&x.custom):null;

    const cLow=cm?cm[1]:(b?'':'24'), cHigh=cm?cm[2]:(b?'':'26');
